<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mahjong Solitaire · CantoBuddy</title>
<script src="/games-common.js"></script>
<link rel="stylesheet" href="/games-common.css" />
<script src="/game-sound.js"></script>
<script src="/game-core.js"></script>
<style>
  .menu-hero { text-align:center; margin: 8px 0 4px; }
  .menu-hero .big { font-size: 3.2rem; }
  .menu-hero .sub { color: var(--muted); font-size: 1.05rem; }
  .levels { display:flex; gap:10px; margin: 6px 0; }
  .levels button { flex:1; min-height:58px; border-radius:14px; border:1px solid var(--line); background:#fff; font:inherit; font-weight:800; font-size:1.1rem; cursor:pointer; }
  .levels button.on { background: var(--primary); color:#fff; border-color:var(--primary); }

  .hud { display:flex; gap:10px; align-items:center; justify-content:space-between; margin: 8px 0; flex-wrap:wrap; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 14px; font-weight:800; font-size:1.05rem; }
  .stat small { display:block; font-size:.72rem; color:var(--muted); font-weight:700; }
  .hud .btn { min-height:48px; padding:0 16px; }

  .board-scroll { overflow:auto; -webkit-overflow-scrolling:touch; margin: 10px 0; text-align:center; max-height: calc(100vh - 230px); }
  .board { position:relative; margin:0 auto; }
  .tile {
    position:absolute; width:46px; height:58px; border-radius:8px;
    background: linear-gradient(160deg,#ffffff,#eef2f8); border:1px solid #c2cddd;
    /* 3D thickness: a solid bottom "lip" + soft drop shadow */
    box-shadow: 0 4px 0 #c2cad8, 0 6px 9px rgba(23,26,35,.22);
    display:flex; align-items:center; justify-content:center; font-size:1.7rem; cursor:pointer; user-select:none;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  /* Higher layers get a deeper shadow so stacked tiles clearly look taller. */
  .tile.layer-1 { box-shadow: 0 5px 0 #aab4c6, 0 8px 12px rgba(23,26,35,.26); }
  .tile.layer-2 { box-shadow: 0 6px 0 #94a0b4, 0 10px 15px rgba(23,26,35,.30); }
  .tile.layer-3 { box-shadow: 0 7px 0 #808da3, 0 12px 18px rgba(23,26,35,.34); }
  /* Locked (covered) tiles are dimmed so the free ones stand out. */
  .tile.locked { filter: saturate(.55) brightness(.95); }
  .tile.locked:active { transform: translateY(2px); }
  /* Free tiles: bright, blue outline, gentle gold glow so they're unmistakable. */
  .tile.free {
    border-color: var(--primary); background: linear-gradient(160deg,#ffffff,#e8f0ff);
    box-shadow: 0 4px 0 #9fb6e6, 0 6px 12px rgba(43,108,240,.35), 0 0 0 2px rgba(43,108,240,.25);
  }
  .tile.free:active { transform: translateY(2px); }
  .tile.sel { outline:3px solid var(--gold); transform: translateY(-3px); z-index: 50 !important; }
  .tile.hint { animation: hintp .7s ease infinite alternate; z-index: 40 !important; }
  @keyframes hintp { from { box-shadow:0 4px 0 #9fb6e6,0 0 0 0 rgba(246,183,60,0);} to { box-shadow:0 4px 0 #9fb6e6,0 0 0 7px rgba(246,183,60,.55);} }
  .tile.gone { display:none; }

  .controls { display:flex; gap:10px; margin: 10px 0; flex-wrap:wrap; }
  .controls .btn { flex:1; min-width:120px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="/?view=games">← CantoBuddy</a>
    <h1 class="title" data-k="title">Mahjong Solitaire</h1>
    <div class="topbar-actions">
      <button class="iconbtn" id="musicBtn" title="Music">🎶</button>
      <button class="iconbtn" id="soundBtn" title="Sound">🔊</button>
      <button class="iconbtn" id="rulesBtn" type="button" title="How to play" aria-label="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><path d="M12 17.1h.01"/></svg>
      </button>
    </div>
  </div>

  <div id="menuView">
    <div class="menu-hero">
      <div class="big">🀄</div>
      <div class="sub" data-k="sub">Match the free tiles in pairs</div>
    </div>
    <div class="panel">
      <div class="field">
        <label data-k="yourName">Your name</label>
        <input type="text" id="nameInput" maxlength="12" data-k="namePlaceholder" placeholder="Your name" />
      </div>
      <div class="field">
        <label data-k="levelLabel">Level</label>
        <div class="levels" id="levels">
          <button data-level="easy" class="on" data-k="lvEasy">Easy</button>
          <button data-level="medium" data-k="lvMedium">Medium</button>
          <button data-level="hard" data-k="lvHard">Hard</button>
        </div>
      </div>
      <button class="btn primary block" id="startBtn" data-k="startBtn">Start game</button>
      <div id="cbScoreHistory" class="cb-score-history hidden"></div>
    </div>
  </div>

  <div id="gameView" class="hidden">
    <div class="hud">
      <div class="stat"><small data-k="timeLabel">Time</small><span id="timeStat">0:00</span></div>
      <div class="stat"><small data-k="tilesLabel">Tiles left</small><span id="tilesStat">0</span></div>
      <div class="stat"><small data-k="pairsLabel">Matched</small><span id="pairsStat">0</span></div>
    </div>
    <div class="board-scroll">
      <div class="board" id="board"></div>
    </div>
    <div class="controls">
      <button class="btn ghost" id="hintBtn" data-k="hintBtn">Hint</button>
      <button class="btn ghost" id="shuffleBtn" data-k="shuffleBtn">Shuffle</button>
      <button class="btn ghost" id="restartBtn" data-k="restartBtn">Restart</button>
      <button class="btn danger" id="quitBtn" data-k="quitBtn">Quit</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="big-emoji">🎉</div>
      <h2 data-k="wonTitle">Board cleared!</h2>
      <div class="stat-line" data-k="wonTime">Time: <b id="ovTime">0:00</b></div>
      <div class="stat-line muted" id="ovBest"></div>
      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" id="againBtn" data-k="againBtn">Play again</button>
        <button class="btn ghost block" id="ovMenuBtn" data-k="backMenu">Back to menu</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- HOW TO PLAY (same pattern as Chinese Checkers) -->
  <div class="sheet hidden" id="rulesSheet" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="rulesTitle">How to play</h2>
        <button class="sheet-x" id="rulesClose" type="button" aria-label="Close">✕</button>
      </div>
      <div class="sheet-body" id="rulesBody"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var STR = {

    },
    fil: {

      levelLabel:'Antas', lvEasy:'Madali', lvMedium:'Katamtaman', lvHard:'Mahirap', startBtn:'Simulan',
      timeLabel:'Oras', tilesLabel:'Natitirang tile', pairsLabel:'Tugma', hintBtn:'Tulong', shuffleBtn:'Haluin', restartBtn:'Ulitin', quitBtn:'Umalis',
      wonTitle:'Na-clear ang board!', wonTime:'Oras', againBtn:'Laro ulit', backMenu:'Bumalik sa menu', noMove:'Walang galaw — haluin', pickTile:'Piliin ang malayang tile'
    },

      title:'麻将接龙', sub:'配对消除可点击的麻将牌', yourName:'你的名字', namePlaceholder:'输入你的名字',
      levelLabel:'难度', lvEasy:'简单', lvMedium:'中等', lvHard:'困难', startBtn:'开始游戏',
      timeLabel:'时间', tilesLabel:'剩余牌', pairsLabel:'已消', hintBtn:'提示', shuffleBtn:'洗牌', restartBtn:'重玩', quitBtn:'退出',
      wonTitle:'通关啦!', wonTime:'时间', againBtn:'再玩一次', backMenu:'返回菜单', noMove:'无可消除 — 点洗牌', pickTile:'选择可点的牌'
    },
    id: {
      title:'Mahjong Solitaire', sub:'Padankan jubin yang bebas', yourName:'Nama kamu', namePlaceholder:'Ketik nama',
      levelLabel:'Tahap', lvEasy:'Senang', lvMedium:'Sederhana', lvHard:'Susah', startBtn:'Mula',
      timeLabel:'Masa', tilesLabel:'Jubin lagi', pairsLabel:'Padan', hintBtn:'Petunjuk', shuffleBtn:'Kacau', restartBtn:'Ulang', quitBtn:'Keluar',
      wonTitle:'Papan selesai!', wonTime:'Masa', againBtn:'Main lagi', backMenu:'Ke menu', noMove:'Tiada gerak — kacau', pickTile:'Pilih jubin bebas'
    }
  };
  var RULES = {
    en: {
      title: 'How to play',
      lede: 'Clear the board by matching free tiles. A tile is free when nothing is on top of it and one side is open.',
      sections: [
        { h: 'Match free tiles', p: 'Tap two tiles with the same picture to remove them.', list: [
          'Both tiles must be "free" to play.',
          'Free tiles are brighter and outlined in blue.',
          'Covered or blocked tiles are dimmed — wait for them to open.'
        ] },
        { h: 'What makes a tile "free"?', list: [
          'Nothing is stacked on top of it.',
          'At least one side (left or right) is open.',
          'A tile with a neighbour on both sides is blocked.'
        ] },
        { h: 'Need a hand?', list: [
          'Tap Hint to flash a possible matching pair.',
          'Tap Shuffle to mix the board into a new solvable order.',
          'Use Shuffle whenever no moves are left.'
        ] },
        { h: 'Win', list: [
          'Clear every tile from the board.',
          'A faster clear gives you a better time.'
        ] }
      ]
    },
    fil: {
      title: 'Paano laruin',
      lede: 'Linisin ang board sa pagtugma ng malayang mga tile. Ang isang tile ay malaya kung wala itong nakapatong at bukas ang isang gilid.',
      sections: [
        { h: 'Tugmain ang malayang tile', p: 'Pindutin ang dalawang tile na magkapareho ang larawan para tanggalin.', list: [
          'Parehong tile ay dapat "malaya" para mapindot.',
          'Ang malayang tile ay mas maliwanag at may asul na linya.',
          'Ang tile na nakapatong o nakaharang ay madilim — hintayin lang mabuksan.'
        ] },
        { h: 'Ano ang gumagawa ng tile na "malaya"?', list: [
          'Walang nakapatong sa taas nito.',
          'Kahit isang gilid (kaliwa o kanan) ay bukas.',
          'Ang tile na may katabi sa dalawang gilid ay naharang.'
        ] },
        { h: 'Kailangan ng tulong?', list: [
          'Pindutin ang Hint para ipakita ang posibleng pares.',
          'Pindutin ang Shuffle para haluin ang board sa bagong kaayosan.',
          'Gamitin ang Shuffle kapag wala nang galaw.'
        ] },
        { h: 'Manalo', list: [
          'Tanggalin ang lahat ng tile sa board.',
          'Ang mas mabilis na linis ay mas magandang oras.'
        ] }
      ]
    },
    zh: {
      title: '玩法说明',
      lede: '通过配对消除可点击的牌来清空棋盘。当一张牌上方没有牌、且至少一侧可移动时，它就是可点的。',
      sections: [
        { h: '点击相同的牌', p: '点击两张图案相同的牌即可消除。', list: [
          '两张牌都必须"可点"才能玩。',
          '可点的牌更亮、有蓝色边框。',
          '被压住或挡住的牌会变暗——等它们露出来。'
        ] },
        { h: '什么牌"可点"?', list: [
          '上方没有牌压着它。',
          '至少一侧（左或右）空着。',
          '左右都被夹住的牌无法点击。'
        ] },
        { h: '需要帮助?', list: [
          '点"提示"会闪出一对可消的牌。',
          '点"洗牌"会把棋盘重排成新的可解顺序。',
          '没有可消的牌时，就用洗牌。'
        ] },
        { h: '获胜', list: [
          '把棋盘上所有的牌都消除。',
          '消除得越快，用时越好。'
        ] }
      ]
    },
    id: {
      title: 'Cara bermain',
      lede: 'Kosongkan papan dengan memadankan jubin yang bebas. Jubin bebas bila tiada di atasnya dan satu sisi terbuka.',
      sections: [
        { h: 'Padankan jubin bebas', p: 'Ketik dua jubin sama gambar untuk buang.', list: [
          'Kedua-dua jubin mesti "bebas" untuk dimain.',
          'Jubin bebas lebih terang dan bersempadan biru.',
          'Jubin bertindih atau terhalang jadi kelam — tunggu ia buka.'
        ] },
        { h: 'Apa buat jubin "bebas"?', list: [
          'Tiada apa di atasnya.',
          'Sekurang-kurangnya satu sisi (kiri/kanan) terbuka.',
          'Jubin dengan jiran di kedua sisi terhalang.'
        ] },
        { h: 'Perlu bantuan?', list: [
          'Ketik Hint untuk kelipkan pasangan yang boleh.',
          'Ketik Shuffle untuk kacau papan ke susunan baharu.',
          'Guna Shuffle bila tiada gerak lagi.'
        ] },
        { h: 'Menang', list: [
          'Kosongkan semua jubin dari papan.',
          'Lebih cepat kosong, lebih bagus masa.'
        ] }
      ]
    }
  };
  var t = function (k, v) { return CBGame.t(STR, k, v); };
  CBGame.wireSound();
  var $ = function (s) { return document.querySelector(s); };

  var SYMS = ['🍎','🍌','🍇','🍓','🍒','🍑','🍍','🥝','🥥','🍉','🍊','🍋','🍐','🥭','🍅','🌽','🍄','🌹','🌻','🌼','🌷','🐶','🐱','🐭','🐰','🐻','🐼','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦊','🌟','⚽','🚀','🍔','🎈','🎁','💡','🔔','🌈','⭐','💎','🏀','🌸','🍩'];
  var LEVELS = {
    easy:   { w:6, h:4, layers:2, label:'Easy' },
    medium: { w:8, h:4, layers:3, label:'Medium' },
    hard:   { w:8, h:6, layers:3, label:'Hard' },
  };
  var level = 'easy';
  var slots = [], selected = null, matched = 0, totalPairs = 0, startTime = 0, timer = null;
  var HU = 23; // half-tile unit in px (tile is 2 units wide/tall)

  if (CB.name && CB.name.get && CB.name.get()) $('#nameInput').value = CB.name.get();
  Array.prototype.forEach.call($('#levels').children, function (b) {
    b.onclick = function () {
      level = b.dataset.level; CBSound.click();
      Array.prototype.forEach.call($('#levels').children, function (c) { c.classList.remove('on'); });
      b.classList.add('on'); refreshHistory();
    };
  });

  function fmt(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' + s : s); }
  function refreshHistory() { if (CB.scores && CB.scores.refresh) CB.scores.refresh('mahjong', $('#nameInput').value.trim()); }
  $('#nameInput').addEventListener('input', refreshHistory);
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  function buildLayout(L) {
    var out = [];
    for (var ly = 0; ly < L.layers; ly++) {
      var w = L.w - 2 * ly, h = L.h - 2 * ly;
      if (w <= 0 || h <= 0) break;
      var offX = ly * 2, offY = ly * 2;
      for (var r = 0; r < h; r++) for (var c = 0; c < w; c++) {
        out.push({ x: offX + c * 2, y: offY + r * 2, layer: ly, removed: false, sym: null });
      }
    }
    if (out.length % 2 === 1) out.pop(); // keep even for clean pairing
    return out;
  }

  // A slot is free if nothing overlaps it from the layer above AND at least one
  // horizontal side is open (no same-layer neighbour on that side).
  function isFree(s, list) {
    for (var i = 0; i < list.length; i++) {
      var o = list[i]; if (o === s || o.removed) continue;
      if (o.layer === s.layer + 1 && Math.abs(o.x - s.x) < 2 && Math.abs(o.y - s.y) < 2) return false; // covered above
    }
    var left = false, right = false;
    for (var j = 0; j < list.length; j++) {
      var n = list[j]; if (n === s || n.removed || n.layer !== s.layer) continue;
      if (n.y === s.y && n.x === s.x - 2) left = true;
      if (n.y === s.y && n.x === s.x + 2) right = true;
    }
    return !left || !right;
  }

  // Assign symbols by simulating a valid removal order, so the board is always
  // solvable: at each step pick any two currently-free tiles and give them a
  // shared symbol, then remove them from the working set. Replaying that order
  // clears the board.
  function solveAssign() {
    var live = slots.filter(function (s) { return !s.removed; });
    var pool = SYMS.slice();
    var pi = 0;
    while (live.length) {
      var free = live.filter(function (s) { return isFree(s, live); });
      if (free.length < 2) {
        // Safety net (should not happen on a centred pyramid): pair up whatever
        // remains so no tile is left truly unmatched.
        shuffle(live);
        for (var k = 0; k + 1 < live.length; k += 2) { var sy = pool[pi++ % pool.length]; live[k].sym = sy; live[k + 1].sym = sy; }
        break;
      }
      shuffle(free);
      var a = free[0], b = free[1];
      var sym = pool[pi++ % pool.length];
      a.sym = sym; b.sym = sym;
      live = live.filter(function (s) { return s !== a && s !== b; });
    }
  }

  function start() {
    var name = $('#nameInput').value.trim() || 'You';
    if (CB.name && CB.name.set) CB.name.set(name);
    var L = LEVELS[level];
    slots = buildLayout(L);
    totalPairs = slots.length / 2; matched = 0; selected = null;
    solveAssign();
    startTime = Date.now();
    $('#menuView').classList.add('hidden');
    $('#gameView').classList.remove('hidden');
    $('#overlay').classList.remove('on');
    layoutBoard();
    render();
    if (timer) clearInterval(timer);
    timer = setInterval(updateHud, 250);
    CBSound.deal();
  }

  function layoutBoard() {
    var L = LEVELS[level];
    var maxX = 0, maxY = 0;
    slots.forEach(function (s) { maxX = Math.max(maxX, s.x); maxY = Math.max(maxY, s.y); });
    // +46 tile width / +58 tile height, plus a little breathing room, so tiles
    // never spill past the board box onto the controls below.
    var w = maxX * HU + 54, h = maxY * HU + 66;
    var board = $('#board'); board.style.width = w + 'px'; board.style.height = h + 'px'; board.innerHTML = '';
    slots.forEach(function (s, i) {
      var d = document.createElement('div');
      d.className = 'tile layer-' + s.layer; d.dataset.i = i;
      d.style.left = (s.x * HU) + 'px';
      d.style.top = (s.y * HU) + 'px';
      d.style.zIndex = s.layer + 1;
      d.onclick = function () { onTile(i); };
      board.appendChild(d);
    });
  }

  function render() {
    var live = slots.filter(function (s) { return !s.removed; });
    var freeSet = {};
    live.forEach(function (s) { if (isFree(s, live)) freeSet[slots.indexOf(s)] = true; });
    var left = 0;
    slots.forEach(function (s, i) {
      var d = $('#board').children[i];
      if (s.removed) { d.className = 'tile gone'; return; }
      left++;
      d.textContent = s.sym;
      var free = !!freeSet[i];
      d.className = 'tile layer-' + s.layer + (free ? ' free' : ' locked') + (selected === i ? ' sel' : '');
    });
    $('#tilesStat').textContent = left;
    $('#pairsStat').textContent = matched;
    if (left === 0) { win(); return; }
    if (!anyMove()) CBGame.toast(t('noMove'), 'bad');
  }

  function anyMove() {
    var live = slots.filter(function (s) { return !s.removed; });
    var free = live.filter(function (s) { return isFree(s, live); });
    var bySym = {};
    for (var i = 0; i < free.length; i++) {
      var sy = free[i].sym;
      if (bySym[sy] !== undefined) return true; // two free tiles share a symbol
      bySym[sy] = true;
    }
    return false;
  }

  function onTile(i) {
    var s = slots[i]; if (s.removed) return;
    var live = slots.filter(function (x) { return !x.removed; });
    if (!isFree(s, live)) { CBSound.bad(); CBGame.toast(t('pickTile'), 'bad'); return; }
    if (selected === i) { selected = null; render(); return; }
    if (selected === null) { selected = i; CBSound.click(); render(); return; }
    var prev = slots[selected];
    if (prev.sym === s.sym) {
      prev.removed = true; s.removed = true; matched++;
      selected = null; CBSound.match(); render();
    } else {
      selected = i; CBSound.flip(); render();
    }
  }

  function updateHud() { $('#timeStat').textContent = fmt((Date.now() - startTime) / 1000); }

  function hint() {
    var live = slots.filter(function (x) { return !x.removed; });
    var free = live.filter(function (x) { return isFree(x, live); });
    var seen = {};
    for (var i = 0; i < free.length; i++) {
      var sy = free[i].sym;
      if (seen[sy] !== undefined) {
        var a = slots.indexOf(free[seen[sy]]), b = slots.indexOf(free[i]);
        [a, b].forEach(function (idx) { $('#board').children[idx].classList.add('hint'); });
        setTimeout(function () { [a, b].forEach(function (idx) { var el = $('#board').children[idx]; if (el) el.classList.remove('hint'); }); }, 1600);
        CBSound.tick(); return;
      }
      seen[sy] = i;
    }
    CBGame.toast(t('noMove'), 'bad');
  }

  function shuffleBoard() {
    slots.forEach(function (s) { s.removed = s.removed; }); // keep removed state
    solveAssign();
    selected = null; CBSound.flip(); render();
  }

  function win() {
    if (timer) clearInterval(timer);
    var secs = (Date.now() - startTime) / 1000;
    var name = $('#nameInput').value.trim() || 'You';
    var best = null;
    if (CB.scores && CB.scores.record) {
      var before = CB.scores.summary('mahjong', name);
      CB.scores.record('mahjong', name, secs, { won: true, level: level, levelLabel: LEVELS[level].label });
      var after = CB.scores.summary('mahjong', name);
      var lv = (after.levels || []).filter(function (x) { return x.key === level; })[0];
      if (lv && lv.best != null) {
        var prevBest = null;
        (before.levels || []).forEach(function (x) { if (x.key === level) prevBest = x.best; });
        best = (prevBest == null || secs < prevBest) ? secs : null;
      }
    }
    $('#ovTime').textContent = fmt(secs);
    $('#ovBest').textContent = best != null ? '🌟 ' + t('justNow') + ' (' + fmt(best) + ')' : '';
    CBSound.win();
    $('#overlay').classList.add('on');
  }

  $('#startBtn').onclick = function () { CBSound.click(); start(); };
  $('#restartBtn').onclick = function () { CBSound.click(); start(); };
  $('#hintBtn').onclick = function () { CBSound.click(); hint(); };
  $('#shuffleBtn').onclick = function () { CBSound.click(); shuffleBoard(); };
  $('#quitBtn').onclick = function () { if (timer) clearInterval(timer); $('#gameView').classList.add('hidden'); $('#menuView').classList.remove('hidden'); refreshHistory(); };
  $('#againBtn').onclick = function () { CBSound.click(); start(); };
  $('#ovMenuBtn').onclick = function () { $('#overlay').classList.remove('on'); $('#gameView').classList.add('hidden'); $('#menuView').classList.remove('hidden'); refreshHistory(); };

  /* ---- how-to-play sheet (same pattern as Chinese Checkers) ---- */
  (function () {
    var rulesBuilt = false;
    function renderRules() {
      if (rulesBuilt) return;
      var r = RULES[CBGame.LANG] || RULES.en;
      $('#rulesTitle').textContent = r.title;
      var body = $('#rulesBody');
      body.innerHTML = '';
      var lede = document.createElement('p');
      lede.className = 'lede';
      lede.textContent = r.lede;
      body.appendChild(lede);
      r.sections.forEach(function (s) {
        var h = document.createElement('h3'); h.textContent = s.h; body.appendChild(h);
        if (s.p) { var p = document.createElement('p'); p.textContent = s.p; body.appendChild(p); }
        if (s.list && s.list.length) {
          var ul = document.createElement('ul');
          s.list.forEach(function (li) {
            var el = document.createElement('li'); el.textContent = li; ul.appendChild(el);
          });
          body.appendChild(ul);
        }
      });
      rulesBuilt = true;
    }
    function openRules(on) {
      var sheet = $('#rulesSheet');
      if (on) { renderRules(); sheet.classList.remove('hidden'); $('#rulesClose').focus(); }
      else { sheet.classList.add('hidden'); }
    }
    var rb = $('#rulesBtn');
    rb.setAttribute('title', (RULES[CBGame.LANG] || RULES.en).title);
    rb.setAttribute('aria-label', (RULES[CBGame.LANG] || RULES.en).title);
    rb.onclick = function () { CBSound.click(); openRules(true); };
    $('#rulesClose').onclick = function () { openRules(false); };
    $('#rulesSheet').onclick = function (e) { if (e.target === $('#rulesSheet')) openRules(false); };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('#rulesSheet').classList.contains('hidden')) openRules(false);
    });
  })();

  refreshHistory();
})();
</script>
</body>
</html>
