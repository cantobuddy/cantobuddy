<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fa">
<meta name="robots" content="noindex">
<title>Big Two · CantoBuddy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f9d63'/><rect x='26' y='22' width='34' height='48' rx='6' fill='white' transform='rotate(-12 43 46)'/><rect x='44' y='30' width='34' height='48' rx='6' fill='white' transform='rotate(8 61 54)'/><text x='61' y='64' font-size='26' font-family='Arial' font-weight='bold' fill='%231f9d63' text-anchor='middle'>2</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --red:#e63946; --green:#1f9d63; --gold:#c9971b; --blue:#2b6cf0;
    --ink:#161922; --muted:#6f7683; --line:#e6e8ef;
    --bg:#f4f5fa; --panel:#ffffff; --felt:#1f6b4f;
    --shadow:0 10px 30px rgba(23,26,35,.08);
    --cw:clamp(42px,12.4vw,62px);      /* one card's width */
    --ov:-0.52;                         /* overlap, as a fraction of --cw — 13
                                           cards have to fit a 320px phone */
  }
  html,body{height:100%}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(60vw 60vw at 6% -10%, rgba(31,157,99,.13), transparent 62%),
      radial-gradient(50vw 50vw at 100% 0%, rgba(201,151,27,.12), transparent 60%),
      radial-gradient(60vw 60vw at 50% 112%, rgba(43,108,240,.09), transparent 60%);
    background-attachment:fixed;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  input{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------------------------------------------------------- lobby */
  #lobby{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 40px}
  .backlink{
    align-self:flex-start;display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:12px;background:#fff;
    border:1px solid var(--line);box-shadow:0 4px 12px rgba(23,26,35,.05);margin-bottom:auto;
  }
  .brand{display:flex;gap:5px;margin:14px 0}
  .brand i{
    width:40px;height:54px;border-radius:8px;display:grid;place-items:center;
    font-style:normal;font-weight:800;color:#fff;font-size:19px;letter-spacing:-.5px;
    box-shadow:0 8px 18px rgba(0,0,0,.16);
  }
  .brand i:nth-child(1){background:#2b2f3a;transform:rotate(-10deg)}
  .brand i:nth-child(2){background:var(--red);transform:rotate(-2deg) translateY(-6px)}
  /* The third tile is the letter D. A Latin capital at 19px is only ~14px tall
     where a Chinese glyph fills its whole 19px em box, so it reads as a small
     tile beside two big ones. Scaled up to match the ink height, not the font
     size — same visual weight, three tiles that look like one logo. */
  .brand i:nth-child(3){background:var(--gold);transform:rotate(6deg);font-size:25px}
  h1{margin:6px 0 6px;font-size:26px;letter-spacing:-.5px;text-align:center}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px;text-align:center;line-height:1.6;max-width:340px}
  .panel{
    width:100%;max-width:380px;background:var(--panel);border-radius:24px;
    padding:20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 7px;letter-spacing:.3px}
  .field{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:#fafbfe;font-size:16px;outline:none;transition:.15s;
  }
  .field:focus{border-color:var(--green);background:#fff}
  .avatars{display:flex;gap:8px;flex-wrap:wrap}
  .avatars button{
    width:44px;height:44px;border-radius:14px;background:#f6f7fb;border:1.5px solid var(--line);
    font-size:21px;display:grid;place-items:center;transition:.15s;
  }
  .avatars button.on{border-color:var(--green);background:#eaf7f0;transform:scale(1.04)}
  .btn{
    width:100%;padding:14px;border-radius:15px;background:#fff;border:1.5px solid var(--line);
    font-weight:700;font-size:15px;transition:.15s;box-shadow:0 4px 12px rgba(23,26,35,.05);
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{
    background:linear-gradient(135deg,#1f9d63,#33b97c);color:#fff;border-color:transparent;
    box-shadow:0 10px 22px rgba(31,157,99,.28);margin-top:18px;
  }
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:#9aa1ae;font-size:12px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .join-row{display:flex;gap:8px}
  .join-row .field{flex:1;text-transform:uppercase;letter-spacing:3px;font-weight:700;text-align:center}
  /* The placeholder is an INSTRUCTION, not a sample code — undo the code styling
     (uppercase, wide spacing, bold) or "Enter code" itself reads as a code. */
  .join-row .field::placeholder{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;color:#a7aeba}
  .join-row .btn{width:auto;padding:13px 20px}
  .err{margin:12px 0 0;color:var(--red);font-size:12.5px;min-height:16px;text-align:center}
  .tips{list-style:none;padding:0;margin:22px 0 0;max-width:360px;font-size:12px;color:var(--muted);line-height:1.7}
  .tips li{padding-left:16px;position:relative}
  .tips li::before{content:"•";position:absolute;left:2px;color:var(--green)}

  /* ----------------------------------------------------------- room */
  #room{min-height:100dvh;display:flex;flex-direction:column;padding:10px 14px 0;max-width:1000px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:8px;padding:4px 0 10px;flex-wrap:nowrap}
  .codechip{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    padding:7px 12px;border-radius:13px;box-shadow:0 4px 12px rgba(23,26,35,.05);cursor:pointer;
  }
  .codechip small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.4px;line-height:1.2}
  .codechip b{font-size:16px;letter-spacing:3px;line-height:1.1}
  .roundchip{font-size:12px;color:var(--muted);font-weight:600}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:#c3c8d2;display:inline-block}
  .dot.on{background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.18)}
  .iconbtn{
    width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;font-size:15px;box-shadow:0 4px 12px rgba(23,26,35,.05);
  }

  /* opponents */
  .seats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:2px 0 10px}
  .seat{
    display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);
    border-radius:15px;padding:7px 10px;min-width:96px;box-shadow:0 4px 12px rgba(23,26,35,.05);
    transition:.2s;position:relative;
  }
  .seat .av{font-size:20px;line-height:1}
  .seat .nm{font-size:11.5px;font-weight:700;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seat .cnt{font-size:10px;color:var(--muted);font-weight:600}
  .seat.turn{border-color:var(--green);background:#effaf4;box-shadow:0 0 0 3px rgba(31,157,99,.12)}
  .seat.off{opacity:.5}
  .seat.out{opacity:.55;text-decoration:line-through}
  .seat .win{font-size:10px;color:var(--gold);font-weight:800}

  /* the trick */
  .table{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    position:relative;min-height:150px;padding:8px 0;
  }
  .table::before{
    content:"";position:absolute;inset:0 3%;border-radius:26px;
    background:radial-gradient(ellipse at 50% 40%, rgba(31,107,79,.10), rgba(31,107,79,.04));
    border:1px solid rgba(31,107,79,.12);
  }
  .trick-line{position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(var(--cw) * 1.5)}
  .trick-cards{display:flex;gap:5px;align-items:center;
    /* The played cards read at a larger size than the hand — they are the thing
       everyone is looking at. Setting --cw here scales the whole card face,
       corner index included; a five-card trick still fits a 320px phone
       (5 × 54 + gaps = 292px). */
    --cw:clamp(54px,17vw,84px);}
  .trick-meta{position:relative;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}
  .trick-meta b{color:var(--ink)}
  .lead-hint{
    position:relative;background:#fff;border:1px dashed rgba(31,157,99,.5);color:var(--green);
    border-radius:14px;padding:14px 18px;font-size:13px;font-weight:600;text-align:center;max-width:280px;
  }
  .passes{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;position:relative}
  .passes span{background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 8px;font-size:10.5px;color:var(--muted)}

  /* me + hand */
  .me-bar{display:flex;align-items:center;gap:7px;padding:0 4px 4px;font-size:12px}
  .me-bar .nm{font-weight:800}
  .me-bar .tag{background:#eaf7f0;color:var(--green);font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px}
  /* An empty pill is not invisible — it still paints its background, which read
     as a mysterious green blob next to the name whenever it was not her turn. */
  .me-bar .tag:empty{display:none}
  .hand-wrap{padding:14px 2px 4px;overflow:visible}
  .hand{display:flex;justify-content:center;align-items:flex-end;padding-top:16px}
  .card{
    position:relative;flex:0 0 auto;width:var(--cw);height:calc(var(--cw) * 1.46);
    border-radius:9px;background:#fff;border:1px solid #d9dde6;
    box-shadow:0 4px 10px rgba(23,26,35,.13);transition:transform .13s ease, box-shadow .13s;
    user-select:none;overflow:hidden;
  }
  .hand .card + .card{margin-left:calc(var(--cw) * var(--ov))}
  .hand .card.pick{cursor:pointer}
  .hand .card.pick:active{transform:translateY(-6px)}
  .hand .card.sel{transform:translateY(-16px);box-shadow:0 10px 18px rgba(31,157,99,.3),0 0 0 2.5px var(--green);z-index:5}
  .hand .card.hint{box-shadow:0 0 0 2.5px var(--gold)}
  /* A real card face: corner index top-left, big pip in the middle. With 13
     cards overlapping, only the left strip of each is visible, so the RANK has
     to sit in that strip — the pip is decoration you see on the top card. */
  .card .ix{
    position:absolute;top:2px;left:3px;display:flex;flex-direction:column;align-items:center;
    line-height:.92;font-weight:800;
  }
  .card .ix b{font-size:calc(var(--cw) * .27);font-weight:800}
  .card .ix i{font-size:calc(var(--cw) * .22);font-style:normal}
  .card .pip{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:calc(var(--cw) * .5);line-height:1;opacity:.92;
    padding-left:calc(var(--cw) * .14);
  }
  .card.red{color:var(--red)}
  .card.blk{color:#22262f}
  .trick-cards .card{box-shadow:0 6px 14px rgba(23,26,35,.16)}

  /* actions */
  .actions{display:flex;gap:8px;padding:6px 2px calc(10px + env(safe-area-inset-bottom));align-items:center}
  .act{
    flex:1;padding:14px 12px;border-radius:15px;background:#fff;font-weight:800;font-size:14px;
    border:1.5px solid var(--line);box-shadow:0 5px 14px rgba(23,26,35,.07);transition:.15s;
  }
  .act:active{transform:scale(.97)}
  .act:disabled{opacity:.4;box-shadow:none}
  .act.go{background:linear-gradient(135deg,#1f9d63,#33b97c);color:#fff;border-color:transparent;box-shadow:0 10px 20px rgba(31,157,99,.26)}
  .act.ghost{flex:0 0 auto;padding:14px 18px}
  .act.emoji{flex:0 0 auto;padding:14px 13px;font-size:17px}
  .act.selcount{font-size:12px;font-weight:600;color:var(--muted);flex:0 0 auto;padding:0 4px}

  /* ---- emoji picker ---- */
  /* A popover, not a modal: the table stays live behind it, because a reaction
     is a aside — you glance, you pick, you carry on. `left`/`bottom` are set in
     JS from the button's rect; only the transform is here, so the entrance
     animation cannot fight the positioning. */
  .emoji-pop{
    position:fixed;z-index:60;width:min(292px,calc(100vw - 24px));
    background:rgba(255,255,255,.98);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(23,26,35,.22);
    padding:10px 10px 8px;transform:translateX(-50%);
    animation:emojiPop .16s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes emojiPop{from{opacity:0;margin-bottom:-8px}to{opacity:1;margin-bottom:0}}
  .emoji-pop-head{
    font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;
  }
  /* Five across: at 292px that is a ~52px target, which is above the 44px
     minimum for a thumb, and four rows of twenty keeps the whole set on screen
     without scrolling. */
  .emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .emoji-grid button{
    aspect-ratio:1;border:none;background:none;border-radius:12px;padding:0;
    font-size:23px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:transform .1s,background .1s;-webkit-tap-highlight-color:transparent;
  }
  .emoji-grid button:active{transform:scale(.85);background:#eef1f8}
  @media(hover:hover){.emoji-grid button:hover{background:#eef1f8}}

  /* feed */
  .feed{
    position:fixed;right:14px;bottom:14px;width:290px;max-height:52vh;background:rgba(255,255,255,.97);
    backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 18px 44px rgba(23,26,35,.18);
    border:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden;
  }
  .feed-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
  .feed-body{flex:1;overflow-y:auto;padding:8px 12px;font-size:12.5px;line-height:1.75}
  .feed-body .lg{color:#4b5160;display:flex;gap:6px;margin:3px 0}
  .feed-body .lg i{font-style:normal;opacity:.45;flex:0 0 auto;font-size:10.5px;padding-top:2px}
  /* Chat bubbles, same shape as the UNO table's. `mine` is tinted so a player
     can find her own words in a busy family room without reading every name. */
  .bubble{margin:6px 0;display:flex;gap:6px}
  .bubble .tx{background:#f1f3f9;border-radius:12px;padding:6px 10px;max-width:200px;word-break:break-word}
  .bubble.mine .tx{background:#e9f0ff}
  .bubble .who{font-size:10.5px;color:var(--muted);margin-bottom:2px}
  .shout .tx{background:linear-gradient(135deg,#fff3d6,#ffe6b8);font-weight:800;color:#a56a00}
  .feed-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .feed-foot input{flex:1;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13px;outline:none;background:#fafbfe}
  .feed-foot button{background:var(--blue);color:#fff;border-radius:11px;padding:0 14px;font-weight:700;font-size:13px}
  .mini{display:inline-flex;gap:2px;vertical-align:middle;margin:0 2px}
  .mini b{
    display:inline-block;font-size:10px;font-weight:800;line-height:1.35;padding:0 3px;
    border:1px solid #dfe3ec;border-radius:4px;background:#fff;
  }
  .mini b.r{color:var(--red)}

  /* overlay + toast */
  .overlay{
    position:fixed;inset:0;background:rgba(20,23,30,.5);backdrop-filter:blur(6px);z-index:60;
    display:grid;place-items:center;padding:20px;animation:fade .2s;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;border-radius:24px;padding:24px;width:100%;max-width:330px;text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.25);animation:up .25s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes up{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 6px;font-size:20px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}
  .big-av{font-size:54px;line-height:1;margin-bottom:4px}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .confetti i{position:absolute;top:-16px;width:8px;height:15px;border-radius:2px;animation:fall linear forwards;opacity:.95}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.85}}
  .toast{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:99;
    pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(min-width:900px){
    :root{--cw:76px}
    .hand .card + .card{margin-left:calc(var(--cw) * -0.42)}
    .seat{min-width:120px}
    /* A card table is a phone-shaped thing. Left to fill 1280px the felt becomes
       a wall of green and the two buttons stretch to 400px each — so cap the
       table and the action row rather than letting flex distribute the slack. */
    #room{max-width:760px}
    .actions{max-width:520px;margin:0 auto}
  }
  @media(min-width:1100px){
    #room{margin-right:326px}
    .feed{top:10px;bottom:auto;right:12px;height:calc(100dvh - 20px);max-height:none}
  }
  @media(max-width:899px){
    .feed{width:calc(100vw - 24px);right:12px;bottom:12px;max-height:46vh}
  }
  @media(max-width:560px){
    #room{padding:8px 10px 0}
    .roundchip{display:none}
    .status span:last-child{display:none}
    .seat{min-width:0;padding:6px 8px;gap:5px}
    .seat .nm{max-width:52px;font-size:11px}
    .act{padding:13px 10px;font-size:13px}
    .act.ghost{padding:13px 14px}
    .act.emoji{padding:13px 11px;font-size:16px}
  }
  @media(max-height:680px){
    .seat{padding:5px 8px}
    .table{min-height:120px}
    .hand-wrap{padding-top:10px}
  }
  /* At 320px the chip's label wraps to two lines and pushes the code down. The
     code is the thing that matters, and the chip still shares on tap. */
  @media(max-width:359px){
    .codechip small{display:none}
    .codechip{padding:8px 10px}
  }
</style>
</head>
<body>

<!-- ============================ LOBBY ============================ -->
<main id="lobby">
  <a class="backlink" href="/?view=games" id="backLink">← <span data-k="backToApp"></span></a>
  <!-- The game's own name as three tiles. It is 鋤大D — the Cantonese name, and
       the one the rest of the app uses — not 大老二, which is the Mandarin-style
       name. A player who knows the game looks for 鋤大D. -->
  <div class="brand"><i>鋤</i><i>大</i><i>D</i></div>
  <h1 data-k="title"></h1>
  <p class="sub" data-k="sub"></p>

  <div class="panel">
    <label data-k="nameLabel"></label>
    <input id="nameInput" class="field" maxlength="12" autocomplete="off">

    <label style="margin-top:16px" data-k="avatarLabel"></label>
    <div id="avatarPicker" class="avatars"></div>

    <button id="createBtn" class="btn primary" data-k="createBtn"></button>

    <div class="divider"><span data-k="divider"></span></div>
    <div class="join-row">
      <input id="codeInput" class="field" maxlength="4" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn" class="btn" data-k="joinBtn"></button>
    </div>
    <p id="lobbyErr" class="err"></p>
  </div>

  <ul class="tips">
    <li data-k="tip1"></li>
    <li data-k="tip2"></li>
  </ul>
</main>

<!-- ============================ ROOM ============================ -->
<section id="room" class="hidden">
  <div class="topbar">
    <div class="codechip" id="codeChip">
      <div>
        <small data-k="codeChipLabel"></small>
        <b id="codeText">----</b>
      </div>
      <span style="font-size:15px">🔗</span>
    </div>
    <div class="roundchip" id="roundChip"></div>
    <div class="spacer"></div>
    <div class="status"><span class="dot" id="liveDot"></span><span id="liveText"></span></div>
    <button class="iconbtn" id="soundBtn"><span id="soundIcon"></span></button>
    <button class="iconbtn" id="feedBtn"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8a7.6 7.6 0 0 1-7.6 7.6H9.4L4.5 22v-4.6a7.6 7.6 0 1 1 16-5.6z"/></svg></button>

const LANG = (function () {
  const saved = (localStorage.getItem('cb_lang') || '').toLowerCase();
  if (STR[saved]) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.indexOf('zh') === 0) return 'zh';
  if (nav.indexOf('id') === 0) return 'id';
  if (nav.indexOf('tl') === 0 || nav.indexOf('fil') === 0) return 'fil';
  return 'en';
})();

function t(key, vars) {
  const d = STR[LANG] || STR.en;
  let s = d[key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  if (vars) {
    for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  }
  return s;
}

/**
 * The invite link is /games/bigtwo/ABCD. `BASE` must therefore end at
 * /games/bigtwo/ whether or not a code is in the path — and it must strip the
 * SEGMENT, not a fixed number of characters (a fixed slice once produced
 * `/games/bigtwo` and sent every API call to `/games/bigtwoapi/…`).
 */
const BASE = (function () {
  let p = location.pathname;
  if (!p.endsWith('/')) {
    const seg = p.split('/').pop();
    p = /^[A-Z0-9]{4}$/.test(seg) ? p.slice(0, -seg.length) : p + '/';
  }
  return p;
})();

   lack that codepoint drew a slashed-circle placeholder. An inline SVG cannot

const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4z"/><path d="M15.4 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>';
const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4z"/><path d="M16 9.8l4.4 4.4M20.4 9.8 16 14.2"/></svg>';

/* --------------------------------------------------------------- utils */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

const RANK_LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2' };
const SUIT_GLYPH = ['♦', '♣', '♥', '♠'];
const rankLabel = (r) => RANK_LABEL[r] || String(r);
const isRed = (suit) => suit === 0 || suit === 2;
const cardText = (c) => rankLabel(c.rank) + SUIT_GLYPH[c.suit];

function beep(freq, dur = 0.08, type = 'sine', gain = 0.05) {
  if (!sound) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!beep.ctx) beep.ctx = new Ctx();
    const ctx = beep.ctx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = gain;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur + 0.02);
  } catch (e) { /* audio is a nicety, never a failure */ }
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast.tm);
  toast.tm = setTimeout(() => el.classList.remove('on'), 2200);
}

function errorText(code) {
  const key = 'err' + String(code || '').charAt(0).toUpperCase() + String(code || '').slice(1);
  const d = STR[LANG] || STR.en;
  return d[key] || STR.en[key] || t('errUnknown');
}

function renderAvatars() {
  const box = $('#avatarPicker');
  box.innerHTML = AVATARS.map((a) =>
    `<button type="button" data-a="${a}" class="${a === myAvatar ? 'on' : ''}">${a}</button>`).join('');
  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { myAvatar = b.dataset.a; renderAvatars(); };
  });
}

function paintStatic() {
  document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = t(el.dataset.k); });
  document.title = t('title') + ' · CantoBuddy';
  document.documentElement.lang = LANG === 'fil' ? 'tl' : LANG;
  $('#nameInput').placeholder = LANG === 'fil' ? 'hal. Maria / Nanay' : LANG === 'zh' ? '例如：阿明' : 'e.g. Maria / Mum';
  // NOT a sample code. The field is 4 chars, bold, uppercase and widely spaced,
  // so "ABCD" read as a code that was already filled in — a player could tap
  // Join without typing anything and be told the room does not exist. An
  // instruction cannot be mistaken for data.
  $('#codeInput').placeholder = t('codePlaceholder');
  $('#chatInput').placeholder = t('chatPlaceholder');
  $('#codeChip').title = t('codeChipLabel');
  // All three topbar controls are icon-only, so each needs a tooltip and an
  // accessible name — set here because paintStatic() is what runs on a language
  // switch. Same three keys as the UNO table.
  for (const [sel, key] of [['#soundBtn', 'soundTitle'], ['#feedBtn', 'feedTitle'], ['#leaveBtn', 'leaveTitle']]) {
    $(sel).title = t(key);
    $(sel).setAttribute('aria-label', t(key));
  }
  renderSoundIcon();
}

function myName() {
  return ($('#nameInput').value || '').trim().slice(0, 12);
}

function saveSession() {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ code, token, name: S ? S.you.name : '', avatar: myAvatar }));
}

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
}

async function post(path, body) {
  // BASE already ends in '/', so the path must not start with one — a double
  // slash is not always normalised and the request 404s in a way that looks
  // like a missing route.
  const r = await fetch(BASE + String(path).replace(/^\//, ''), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let data = {};
  try { data = await r.json(); } catch (e) { /* empty */ }
  return { status: r.status, body: data };
}

function showLobbyError(msg) {
  $('#lobbyErr').textContent = msg || '';
}

async function createRoom() {
  const name = myName();
  if (!name) { showLobbyError(t('errNameRequired')); $('#nameInput').focus(); return; }
  const r = await post('/api/create', { name, avatar: myAvatar });
  if (r.status !== 200) { showLobbyError(errorText(r.body.error)); return; }
  enterRoom(r.body);
}

async function joinRoom() {
  const name = myName();
  const c = ($('#codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (!name) { showLobbyError(t('errNameRequired')); $('#nameInput').focus(); return; }
  if (c.length !== 4) { showLobbyError(errorText('roomNotFound')); return; }
  const r = await post('/api/join', { code: c, name, avatar: myAvatar });
  if (r.status !== 200) { showLobbyError(errorText(r.body.error)); return; }
  enterRoom(r.body);
}

function enterRoom(res) {
  token = res.token;
  code = res.code;
  myAvatar = res.avatar || myAvatar;
  showLobbyError('');
  $('#lobby').classList.add('hidden');
  $('#room').classList.remove('hidden');
  $('#codeText').textContent = code;
  saveSession();
  connect();
}

/* --------------------------------------------------------------- stream */
function connect() {
  if (es) { try { es.close(); } catch (e) { /* gone */ } }
  es = new EventSource(BASE + 'api/events?token=' + encodeURIComponent(token));
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }
    if (data.fatal === 'expired') {
      localStorage.removeItem(SESSION_KEY);
      toast(errorText('sessionExpired'));
      setTimeout(() => { location.href = BASE; }, 1200);
      return;
    }
    setLive(true);
    applyState(data);
  };
}

function setLive(ok) {
  $('#liveDot').classList.toggle('on', !!ok);
  $('#liveText').textContent = ok ? t('liveOnline') : t('liveReconnecting');
}

function applyState(st) {
  const prevTurn = S ? S.turn : null;
  S = st;
  // Drop selections for cards that have left the hand.
  const ids = new Set(st.you.hand.map((c) => c.id));
  picked.forEach((id) => { if (!ids.has(id)) picked.delete(id); });
  renderAll();
  if (prevTurn !== st.turn && st.turn === st.you.id && st.state === 'playing') beep(660, 0.09, 'triangle');
  if (st.log.length > lastLogLen && lastLogLen) {
    const last = st.log[st.log.length - 1];
    if (last && last.k === 'play') beep(420, 0.06, 'square', 0.035);
    if (last && last.k === 'win') beep(880, 0.25, 'sine', 0.06);
  }
  lastLogLen = st.log.length;
}

/* -------------------------------------------------------------- render */
function renderAll() {
  if (!S) return;
  renderSeats();
  renderTrick();
  renderHand();
  renderActions();
  renderFeed();
  renderOverlay();
  $('#roundChip').textContent = S.round ? '#' + S.round : '';
  $('#myName').textContent = S.you.name;
  $('#myAv').textContent = S.you.avatar;
  $('#myTag').textContent = S.you.isTurn && S.state === 'playing' ? t('turnYou') : '';
  $('#myCount').textContent = t('cardsLeft', { n: S.you.hand.length });
}

function renderSeats() {
  const box = $('#seats');
  const others = S.players.filter((p) => p.id !== S.you.id);
  if (!others.length) {
    box.innerHTML = `<div class="seat"><span class="av">🪑</span><span class="nm">${esc(t('seatEmpty'))}</span></div>`;
    return;
  }
  box.innerHTML = others.map((p) => {
    const cls = ['seat'];
    if (p.isTurn) cls.push('turn');
    if (!p.connected) cls.push('off');
    if (p.finished || p.count === 0) cls.push('out');
    const count = p.count === 0 ? t('noCards') : t('cardsLeft', { n: p.count });
    return `<div class="${cls.join(' ')}">
      <span class="av">${p.avatar}</span>
      <span>
        <span class="nm">${esc(p.name)}</span>
        <span class="cnt" style="display:block">${count}</span>
      </span>
    </div>`;
  }).join('');
}

function cardEl(card, cls) {
  const el = document.createElement('div');
  el.className = 'card ' + (isRed(card.suit) ? 'red' : 'blk') + (cls ? ' ' + cls : '');
  el.dataset.id = card.id;
  el.innerHTML =
    `<span class="ix"><b>${rankLabel(card.rank)}</b><i>${SUIT_GLYPH[card.suit]}</i></span>` +
    `<span class="pip">${SUIT_GLYPH[card.suit]}</span>`;
  return el;
}

function renderTrick() {
  const area = $('#trickArea');
  const meta = $('#trickMeta');
  const passes = $('#passes');
  area.innerHTML = '';
  passes.innerHTML = '';

  if (S.state === 'lobby') {
    // A lone host is not waiting for "the host" — she is the host.
    const lone = S.players.length < 2;
    area.innerHTML = `<div class="lead-hint">${esc(lone ? t('waitingPlayers') : t('waitingHost'))}</div>`;
    meta.textContent = '';
    return;
  }

  if (!S.trick) {
    const youLead = S.turn === S.you.id;
    area.innerHTML = `<div class="lead-hint">${esc(youLead ? t('leadHint') : t('youLead'))}</div>`;
    meta.innerHTML = S.turn === S.you.id ? '' : `<b>${esc(S.turnName)}</b>`;
  } else {
    const row = document.createElement('div');
    row.className = 'trick-cards';
    S.trick.cards.forEach((c) => row.appendChild(cardEl(c)));
    area.appendChild(row);
    meta.innerHTML = esc(t('trickOf', { name: S.trick.byName, type: t('type' + S.trick.type.charAt(0).toUpperCase() + S.trick.type.slice(1)) }));
  }

  // The opening rule, said out loud: without it the first refused play reads as
  // a bug ("why can I not play my 2?"). `S.opening` is only ever sent to the
  // player who has to obey it.
  if (S.opening) {
    const card = S.you.hand.find((c) => c.id === S.opening);
    if (card) {
      const hint = document.createElement('div');
      hint.style.cssText = 'position:relative;margin-top:6px;font-size:11.5px;color:#a56a00;font-weight:700;text-align:center';
      hint.textContent = t('mustInclude', { card: cardText(card) });
      meta.appendChild(hint);
    }
  }

  if (S.passes > 0) {
    passes.innerHTML = `<span>${esc(t('passesLabel', { n: S.passes }))}</span>`;
  }
}

function renderHand() {
  const box = $('#hand');
  box.innerHTML = '';
  if (S.state === 'lobby') return;
  const hint = S.opening; // the card that must be in the first play, if it is mine
  S.you.hand.forEach((card) => {
    const cls = [];
    if (S.you.isTurn && S.state === 'playing') cls.push('pick');
    if (picked.has(card.id)) cls.push('sel');
    if (hint && hint === card.id) cls.push('hint');
    const el = cardEl(card, cls.join(' '));
    el.onclick = () => togglePick(card.id);
    box.appendChild(el);
  });
}

function togglePick(id) {
  if (!S || S.state !== 'playing' || !S.you.isTurn) return;
  if (picked.has(id)) picked.delete(id); else picked.add(id);
  renderHand();
  renderActions();
  beep(520, 0.03, 'sine', 0.02);
}

function renderActions() {
  const play = $('#playBtn');
  const pass = $('#passBtn');
  const start = $('#startBtn');
  const myTurn = S.state === 'playing' && S.you.isTurn;

  if (S.state === 'lobby') {
    play.style.display = 'none';
    pass.style.display = 'none';
    if (S.you.canStart) {
      start.style.display = '';
      start.textContent = t('startBtn');
    } else {
      start.style.display = 'none';
    }
    return;
  }

  start.style.display = 'none';
  play.style.display = '';
  pass.style.display = '';
  play.textContent = picked.size ? t('playBtn') + ' · ' + t('selected', { n: picked.size }) : t('playBtn');
  play.disabled = !myTurn || picked.size === 0;
  pass.textContent = t('passBtn');
  // You cannot pass on a hand you lead: there is nothing to beat.
  pass.disabled = !myTurn || !S.trick;
}

function miniCards(cards) {
  return '<span class="mini">' + cards.map((c) =>
    `<b class="${isRed(c.suit) ? 'r' : ''}">${rankLabel(c.rank)}${SUIT_GLYPH[c.suit]}</b>`).join('') + '</span>';
}

function typeName(type) {
  return t('type' + type.charAt(0).toUpperCase() + type.slice(1));
}

function logText(ev) {
  switch (ev.k) {
    case 'roomCreated': return esc(t('logRoom', { code: ev.code }));
    case 'join': return esc(t('logJoin', { name: ev.name }));
    case 'leave': return esc(t('logLeave', { name: ev.name }));
    case 'roundStart':
      return esc(t('logDeal', { round: ev.round, name: ev.opener, card: cardText(ev.card) }));
    case 'play':
      return esc(t('logPlay', { name: ev.who, type: typeName(ev.type) })) + miniCards(ev.cards);
    case 'pass': return esc(t('logPass', { name: ev.who }));
    case 'trickWon': return esc(t('logTrick', { name: ev.who }));
    case 'win': return esc(t('logWin', { name: ev.name }));
    case 'autoPass': return esc(t('logAutoPass', { name: ev.name }));
    case 'autoPlay': return esc(t('logAutoPlay', { name: ev.name, card: cardText(ev.cards[0]) }));
    case 'backToLobby': return esc(t('logLobby'));
    default: return '';
  }
}

function clock(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function renderFeed() {
  const box = $('#feedBody');
  // Log and chat are merged and sorted by time, so a message appears where it
  // happened in the game rather than in a separate block below the events.
  const items = [];
  (S.log || []).forEach((l) => items.push({ t: l.t, kind: 'log', text: logText(l) }));
  (S.chat || []).forEach((c) => items.push({ t: c.t, kind: c.kind, ...c }));
  items.sort((a, b) => a.t - b.t);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = items.map((it) => {
    if (it.kind === 'log') return it.text
      ? `<div class="lg"><i>${clock(it.t)}</i><span>${it.text}</span></div>` : '';
    if (it.kind === 'shout') return `<div class="bubble shout"><div><div class="who">${esc(it.name)}</div><div class="tx">${esc(it.text)}</div></div></div>`;
    const mine = it.id === S.you.id;
    return `<div class="bubble${mine ? ' mine' : ''}"><div><div class="who">${esc(it.name)}</div><div class="tx">${esc(it.text)}</div></div></div>`;
  }).join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* --------------------------------------------------------------- actions */
async function play() {
  if (!picked.size) return;
  const ids = [...picked];
  const r = await post('/api/action', { token, type: 'play', cardIds: ids });
  if (r.status !== 200) { toast(errorText(r.body.error)); return; }
  picked.clear();
  renderHand();
  renderActions();
}

async function pass() {
  const r = await post('/api/action', { token, type: 'pass' });
  if (r.status !== 200) { toast(errorText(r.body.error)); return; }
  picked.clear();
}

async function startGame() {
  const r = await post('/api/action', { token, type: 'start' });
  if (r.status !== 200) { toast(errorText(r.body.error)); return; }
  picked.clear();
}

/**
 * Send a chat line. Cleared the moment it is sent, not when the server
 * confirms — the input must never sit there holding words the player already
 * let go of, which is what happens if the round-trip is slow and she taps
 * again. The broadcast that comes back re-renders the feed with the message.
 */
async function sendChat() {
  const inp = $('#chatInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  const r = await post('/api/action', { token, type: 'chat', text: txt });
  if (r.status !== 200) { toast(errorText(r.body.error)); inp.value = txt; }
}

/* --------------------------------------------------------------- emoji picker */
/**
 * Twenty reactions, chosen by the player.
 *
 * The button used to fire a RANDOM one from a list of eight. That is a toy, not
 * communication: you cannot say what you mean, and a random 😭 when you meant
 * 🎉 is worse than saying nothing. So the button opens a picker instead, and the
 * set is wide enough to actually cover a table — encouragement, dismay, luck,
 * triumph.
 *
 * Same list in both games, deliberately: a player who learns where 👍 is on one
 * table should not have to look again on the other.
 */
const EMOJIS = [
  '😀', '😂', '🤣', '🥳', '😍',
  '😎', '🤔', '😱', '😭', '😡',
  '👍', '👏', '🙏', '💪', '🔥',
  '🎉', '❤️', '💯', '🍀', '⭐',
];

let emojiBuilt = false;

function buildEmojiPop() {
  if (emojiBuilt) return;
  $('#emojiGrid').innerHTML = EMOJIS.map((e) =>
    `<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('');
  $('#emojiGrid').querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      closeEmojiPop();
      post('/api/action', { token, type: 'shout', emoji: b.dataset.e }).catch(() => {});
    };
  });
  emojiBuilt = true;
}

/**
 * Place the popover over the button that opened it.
 *
 * `left` is the CENTRE, not the edge: the stylesheet shifts the box by
 * translateX(-50%) so it grows outwards from that point. Clamping the edge
 * instead put the whole popover 134px off the left of a 390px phone — a real
 * bug, found by measuring rather than by looking at the source.
 *
 * The box is `position:fixed`, so it does NOT follow the button: anything that
 * moves the button (a scroll, a resize) has to re-place it.
 */
function placeEmojiPop() {
  const pop = $('#emojiPop');
  const btn = $('#emojiBtn').getBoundingClientRect();
  const w = pop.offsetWidth;
  if (!w) return;
  const cx = btn.left + btn.width / 2;
  pop.style.left = Math.min(Math.max(cx, w / 2 + 12), window.innerWidth - w / 2 - 12) + 'px';
  pop.style.bottom = (window.innerHeight - btn.top + 10) + 'px';
}

function toggleEmojiPop() {
  const pop = $('#emojiPop');
  if (!pop.classList.contains('hidden')) { closeEmojiPop(); return; }
  buildEmojiPop();
  pop.classList.remove('hidden');
  placeEmojiPop();
  $('#emojiBtn').setAttribute('aria-expanded', 'true');
}

function closeEmojiPop() {
  $('#emojiPop').classList.add('hidden');
  $('#emojiBtn').setAttribute('aria-expanded', 'false');
}

// A tap anywhere else dismisses it. Listening on the document rather than on a
// scrim keeps the table live behind the picker — which is the point of a popover.
document.addEventListener('click', (e) => {
  const pop = $('#emojiPop');
  if (pop.classList.contains('hidden')) return;
  if (pop.contains(e.target) || e.target.closest('#emojiBtn')) return;
  closeEmojiPop();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEmojiPop();
});
// Re-place rather than close on a viewport change. Closing was the first
// instinct and it is wrong on a phone: scrolling down collapses the URL bar,
// which fires `resize`, and the picker would vanish mid-choice. It is only two
// style writes, so following the button is cheaper than the surprise.
window.addEventListener('resize', () => {
  if (!$('#emojiPop').classList.contains('hidden')) placeEmojiPop();
});
window.addEventListener('scroll', () => {
  if (!$('#emojiPop').classList.contains('hidden')) placeEmojiPop();
}, { passive: true });

async function leave() {
  try { await post('/api/action', { token, type: 'leave' }); } catch (e) { /* gone */ }
  localStorage.removeItem(SESSION_KEY);
  if (es) { try { es.close(); } catch (e) { /* gone */ } }
  location.href = '/?view=games';
}

/* ------------------------------------------------------------- overlay */
function confetti() {
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#e63946', '#f0b429', '#1f9d63', '#2b6cf0', '#c9971b'];
  for (let i = 0; i < 44; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3600);
}

function renderOverlay() {
  const root = $('#modalRoot');
  if (S.state !== 'ended' || !S.winner) {
    if (root.dataset.kind === 'end') { root.innerHTML = ''; delete root.dataset.kind; }
    return;
  }
  if (root.dataset.kind === 'end') return; // already shown for this state
  const win = S.players.find((p) => p.id === S.winner);
  const iWon = S.winner === S.you.id;
  root.dataset.kind = 'end';
  root.innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="big-av">${iWon ? '🏆' : (win ? win.avatar : '🙂')}</div>
        <h2>${esc(iWon ? t('winTitle') : t('loseTitle', { name: win ? win.name : '' }))}</h2>
        <p>${esc(iWon ? t('winSub') : t('loseSub'))}</p>
        ${S.you.canStart ? `<button class="btn primary" id="againBtn">${esc(t('againBtn'))}</button>` : ''}
        <button class="btn" id="hubBtn" style="margin-top:8px">${esc(t('backToHub'))}</button>
      </div>
    </div>`;
  const again = document.getElementById('againBtn');
  if (again) again.onclick = () => { $('#modalRoot').innerHTML = ''; delete $('#modalRoot').dataset.kind; startGame(); };
  document.getElementById('hubBtn').onclick = () => { location.href = '/?view=games'; };
  if (iWon) confetti();
}

/* ----------------------------------------------------------------- boot */
function initLobby() {
  paintStatic();
  renderAvatars();
  const sess = loadSession();
  if (sess && sess.name) $('#nameInput').value = sess.name;
  if (sess && sess.avatar) { myAvatar = sess.avatar; renderAvatars(); }

  // A share link is /games/bigtwo/ABCD — pre-fill the code.
  const m = location.pathname.match(/\/([A-Z0-9]{4})\/?$/);
  if (m) $('#codeInput').value = m[1];

  $('#createBtn').onclick = createRoom;
  $('#joinBtn').onclick = joinRoom;
  $('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });
  $('#nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') createRoom(); });

  $('#playBtn').onclick = play;
  $('#passBtn').onclick = pass;
  $('#startBtn').onclick = startGame;
  $('#leaveBtn').onclick = leave;
  $('#soundBtn').onclick = () => {
    sound = !sound;
    localStorage.setItem(SOUND_KEY, sound ? 'on' : 'off');
    renderSoundIcon();
  };
  $('#feedBtn').onclick = () => {
    $('#feed').classList.toggle('hidden');
    // Opening the panel should land on the newest line, not leave the player
    // scrolling to it — there is real content in here now, not just a log.
    const b = $('#feedBody');
    if (!$('#feed').classList.contains('hidden')) setTimeout(() => { b.scrollTop = b.scrollHeight; }, 30);
  };
  $('#feedClose').onclick = () => $('#feed').classList.add('hidden');
  $('#chatSend').onclick = sendChat;
  $('#chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
  $('#emojiBtn').onclick = () => toggleEmojiPop();
  $('#codeChip').onclick = async () => {
    const url = location.origin + BASE + code;
    try { await navigator.clipboard.writeText(url); toast(url); }
    catch (e) { toast(url); }
  };

  // Resume a session if the room still knows us.
  if (sess && sess.token) {
    fetch(BASE + 'api/state?token=' + encodeURIComponent(sess.token))
      .then((r) => (r.ok ? r.json() : null))
      .then((st) => {
        if (!st) { localStorage.removeItem(SESSION_KEY); return; }
        token = sess.token;
        code = st.code;
        enterRoom({ token: sess.token, code: st.code, name: st.you.name, avatar: st.you.avatar });
      })
      .catch(() => { /* stay in the lobby */ });
  }
}

initLobby();
</script>
