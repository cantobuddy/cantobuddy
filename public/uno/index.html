<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fa">
<meta name="robots" content="noindex">
<title>UNO · CantoBuddy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e63946'/><ellipse cx='50' cy='52' rx='34' ry='24' fill='white' transform='rotate(-18 50 52)'/><text x='50' y='62' font-size='30' font-family='Arial' font-weight='bold' fill='%23e63946' text-anchor='middle'>U</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --red:#e63946; --yellow:#f0b429; --green:#1f9d63; --blue:#2b6cf0;
    --ink:#161922; --muted:#6f7683; --line:#e6e8ef;
    --bg:#f4f5fa; --panel:#ffffff;
    --shadow:0 10px 30px rgba(23,26,35,.08);
    --radius:18px;
  }
  html,body{height:100%}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(60vw 60vw at 8% -10%, rgba(230,57,70,.12), transparent 62%),
      radial-gradient(50vw 50vw at 100% 0%, rgba(43,108,240,.12), transparent 60%),
      radial-gradient(60vw 60vw at 50% 110%, rgba(31,157,99,.10), transparent 60%);
    background-attachment:fixed;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  input{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------------------------------------------------------- lobby */
  #lobby{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 40px}
  .backlink{
    align-self:flex-start;display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:16px;font-weight:600;text-decoration:none;padding:12px 16px;border-radius:14px;background:#fff;
    border:1px solid var(--line);box-shadow:0 4px 12px rgba(23,26,35,.05);margin-bottom:auto;
    min-height:48px;
  }
  .brand{display:flex;gap:6px;margin:14px 0}
  .brand i{
    width:38px;height:52px;border-radius:8px;display:grid;place-items:center;
    font-style:normal;font-weight:800;color:#fff;font-size:22px;
    box-shadow:0 8px 18px rgba(0,0,0,.14);font-family:Arial Black,Arial,sans-serif;
  }
  .brand i:nth-child(1){background:var(--red);transform:rotate(-11deg)}
  .brand i:nth-child(2){background:var(--yellow);transform:rotate(-3deg) translateY(-6px)}
  .brand i:nth-child(3){background:var(--green);transform:rotate(6deg)}
  .brand i:nth-child(4){background:var(--blue);transform:rotate(13deg) translateY(-4px)}
  h1{margin:8px 0 8px;font-size:31px;letter-spacing:-.5px;text-align:center}
  .sub{margin:0 0 22px;color:var(--muted);font-size:16.5px;text-align:center;line-height:1.55;max-width:min(360px,100%)}
  .panel{
    width:100%;max-width:380px;background:var(--panel);border-radius:24px;
    padding:20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
  }
  label{display:block;font-size:15px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.3px}
  .field{
    width:100%;padding:16px 15px;border-radius:14px;border:1.5px solid var(--line);
    background:#fafbfe;font-size:18px;outline:none;transition:.15s;
  }
  .field:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(43,108,240,.1)}
  .avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px;margin-bottom:20px}
  .avatars button{
    aspect-ratio:1;min-height:54px;border-radius:14px;font-size:27px;background:#fafbfe;border:1.5px solid var(--line);
    display:grid;place-items:center;transition:.15s;
  }
  .avatars button.on{border-color:var(--blue);background:#eef3ff;transform:translateY(-2px);box-shadow:0 6px 14px rgba(43,108,240,.18)}
  .btn{
    width:100%;min-height:58px;padding:16px;border-radius:16px;background:#eef0f6;font-weight:700;font-size:18px;
    transition:.15s;border:1.5px solid transparent;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,#2b6cf0,#4a86ff);color:#fff;box-shadow:0 10px 22px rgba(43,108,240,.3)}
  .btn.ghost{background:#fff;border-color:var(--line)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .divider{display:flex;align-items:center;gap:10px;color:#8a909d;font-size:14.5px;margin:18px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .join-row{display:flex;gap:8px}
  .join-row .field{flex:1 1 auto;min-width:0;letter-spacing:5px;text-align:center;font-weight:800;text-transform:uppercase;font-size:22px}
  /* The placeholder is an INSTRUCTION, not a sample code — undo the code styling
     (uppercase, wide spacing, bold) or "Enter code" itself reads as a code. */
  .join-row .field::placeholder{text-transform:none;letter-spacing:0;font-weight:600;font-size:15.5px;color:#8a909d}
  .join-row .btn{flex:0 0 auto;width:auto;padding:0 24px;background:var(--ink);color:#fff;white-space:nowrap;min-height:58px}
  .err{color:var(--red);font-size:15.5px;margin:10px 0 0;min-height:20px;text-align:center}
  /* Her lifetime record. Muted on purpose: it is a fact, not a challenge. */
  .recline{font-size:15px;color:var(--muted);text-align:center;margin:14px 0 0}
  .tips{margin:22px 0 0;padding:0;list-style:none;color:var(--muted);font-size:15px;line-height:1.85;text-align:center;max-width:min(360px,100%)}

  /* ---------------------------------------------------------- room shell */
  #room{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:10px 12px 0;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:8px;padding:6px 2px 10px}
  .codechip{
    display:flex;align-items:center;gap:8px;background:#fff;border-radius:13px;padding:8px 12px;
    box-shadow:0 4px 14px rgba(23,26,35,.07);border:1px solid var(--line);
  }
  .codechip b{letter-spacing:3px;font-size:19px;font-family:ui-monospace,Menlo,monospace}
  .codechip small{color:var(--muted);font-size:13px;display:block;letter-spacing:.4px}
  /* Two labels, one shown at a time. The long one ("Room code · tap to share",
     and in Filipino "Code ng kuwarto · pindutin para i-share") is the better
     copy, but the chip shares the top bar with three 48px buttons, so on a
     320px phone it has about 76px of text width and broke into three
     fragments — "Room code / · tap to / share" — which reads as a layout bug.
     Below 560px the short form keeps it to one line; the 🔗 icon and the
     button's own title still carry the "tap to copy the link" hint. */
  .codechip .cl-short{display:none}
  .iconbtn{
    flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;font-size:21px;box-shadow:0 4px 14px rgba(23,26,35,.06)
  }
  .spacer{flex:1}
  .status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
  .dot.warn{background:var(--yellow)}
  .dot.bad{background:var(--red)}

  /* opponents */
  .opps{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;justify-content:safe center;flex-shrink:0}
  .opps::-webkit-scrollbar{display:none}
  .opp{
    flex:0 0 auto;min-width:94px;background:#fff;border-radius:16px;padding:10px 11px;text-align:center;
    border:2px solid transparent;box-shadow:0 6px 16px rgba(23,26,35,.06);transition:.2s;position:relative;
  }
  .opp.turn{border-color:var(--blue);box-shadow:0 0 0 4px rgba(43,108,240,.13),0 8px 20px rgba(43,108,240,.16);transform:translateY(-2px)}
  .opp.off{opacity:.45;filter:grayscale(.6)}
  .opp .av{font-size:29px;line-height:1.15}
  .opp .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86px;margin-top:3px}
  .opp .cnt{
    display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13px;font-weight:700;
    color:#4b5160;background:#f3f5fa;border-radius:20px;padding:3px 9px;
  }
  .opp .crown{position:absolute;top:-9px;right:-4px;font-size:13px}
  /* The "send this code to your family" card. It is a .opp so it keeps the seat
     surface, but it holds a SENTENCE and a button rather than a name. As a plain
     .opp it measured 386px wide against a 300px strip on a 320px phone — it
     overflowed the horizontal scroller and the instruction was cut off
     mid-sentence, which is the one piece of text in the game a player cannot
     afford to half-read. `flex:1 1 auto` + `min-width:0` makes it take the strip
     and wrap instead. */
  .opp.hint{
    flex:1 1 auto;min-width:0;max-width:none;display:flex;align-items:center;gap:10px;
    text-align:left;color:#6b7280;font-size:15px;line-height:1.4;
  }
  .opp.hint .hint-tx{flex:1 1 auto;min-width:0}
  .opp.hint .wa-btn{
    flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:#fff;
    border:1.5px solid var(--line);color:#25d366;display:grid;place-items:center;
    box-shadow:0 4px 12px rgba(23,26,35,.08);transition:.15s;
  }
  .opp.hint .wa-btn:active{transform:scale(.93)}
  .opp.hint .wa-btn svg{width:26px;height:26px;display:block}

  /* table */
  .table{
    flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:26px;
    padding:6px 0 10px;position:relative;min-height:0;
  }
  .table::before{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(600px,88%);height:min(280px,82%);border-radius:50%;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.95),rgba(255,255,255,.55) 55%,rgba(255,255,255,0) 76%);
    box-shadow:0 26px 50px -40px rgba(23,26,35,.22);
    z-index:0;pointer-events:none;
  }
  .pile{position:relative;z-index:1;display:grid;place-items:center;gap:8px}
  .pile .lbl{font-size:14px;color:var(--muted);font-weight:600}
  .stack{position:relative;width:84px;height:122px}
  .card{
    --w:84px;width:var(--w);height:calc(var(--w)*1.44);border-radius:11px;background:#fff;
    box-shadow:0 6px 16px rgba(23,26,35,.16);position:relative;display:grid;place-items:center;
    overflow:hidden;flex:0 0 auto;
  }
  .card .inner{position:absolute;inset:5px;border-radius:8px;overflow:hidden}
  .card .oval{
    position:absolute;left:50%;top:50%;width:78%;height:60%;transform:translate(-50%,-50%) rotate(-20deg);
    background:#fff;border-radius:50%;display:grid;place-items:center;
  }
  .card .oval span{transform:rotate(20deg);font-weight:900;font-size:calc(var(--w)*.34);font-family:Arial Black,Arial,sans-serif}
  .card .cn{position:absolute;font-size:calc(var(--w)*.16);font-weight:800;color:#fff;font-family:Arial,sans-serif}
  .card .cn.tl{top:4px;left:6px}
  .card .cn.br{bottom:4px;right:6px;transform:rotate(180deg)}
  .card[data-c=red] .inner{background:var(--red)} .card[data-c=red] .oval span{color:var(--red)}
  .card[data-c=yellow] .inner{background:var(--yellow)} .card[data-c=yellow] .oval span{color:#d99a00}
  .card[data-c=green] .inner{background:var(--green)} .card[data-c=green] .oval span{color:var(--green)}
  .card[data-c=blue] .inner{background:var(--blue)} .card[data-c=blue] .oval span{color:var(--blue)}
  .card[data-c=wild] .inner{background:conic-gradient(var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0)}
  .card[data-c=wild] .oval span{color:#2b2b2b;font-size:calc(var(--w)*.2);letter-spacing:-.5px}
  .card.back .inner{background:linear-gradient(140deg,#22262f,#3a4150)}
  .card.back .oval{background:rgba(255,255,255,.92)}
  .card.back .oval span{color:#e63946;font-size:calc(var(--w)*.3);transform:rotate(20deg);font-style:italic}
  .stack .card{position:absolute;inset:0}
  .stack .card:nth-child(2){transform:translate(4px,4px) rotate(4deg)}
  .stack .card:nth-child(3){transform:translate(8px,8px) rotate(8deg)}
  .stack .cnt{
    position:absolute;bottom:-11px;right:-9px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;
    border-radius:20px;padding:2px 8px;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.2)
  }
  .discard-wrap{position:relative;display:grid;place-items:center}
  .discard-wrap::after{
    content:"";position:absolute;width:120px;height:120px;border-radius:50%;
    background:var(--cur,rgba(43,108,240,.25));filter:blur(22px);opacity:.55;z-index:-1;transition:.3s;
  }
  .pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.7) rotate(-8deg);opacity:.4}to{transform:scale(1) rotate(0);opacity:1}}
  /* ---- the status line under the table ----
     This was a 13px grey strip — the quietest thing on the screen — and it
     carries the two facts a player needs most: the colour to match, and
     whose turn it is. The operator's complaint (sent from a phone, with the
     line circled) was that it was "very small, difficult to notice", and
     that an elderly player could not comfortably play with her grandson.

     Two changes, both measured rather than guessed (tools/uno-elder-measure.js):

     1. HIERARCHY. The turn is the fact a player acts on, so it gets its own
        row in its own pill, at a larger size, in ink rather than grey. The
        colour and the direction are context, so they share a quieter row
        above it. The row is now TWO rows on purpose and always two rows —
        the alternative, one row that wraps only when the turn belongs to
        someone else, would change the height of the table from turn to turn
        and move the cards under the player's thumb.

     2. SIZE. 13px -> 14.5px for the context row, 16.5px for the turn pill.
        The colour swatch grows from an 11px dot to an 18px one with a white
        ring, because "which colour" was being answered by a dot that read
        as punctuation next to a word.

     The pill is a separate element from the row above it, so the two never
     compete for the same line — that is what keeps the height fixed. Its
     text is allowed to WRAP rather than being clipped: a name the server
     allows to be twelve characters long must still be readable, and a
     half-printed name is worse than a taller pill. */
  .metaline{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:14.5px;color:var(--muted);padding:0 4px 5px;
  }
  .metaline-row{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0;max-width:100%;line-height:1.2}
  .metaline b{color:var(--ink)}
  #colorMeta{font-weight:700;color:var(--ink)}
  .swatch{
    width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:6px;
    box-shadow:0 0 0 2px rgba(255,255,255,.95),0 1px 3px rgba(0,0,0,.18);
  }
  .dirbadge{font-size:14px}
  #turnMeta{
    font-size:16.5px;font-weight:800;color:var(--ink);max-width:100%;
    background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:3px 15px;box-shadow:0 4px 12px rgba(23,26,35,.07);text-align:center;
  }
  /* "Your turn" is the one line on the screen that says the game is waiting
     for YOU, so it is the one line that gets the accent colour. The wording
     still says it in words, so the meaning does not depend on the colour. */
  #turnMeta.mine{background:#e9f0ff;border-color:#c9dcff;color:#1a4fd0}
  .roundchip{font-size:13.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;white-space:nowrap;box-shadow:0 4px 12px rgba(23,26,35,.05)}

  /* hand */
  /* YOUR OWN SEAT, drawn in the same language as the opponent cards above it:
     the same white surface, the same 2px edge that lights up blue on your turn,
     the same soft shadow, and the card count in the same grey pill. It was a
     bare text line — "brenda  Waiting for 真" — which read as a caption rather
     than as a player, so the one seat you look at most was the only one that
     did not look like a seat.
     It stays a ROW on purpose. A vertical seat card is 74px and #room has 8px
     of slack at 320x568 (the table can only give 43 before it hits its floor),
     so the vertical shape would push the action bar out of reach — the exact
     failure the type scale-up was careful to avoid. Same look, one line. */
  .me-bar{
    display:flex;align-items:center;gap:10px;padding:7px 12px;margin:2px 0 6px;
    background:#fff;border-radius:16px;border:2px solid transparent;
    box-shadow:0 6px 16px rgba(23,26,35,.06);transition:.2s;
  }
  .me-bar.turn{border-color:var(--blue);box-shadow:0 0 0 4px rgba(43,108,240,.13),0 8px 20px rgba(43,108,240,.16)}
  .me-bar .av{font-size:26px;line-height:1}
  /* min-width:0 + ellipsis on both: the card's 12px padding and the count's
     pill cost about 36px of row width at 320px, and a long name ("Maria
     Cristina") beside a long tag ("Naghihintay kay Maria") would otherwise
     push the row past the right edge. Truncating is the honest failure. */
  .me-bar .nm{font-size:16.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The card count on your own row. It was an inline 11.5px span — the smallest
     text in the game, and the one number a player checks most. */
  .me-bar .cnt{
    display:inline-flex;align-items:center;font-size:13.5px;font-weight:700;color:#4b5160;
    background:#f3f5fa;border-radius:20px;padding:4px 10px;white-space:nowrap;
  }
  .me-bar .tag{
    font-size:13px;background:#eef3ff;color:var(--blue);font-weight:700;padding:4px 10px;border-radius:20px;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .me-bar .tag.turn{background:#e8f8ef;color:var(--green)}
  .hand-scroll{overflow-x:auto;overflow-y:visible;padding:14px 6px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:0 0 auto}
  .hand-scroll::-webkit-scrollbar{display:none}
  .hand{display:flex;padding-right:14px;align-items:flex-end}
  .hand .card{
    --w:74px;margin-left:-26px;transition:transform .16s,box-shadow .16s,opacity .16s;
    animation:deal .3s ease backwards;
  }
  .hand .card:first-child{margin-left:0}
  @keyframes deal{from{transform:translateY(22px) scale(.9);opacity:0}to{transform:none;opacity:1}}
  .hand .card.ok{cursor:pointer;box-shadow:0 8px 20px rgba(23,26,35,.2),0 0 0 3px rgba(43,108,240,.55)}
  .hand .card.ok:hover{transform:translateY(-16px)}
  .hand .card.no{opacity:.8;filter:saturate(.82)}
  .hand .card.no:active{transform:translateX(-3px)}
  .hand-empty{color:#6b7280;font-size:15px;padding:22px 4px}
  .shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .actions{display:flex;gap:8px;padding:4px 2px 12px;align-items:center;flex-wrap:wrap}
  .act{
    min-height:54px;min-width:48px;padding:13px 19px;border-radius:15px;background:#fff;font-weight:700;font-size:17px;
    border:1.5px solid var(--line);box-shadow:0 4px 12px rgba(23,26,35,.06);transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;gap:7px
  }
  .act:active{transform:scale(.96)}
  .act:disabled{opacity:.4;box-shadow:none}
  .act.uno{background:linear-gradient(135deg,#e63946,#ff6a4d);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(230,57,70,.3);margin-left:4px}
  .act.emoji{padding:13px 15px}

  /* feed */
  .feed{
    position:fixed;right:14px;bottom:14px;width:290px;max-height:56vh;background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 18px 44px rgba(23,26,35,.18);
    border:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden;
  }
  .feed-head{display:flex;align-items:center;gap:6px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
  /* The ✕ was a bare 14px glyph with no padding — roughly a 20x22 target, the
     smallest thing on the screen and the only way out of the panel. The
     negative margin keeps the 48px hit area from inflating the header. */
  .feed-close{
    flex:0 0 auto;min-width:48px;min-height:48px;display:grid;place-items:center;
    font-size:18px;color:#9aa1ae;border-radius:12px;margin:-8px -8px -8px 0;
  }
  .feed-close:active{background:#eef1f8}
  .feed-body{flex:1;overflow-y:auto;padding:9px 13px;font-size:15px;line-height:1.65}
  .feed-body .lg{color:#4b5160;display:flex;gap:6px}
  .feed-body .lg i{font-style:normal;opacity:.5;flex:0 0 auto}
  .bubble{margin:6px 0;display:flex;gap:6px}
  .bubble .tx{background:#f1f3f9;border-radius:12px;padding:6px 10px;max-width:200px;word-break:break-word}
  .bubble.mine .tx{background:#e9f0ff}
  .bubble .who{font-size:13px;color:var(--muted);margin-bottom:3px}
  .shout .tx{background:linear-gradient(135deg,#fff3d6,#ffe6b8);font-weight:800;color:#a56a00}
  .feed-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .feed-foot input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;outline:none;background:#fafbfe}
  .feed-foot button{background:var(--blue);color:#fff;border-radius:12px;padding:0 16px;font-weight:700;font-size:16px;min-height:48px}

  /* ---- emoji picker ---- */
  /* A popover, not a modal: the table stays live behind it, because a reaction
     is an aside — you glance, you pick, you carry on. `left`/`bottom` are set in
     JS from the button's rect; only the transform is here, so the entrance
     animation cannot fight the positioning. */
  .emoji-pop{
    position:fixed;z-index:60;width:min(292px,calc(100vw - 24px));
    background:rgba(255,255,255,.98);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(23,26,35,.22);
    padding:10px 10px 8px;transform:translateX(-50%);
    animation:emojiPop .16s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes emojiPop{from{opacity:0;margin-bottom:-8px}to{opacity:1;margin-bottom:0}}
  .emoji-pop-head{
    font-size:13px;font-weight:800;color:var(--muted);text-align:center;
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;
  }
  /* Five across: at 292px that is a ~52px target, above the 44px minimum for a
     thumb, and four rows of twenty keeps the whole set on screen unscrolled. */
  .emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .emoji-grid button{
    aspect-ratio:1;border:none;background:none;border-radius:12px;padding:0;
    font-size:27px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:transform .1s,background .1s;-webkit-tap-highlight-color:transparent;
  }
  .emoji-grid button:active{transform:scale(.85);background:#eef1f8}
  @media(hover:hover){.emoji-grid button:hover{background:#eef1f8}}

  /* overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(20,23,30,.5);backdrop-filter:blur(6px);z-index:60;
    display:grid;place-items:center;padding:20px;animation:fade .2s
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:330px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.25);animation:up .25s cubic-bezier(.3,1.4,.5,1)}
  @keyframes up{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 8px;font-size:24px}
  .modal p{margin:0 0 18px;color:var(--muted);font-size:16px;line-height:1.55}
  .colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .colors button{height:76px;border-radius:18px;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:.15s}
  .colors button:active{transform:scale(.96)}
  .c-red{background:var(--red)} .c-yellow{background:var(--yellow)} .c-green{background:var(--green)} .c-blue{background:var(--blue)}
  .big-av{font-size:56px;line-height:1;margin-bottom:6px}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .confetti i{position:absolute;top:-16px;width:8px;height:15px;border-radius:2px;animation:fall linear forwards;opacity:.95}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.85}}
  .toast{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:12px;font-size:15.5px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:90vw;text-align:center
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* On-table speech.
     The chat panel is opt-in, so a message sent while it happened to be closed
     was invisible to everyone: the sender got no confirmation, and the others
     only found out by opening a panel they had no reason to open. These
     bubbles float the newest messages over the table itself for a few seconds,
     then leave. `pointer-events:none` throughout, because a message must never
     steal a tap aimed at a card. */
  .tablesay{
    position:fixed;left:50%;transform:translateX(-50%);top:62px;
    z-index:35;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    width:min(92vw,360px);
  }
  .ts-item{
    display:flex;align-items:flex-start;gap:8px;max-width:100%;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:7px 12px;box-shadow:0 10px 26px rgba(23,26,35,.15);
    animation:tsIn .22s ease-out;
  }
  @keyframes tsIn{from{opacity:0;transform:translateY(-7px) scale(.95)}to{opacity:1;transform:none}}
  .ts-item.out{animation:tsOut .3s ease-in forwards}
  @keyframes tsOut{to{opacity:0;transform:translateY(-7px)}}
  .ts-av{font-size:19px;line-height:1.25;flex:0 0 auto}
  .ts-body{min-width:0}
  .ts-who{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ts-tx{font-size:15px;line-height:1.45;word-break:break-word;overflow-wrap:anywhere}
  .ts-item.shout{background:linear-gradient(135deg,#fff3d6,#ffe6b8);border-color:#f3d49a;padding:9px 14px}
  .ts-item.shout .ts-tx{font-size:25px;line-height:1.3;font-weight:800;color:#a56a00}
  @media(max-width:560px){ .tablesay{top:54px;width:min(94vw,320px)} }
  @media(prefers-reduced-motion:reduce){
    .ts-item{animation:none} .ts-item.out{animation:none;opacity:0}
  }

  @media(min-width:900px){
    .hand .card{--w:86px;margin-left:-16px}
    .hand .card.ok:hover{transform:translateY(-20px)}
    .card{--w:96px}
    .stack{width:96px;height:138px}
  }
  @media(min-width:1100px){
    #room{max-width:1000px;margin-right:326px}
    .feed{top:10px;bottom:auto;right:12px;height:calc(100dvh - 20px);max-height:none}
  }
  @media(max-width:899px){
    .feed{width:calc(100vw - 24px);right:12px;bottom:12px;max-height:46vh}
  }
  @media(max-width:560px){
    #room{padding:8px 10px 0}
    .topbar{gap:6px;padding:4px 0 5px}
    .codechip{padding:6px 10px;border-radius:11px;gap:6px}
    .codechip b{font-size:18px;letter-spacing:2px}
    .codechip small{font-size:13px}
    .codechip .cl-long{display:none}
    .codechip .cl-short{display:block}
    .roundchip{display:none}
    .status span:last-child{display:none}
    .iconbtn{flex:0 0 auto;width:48px;height:48px;border-radius:14px;font-size:20px}
    .opps{gap:8px;padding-bottom:8px}
    .opp{min-width:88px;padding:9px 10px;border-radius:15px}
    .opp .av{font-size:26px}
    .opp .nm{font-size:13.5px;max-width:76px}
    .opp .cnt{font-size:13px;padding:3px 8px}
    .card{--w:76px}
    .stack{width:76px;height:110px}
    #room{justify-content:space-between}
    .table{flex:1 1 auto;height:auto;min-height:128px;gap:18px}
    .table::before{width:94%;height:100%;box-shadow:0 18px 34px -30px rgba(23,26,35,.2)}
    /* The status line keeps the two-row shape it has everywhere else, at the
       same sizes. It used to shrink to 13px here — the one place the type was
       SMALLEST was the phone, which is backwards: that is where an elderly
       player's face is closest to the screen. */
    .metaline{gap:4px;font-size:15px;padding:0 4px 3px}
    #turnMeta{font-size:16.5px;padding:4px 12px}
    .me-bar{padding:6px 10px;gap:8px;border-radius:15px}
    .me-bar .av{font-size:24px}
    .me-bar .nm{font-size:18px}
    .me-bar .cnt{font-size:15px}
    .opp .nm{font-size:15.5px;max-width:92px}
    .opp .cnt{font-size:14.5px}
    .pile .lbl{font-size:15.5px}
    /* The turn tag duplicates the metaline directly above it, which names the
       player in full on its own line at the same 13px. On a 320px phone the tag
       got 99px of room for 168px of text and rendered "Waiting fo…", while the
       line above already read "Waiting for Naghihintay" — so it cost width and
       conveyed less. Absent beats truncated; the card's blue edge and the
       metaline both still say whose turn it is. */
    .me-bar .tag{display:none}
    .hand .card{--w:66px;margin-left:-22px}
    .hand-scroll{padding:12px 4px 6px}
    .actions{gap:6px;padding:2px 2px calc(8px + env(safe-area-inset-bottom))}
    .act{padding:12px 14px;font-size:16px;border-radius:15px;min-height:52px}
    .act.emoji{padding:12px}
    .modal{padding:20px}
  }
  @media(max-height:680px){
    .opp .cnt{display:none}
    .metaline{padding-bottom:2px}
    .hand-scroll{padding-top:10px}
  }

<body>

<!-- ============================ LOBBY ============================ -->
<main id="lobby">
  <a class="backlink" href="/?view=games" id="backLink">← <span data-k="backToApp"></span></a>
  <div class="brand"><i>U</i><i>N</i><i>O</i><i>!</i></div>
  <h1 data-k="title"></h1>
  <p class="sub" data-k="sub"></p>

  <div class="panel">
    <label data-k="nameLabel"></label>
    <input id="nameInput" class="field" maxlength="12" autocomplete="off">

    <label style="margin-top:16px" data-k="avatarLabel"></label>
    <div id="avatarPicker" class="avatars"></div>

    <button id="createBtn" class="btn primary" data-k="createBtn"></button>

    <div class="divider"><span data-k="divider"></span></div>
    <div class="join-row">
      <input id="codeInput" class="field" maxlength="4" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn" class="btn" data-k="joinBtn"></button>
    </div>
    <p id="lobbyErr" class="err"></p>
  </div>

  <!-- Her record across every game. Empty and hidden until she has finished
       one, so a stranger's first screen is unchanged. -->
  <p id="myRecord" class="recline hidden"></p>

  <ul class="tips">
    <li data-k="tip1"></li>
    <li data-k="tip2"></li>
  </ul>
</main>

<!-- ============================ ROOM ============================ -->
<section id="room" class="hidden">
  <div class="topbar">
    <div class="codechip" id="codeChip">
      <div>
        <small class="cl-long" data-k="codeChipLabel"></small>
        <small class="cl-short" data-k="codeChipShort"></small>
        <b id="codeText">----</b>
      </div>
      <span style="font-size:15px">🔗</span>
    </div>
    <div class="roundchip" id="roundChip"></div>
    <div class="spacer"></div>
    <div class="status"><span class="dot" id="liveDot"></span><span id="liveText"></span></div>
    <button class="iconbtn" id="soundBtn"><span id="soundIcon"></span></button>
    <button class="iconbtn" id="feedBtn"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8a7.6 7.6 0 0 1-7.6 7.6H9.4L4.5 22v-4.6a7.6 7.6 0 1 1 16-5.6z"/></svg></button>
    <button class="iconbtn" id="leaveBtn"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h3.5A1.5 1.5 0 0 1 19 6v12a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M9.5 8 5.5 12l4 4"/><path d="M5.5 12H15"/></svg></button>
  </div>

  <div class="opps" id="opps"></div>

  <div class="table">
    <div class="pile">
      <div class="stack" id="drawPile"></div>
      <div class="lbl" id="deckLbl"></div>
    </div>
    <div class="pile">
      <div class="discard-wrap" id="discardWrap"></div>
      <div class="lbl" data-k="discardLabel"></div>
    </div>
  </div>

  <div class="metaline">
    <div class="metaline-row">
      <span id="colorMeta"></span>
      <span id="dirMeta"></span>
    </div>
    <span id="turnMeta"></span>
  </div>

  <div class="me-bar" id="meBar">
    <span class="av" id="myAv">🙂</span>
    <span class="nm" id="myName"></span>
    <span class="tag" id="myTag"></span>
    <span class="spacer"></span>
    <span class="cnt" id="myCount"></span>
  </div>

  <div class="hand-scroll" id="handScroll">
    <div class="hand" id="hand"></div>
  </div>

  <div class="actions" id="actions">
    <button class="act" id="drawBtn"></button>
    <button class="act" id="startBtn" style="display:none"></button>
    <!-- This OPENS a picker rather than firing a random emoji. "Surprise me" is
         a toy; choosing what you mean is communication, and a random 😭 when
         you meant 🎉 is worse than nothing. Identical picker on the Big Two
         table, so the muscle memory carries across. -->
    <button class="act emoji" id="emojiBtn" aria-haspopup="dialog" aria-expanded="false">😀</button>
    <button class="act uno" id="unoBtn">UNO!</button>
  </div>
</section>

<!-- ---- emoji picker ----------------------------------------------------
     A popover over the button that opened it, so the thumb does not have to
     travel. Positioned in JS from the button's own rect and clamped to the
     viewport, because a fixed offset overflows on a 320px phone. -->
<div class="emoji-pop hidden" id="emojiPop" role="dialog" aria-modal="false">
  <div class="emoji-pop-head" data-k="emojiPickTitle"></div>
  <div class="emoji-grid" id="emojiGrid"></div>
</div>

<!-- ============================ FEED ============================ -->
<aside class="feed hidden" id="feed">
  <div class="feed-head">
    <span data-k="feedHead"></span>
    <span class="spacer"></span>
    <button id="feedClose" class="feed-close">✕</button>
  </div>
  <div class="feed-body" id="feedBody"></div>
  <div class="feed-foot">
    <input id="chatInput" maxlength="140" autocomplete="off">
    <button id="chatSend" data-k="sendBtn"></button>
  </div>
</aside>

<div class="toast" id="toast"></div>
<!-- Transient on-table speech. aria-live so a screen-reader user hears the
     message too, rather than having to go and open the panel. -->
<div class="tablesay" id="tableSay" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot"></div>

const LANG = (function () {
  const saved = (localStorage.getItem('cb_lang') || '').toLowerCase();
  if (STR[saved]) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.indexOf('zh') === 0) return 'zh';
  if (nav.indexOf('id') === 0) return 'id';
  if (nav.indexOf('tl') === 0 || nav.indexOf('fil') === 0) return 'fil';
  return 'en';
})();

function t(key, vars) {
  const dict = STR[LANG] || STR.en;
  let s = dict[key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  if (vars) {
    Object.keys(vars).forEach((k) => { s = s.split('{' + k + '}').join(String(vars[k])); });
  }
  return s;
}

/**
 * Where the game's API lives, derived from the page URL.
 *
 * The game is mounted at /games/uno, and a shared invite is /games/uno/ABCD —
 * neither ends in a slash, so a bare relative fetch('api/create') would resolve
 * one level too high and 404. Both shapes collapse to /games/uno/ here.
 */
const BASE = (function () {
  let p = location.pathname;
  if (!p.endsWith('/')) {
    const seg = p.split('/').pop();
    // Drop the code but KEEP the slash: '/games/uno/ABCD' -> '/games/uno/', not
    // '/games/uno'. Slicing a fixed 5 characters off does exactly the wrong
    // thing here and every API call lands on /games/unoapi/… and 404s.
    p = /^[A-Z0-9]{4}$/.test(seg) ? p.slice(0, -seg.length) : p + '/';
  }
  return p;
})();

function errorText(code) {
  if (!code) return t('errNet');
  const key = 'err' + code.charAt(0).toUpperCase() + code.slice(1);
  const s = (STR[LANG] || STR.en)[key] || STR.en[key];
  return s || t('errBadRequest');
}

async function api(path, body) {
  const res = await fetch(BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(errorText(data.error));
  return data;
}

/* ============================================================ sound */
/* One small synth for the whole game: a note, a slide, and a master bus.
   This used to be five bare `beep()` calls at gain 0.04-0.07 — roughly a
   sixteenth of full scale — which on a phone speaker is a click you have to be
   listening for. Everything now goes through MASTER and a limiter, so "louder"
   is one number and a four-note fanfare cannot clip.
   Everything is major and upward-moving: a rising interval reads as friendly,
   a falling one as a mistake. `bad` is the only one that goes down, because it
   should sound like "not that one". */
const MASTER = 0.55;
let masterBus = null;

function ac() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  /* A context created before the first tap starts 'suspended', and every sound
     scheduled on it is silent WITHOUT throwing — the classic "sound is broken"
     that has nothing to fix. Resume is free. */
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!masterBus) {
    masterBus = audioCtx.createDynamicsCompressor();
    masterBus.threshold.value = -10;
    masterBus.knee.value = 8;
    masterBus.ratio.value = 12;
    masterBus.attack.value = 0.003;
    masterBus.release.value = 0.22;
    masterBus.connect(audioCtx.destination);
  }
  return audioCtx;
}

/** One note. `amp` is relative to MASTER; the fast attack keeps it percussive. */
function tone(freq, dur = 0.09, type = 'sine', amp = 0.6, delay = 0) {
  if (!soundOn) return;
  try {
    const ctx = ac();
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp * MASTER), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterBus);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}

/** A note that bends from one pitch to another — the cartoon "boing". */
function slide(f1, f2, dur = 0.16, type = 'sine', amp = 0.6, delay = 0) {
  if (!soundOn) return;
  try {
    const ctx = ac();
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp * MASTER), t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(masterBus);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}

const sfx = {

  draw: () => { slide(560, 330, 0.14, 'sine', 0.5); },
  turn: () => { tone(784, 0.09, 'sine', 0.6); tone(1046, 0.13, 'sine', 0.55, 0.09); },

    b.textContent = a;
    b.className = a === myAvatar ? 'on' : '';
    b.onclick = () => { myAvatar = a; renderAvatars(); };
    box.appendChild(b);
  });
}

function initLobby() {
  myAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
  renderAvatars();
  const saved = localStorage.getItem('uno.name');
  if (saved) $('#nameInput').value = saved;

  const params = new URLSearchParams(location.search);
  let code = (params.get('room') || '').toUpperCase();
  const m = location.pathname.match(/\/([A-Za-z0-9]{4})$/);
  if (!code && m && /^[A-Z0-9]{4}$/.test(m[1].toUpperCase())) code = m[1].toUpperCase();
  if (code) { $('#codeInput').value = code; setTimeout(() => $('#nameInput').focus(), 100); }
}

function myName() {
  return ($('#nameInput').value || '').trim() || 'Player' + Math.floor(Math.random() * 90 + 10);
}

/**
 * The same device identity the rest of the app uses (DEVICE_KEY in app.js).
 *
 * It is what lets a win here and a quiz there belong to one person, and it is
 * why the record survives closing the tab. Created here if the app has never
 * been opened on this device — the format matches, so the two agree whichever
 * gets there first.
 */
function deviceId() {
  try {
    let id = localStorage.getItem('cb_device');
    if (!id) {
      const b = new Uint8Array(16);
      crypto.getRandomValues(b);
      id = 'dev_' + Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('cb_device', id);
    }
    return id;
  } catch (e) { return null; }
}

/** Her record at this game, for the lobby. Nothing at all if she has never played. */
async function loadMyRecord() {
  const el = $('#myRecord');
  if (!el) return;
  try {
    const r = await fetch('/api/games/record?public_id=' + encodeURIComponent(deviceId() || ''));
    const d = await r.json();
    const rec = d && d.games && d.games.uno;
    if (!rec || !rec.played) { el.classList.add('hidden'); return; }
    el.textContent = t('recordLine', { wins: rec.wins, played: rec.played });
    el.classList.remove('hidden');
  } catch (e) { /* a record is not worth an error message */ }
}

async function doCreate() {
  const btn = $('#createBtn');
  btn.disabled = true;
  $('#lobbyErr').textContent = '';
  try {
    const name = myName();
    localStorage.setItem('uno.name', name);
    const d = await api('api/create', { name, avatar: myAvatar, deviceId: deviceId() });
    session = { code: d.code, token: d.token, name: d.name, avatar: d.avatar };
    saveSession();
    enterRoom();
  } catch (e) {
    $('#lobbyErr').textContent = e.message;
  } finally { btn.disabled = false; }
}

async function doJoin() {
  const btn = $('#joinBtn');
  const code = ($('#codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 4) { $('#lobbyErr').textContent = t('errCode'); return; }
  btn.disabled = true;
  $('#lobbyErr').textContent = '';
  try {
    const name = myName();
    localStorage.setItem('uno.name', name);
    const d = await api('api/join', { code, name, avatar: myAvatar, deviceId: deviceId() });
    session = { code: d.code, token: d.token, name: d.name, avatar: d.avatar };
    saveSession();
    enterRoom();
  } catch (e) {
    $('#lobbyErr').textContent = e.message;
  } finally { btn.disabled = false; }
}

/* ============================================================ room */
function enterRoom() {
  $('#lobby').classList.add('hidden');
  $('#room').classList.remove('hidden');
  $('#codeText').textContent = session.code;
  $('#myAv').textContent = session.avatar || '🙂';
  $('#myName').textContent = session.name;
  /* Joining a room is a fresh feed. Without this, the trackers still held the
     previous room's key, so the first state here looked like news and flashed
     that room's last message onto the table before the player had sat down. */
  chatPrimed = false;
  lastChatKey = null;
  const say = $('#tableSay');
  if (say) say.innerHTML = '';
  history.replaceState(null, '', BASE + session.code);
  connect();
}

function connect() {
  if (es) es.close();
  es = new EventSource(BASE + 'api/events?token=' + encodeURIComponent(session.token));
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.fatal === 'expired') {
      es.close(); es = null;
      session = null; saveSession();
      toast(t('toastExpired'));
      location.href = BASE;
      return;
    }
    applyState(d);
  };
}

function setLive(ok) {
  const dot = $('#liveDot');
  dot.className = 'dot' + (ok ? '' : ' bad');
  $('#liveText').textContent = ok ? t('liveOnline') : t('liveReconnecting');
}

function applyState(st) {
  S = st;

  // sounds / cues
  if (st.event && st.event.type === 'play') sfx.play();
  if (st.event && (st.event.type === 'draw' || st.event.type === 'autopass')) sfx.draw();
  if (st.event && st.event.type === 'shout') sfx.shout();
  if (st.state === 'ended' && st.winner && lastWinnerId !== st.winner) {
    lastWinnerId = st.winner; sfx.win();
  }
  if (st.state === 'playing') lastWinnerId = null;
  if (st.state === 'playing' && st.turn === st.you.id && st.turnStart !== lastTurnStart) sfx.turn();
  lastTurnStart = st.turnStart;

  /* A message from someone else gets the funny sound, and every new message
     gets an on-table bubble.
     Keyed on `t:author` and not on `id`, because a chat item's `id` is the
     AUTHOR — the same player's second message carries the same id, so it would
     dedupe to silence.
     `chatPrimed` is separate from `lastChatKey` on purpose. Priming on "the key
     was null" instead looks equivalent and is not: a room with no chat yet
     never sets a key, so the FIRST message anyone ever sends was treated as
     backlog and played nothing — which is exactly the message the feature
     exists for. Prime once, on the first state, whether or not there is chat. */
  const chat = st.chat || [];
  const newest = chat.length ? chat[chat.length - 1] : null;
  const key = chatKey(newest);
  if (!chatPrimed) {
    chatPrimed = true;
    lastChatKey = key;
  } else if (key && key !== lastChatKey) {
    /* Walk back to the last message we already handled and replay what is
       after it, so two messages that arrive inside one broadcast both show.
       The walk is capped at 4: if `lastChatKey` has aged out of the 60-item
       cap, "not found" must not mean "replay the whole log onto the table". */
    const fresh = [];
    for (let i = chat.length - 1; i >= 0 && fresh.length < 4; i--) {
      if (chatKey(chat[i]) === lastChatKey) break;
      fresh.unshift(chat[i]);
    }
    for (const it of fresh) {
      if (it.id !== st.you.id && it.kind !== 'shout') sfx.msg();
      showTableSay(it);
    }
    lastChatKey = key;
  }

  renderTop();
  renderOpps();
  renderTable();
  renderHand();
  renderActions();
  renderFeed();
  renderOverlay();
}

function renderTop() {
  $('#myCount').textContent = t('myCount', { n: S.you.hand.length });
  const tag = $('#myTag');
  if (S.state === 'lobby') { tag.textContent = t('tagWaiting'); tag.className = 'tag'; }
  else if (S.state === 'ended') { tag.textContent = t('tagEnded'); tag.className = 'tag'; }
  else if (S.you.isTurn) { tag.textContent = t('tagYourTurn'); tag.className = 'tag turn'; }
  else { tag.textContent = t('tagWaitingFor', { name: S.turnName || '' }); tag.className = 'tag'; }

  // Your own seat lights up the same way an opponent's does, so "whose turn"
  // reads as one visual language wherever you look. Gated on 'playing' as well
  // as isTurn: in the lobby isTurn can be true before anyone has been dealt.
  $('#meBar').classList.toggle('turn', S.state === 'playing' && !!S.you.isTurn);

  $('#turnMeta').innerHTML = S.state === 'playing'
    ? (S.you.isTurn ? '👉 <b>' + t('turnMine') + '</b>' : t('turnTheirs', { name: '<b>' + esc(S.turnName) + '</b>' }))
    : (S.state === 'lobby' ? t('waitingStart') : t('roundOver'));
  /* "Your turn" is the only state that means the game is waiting on YOU, so
     it is the only one that gets the accent pill. The wording carries the
     meaning; the colour only makes it findable. */
  $('#turnMeta').classList.toggle('mine', S.state === 'playing' && !!S.you.isTurn);

  $('#roundChip').textContent = S.state === 'lobby'
    ? t('roundWaiting', { n: S.players.length })
    : t('roundPlaying', { r: S.round, n: S.players.length });

  const sw = S.color
    ? '<span class="swatch" style="background:' + HEX[S.color] + '"></span>' + t(COLORS[S.color])
    : '';
  $('#colorMeta').innerHTML = sw ? t('colorMeta') + ' ' + sw : '';
  $('#dirMeta').innerHTML = S.state === 'playing'
    ? '<span class="dirbadge">' + (S.dir === 1 ? '↻ ' + t('dirCW') : '↺ ' + t('dirCCW')) + '</span>' : '';
}

function renderOpps() {
  const box = $('#opps');
  box.innerHTML = '';
  S.players.filter((p) => p.id !== S.you.id).forEach((p) => {
    const el = document.createElement('div');
    el.className = 'opp' + (p.isTurn ? ' turn' : '') + (p.connected ? '' : ' off');
    el.innerHTML =
      (p.isHost ? '<span class="crown">👑</span>' : '') +
      '<div class="av">' + p.avatar + '</div>' +
      '<div class="nm">' + esc(p.name) + '</div>' +
      '<div class="cnt">' + t('myCount', { n: p.count }) + (p.wins ? ' · 🏆' + p.wins : '') + '</div>';
    box.appendChild(el);
  });
  if (S.players.length < 2) {
    const el = document.createElement('div');
    el.className = 'opp hint';
    el.innerHTML =
      '<span class="hint-tx">' + esc(t('joinHint', { code: S.code })) + '</span>' +
      '<button class="wa-btn" type="button" aria-label="' + esc(t('waInvite')) + '" title="' + esc(t('waInvite')) + '">' +
      WA_ICON + '</button>';
    box.appendChild(el);
    el.querySelector('.wa-btn').onclick = shareOnWhatsApp;
  }
}

/* ============================================================ invite */
/**
 * The link a family member taps to land in THIS room.
 *
 * The same URL the code chip copies — /games/uno/ABCD, which the client reads
 * back out of the path on boot. Built in one place so the two can never drift:
 * a chip that copies one room and a WhatsApp button that opens another would be
 * the kind of bug nobody notices until a grandmother is in the wrong game.
 */
function inviteUrl() {
  return location.origin + BASE + session.code;
}

/**
 * Hand the invitation to WhatsApp rather than to the clipboard.
 *
 * `wa.me/?text=` is the one form that works everywhere — the app on a phone,
 * WhatsApp Web on a desktop — and it needs no SDK and no login. The message
 * carries the room link, not just the four-letter code, so the person who
 * receives it taps once and is in the room instead of typing a code into a
 * form and getting it wrong.
 */
function shareOnWhatsApp() {
  const url = inviteUrl();
  const msg = t('inviteText', { code: session.code, url });
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
}

function cardEl(card, opts) {
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'card' + (opts.cls ? ' ' + opts.cls : '');
  el.dataset.c = card.color;
  const label = glyph(card.value);
  el.innerHTML =
    '<div class="inner"></div>' +
    '<div class="oval"><span>' + label + '</span></div>' +
    '<div class="cn tl">' + label + '</div>' +
    '<div class="cn br">' + label + '</div>';
  if (opts.id) el.dataset.id = opts.id;
  return el;
}
function glyph(v) {
  if (v === 'skip') return '🚫';
  if (v === 'reverse') return '⇄';
  if (v === 'draw2') return '+2';
  if (v === 'wild') return 'WILD';
  if (v === 'wild4') return '+4';
  return v;
}

/** A card named in the reader's language, for the action log. */
function cardText(c) {
  if (!c) return '?';
  if (c.color === 'wild') return c.value === 'wild4' ? t('cardWild4') : t('cardWild');
  const col = t(COLORS[c.color] || 'colRed');
  if (c.value === 'skip') return col + ' ' + t('cardSkip');
  if (c.value === 'reverse') return col + ' ' + t('cardReverse');
  if (c.value === 'draw2') return col + ' ' + t('cardDraw2');
  return col + ' ' + c.value;
}

/** One log event -> one sentence. The server sends data, never text. */
function logText(ev) {
  switch (ev.k) {
    case 'roomCreated': return t('logRoomCreated', { code: ev.code });
    case 'join': return t('logJoin', { name: ev.name });
    case 'deckRecycled': return t('logDeckRecycled');
    case 'roundStart': return t('logRoundStart', { r: ev.round, name: ev.name, card: cardText(ev.card) });
    case 'win': return t('logWin', { name: ev.name, r: ev.round });
    case 'lastCardOut': return t('logLastCardOut', { who: ev.who, card: cardText(ev.card) });
    case 'skip': return t('logSkip', { who: ev.who, card: cardText(ev.card), victim: ev.victim });
    case 'reverseTwo': return t('logReverseTwo', { who: ev.who, card: cardText(ev.card) });
    case 'reverse': return t('logReverse', { who: ev.who, card: cardText(ev.card) });
    case 'draw2': return t('logDraw2', { who: ev.who, card: cardText(ev.card), victim: ev.victim });
    case 'wild4': return t('logWild4', { who: ev.who, color: t(COLORS[ev.color] || 'colRed'), victim: ev.victim });
    case 'wild': return t('logWild', { who: ev.who, color: t(COLORS[ev.color] || 'colRed') });
    case 'play': return t('logPlay', { who: ev.who, card: cardText(ev.card) });
    case 'oneLeft': return t('logOneLeft', { who: ev.who });
    case 'deckEmptyDraw': return t('logDeckEmptyDraw', { name: ev.name });
    case 'draw': return t('logDraw', { name: ev.name });
    // No 'pass' case: the server has no pass action, so this can never fire.
    case 'leave': return t('logLeave', { name: ev.name });
    case 'backToLobby': return t('logBackToLobby');
    case 'autoPass': return t('logAutoPass', { name: ev.name });
    default: return '';
  }
}

function renderTable() {
  const pile = $('#drawPile');
  pile.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('div');
    b.className = 'card back';
    b.innerHTML = '<div class="inner"></div><div class="oval"><span>UNO</span></div>';
    pile.appendChild(b);
  }
  const c = document.createElement('div');
  c.className = 'cnt';
  c.textContent = S.deckCount;
  pile.appendChild(c);
  $('#deckLbl').textContent = S.deckCount ? t('deckLabel') : t('deckEmpty');

  const dw = $('#discardWrap');
  dw.innerHTML = '';
  if (S.discardTop) {
    const el = cardEl({ color: S.discardTop.color, value: S.discardTop.value });
    if (S.discardTop.id !== lastDiscardId) { el.classList.add('pop'); lastDiscardId = S.discardTop.id; }
    dw.appendChild(el);
  }
  dw.style.setProperty('--cur', S.color ? HEX[S.color] + '66' : 'rgba(43,108,240,.25)');
}

function renderHand() {
  const box = $('#hand');
  const sig = S.you.hand.map((c) => c.id + (c.playable ? '1' : '0')).join(',');
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  const scroll = $('#handScroll').scrollLeft;
  box.innerHTML = '';
  if (S.state === 'lobby') {
    box.innerHTML = '<div class="hand-empty">' + esc(t('handEmpty')) + '</div>';
    return;
  }
  const active = S.you.isTurn && S.state === 'playing';
  S.you.hand.forEach((c, i) => {
    const el = cardEl(c, { cls: active ? (c.playable ? 'ok' : 'no') : '', id: c.id });
    el.style.animationDelay = Math.min(i * 25, 250) + 'ms';
    el.onclick = () => onCardClick(c, el);
    box.appendChild(el);
  });
  $('#handScroll').scrollLeft = scroll;
}

function renderActions() {
  const playing = S.state === 'playing';
  const myTurn = playing && S.you.isTurn;
  // Before the game starts (and after it ends) the draw / emoji / UNO buttons do
  // nothing, yet they sit in a wrapping bar and — on a 320px phone, beside the
  // disabled "waiting for players" start button — wrap to three rows that crush
  // the seats strip above them to 16px. Hide them until a hand is actually live.
  const pre = !playing;
  $('#drawBtn').style.display = pre ? 'none' : '';
  $('#emojiBtn').style.display = pre ? 'none' : '';
  $('#unoBtn').style.display = pre ? 'none' : '';
  $('#drawBtn').disabled = !myTurn;
  const startBtn = $('#startBtn');
  if (S.state !== 'playing' && S.you.canStart) {
    startBtn.style.display = '';
    startBtn.textContent = S.state === 'ended' ? '🔁 ' + t('againBtn') : '▶ ' + t('startBtn');
    startBtn.disabled = false;
  } else if (S.state !== 'playing' && S.hostId === S.you.id && S.players.length < 2) {
    startBtn.style.display = '';
    startBtn.textContent = t('waitPlayers');
    startBtn.disabled = true;
  } else {
    startBtn.style.display = 'none';
  }
  $('#unoBtn').style.opacity = (S.you.hand.length <= 2 ? 1 : .55);
}

function onCardClick(card, el) {
  if (!S.you.isTurn) {
    el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 320);
    toast(t('toastNotYourTurn')); sfx.bad(); return;
  }
  if (!card.playable) {
    el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 320);
    toast(t('toastCantPlay')); sfx.bad(); return;
  }
  if (card.color === 'wild') { askColor(card.id); return; }
  send({ type: 'play', cardId: card.id });
}

function askColor(cardId) {
  pendingWild = cardId;
  const root = $('#modalRoot');
  root.innerHTML =
    '<div class="overlay" id="ov"><div class="modal">' +
    '<h2>' + esc(t('colorTitle')) + '</h2><p>' + esc(t('colorBody')) + '</p>' +
    '<div class="colors">' +
    ['red','yellow','green','blue'].map((c) =>
      '<button class="c-' + c + '" data-c="' + c + '"></button>').join('') +
    '</div>' +
    '<button class="btn ghost" id="cancelColor" style="margin-top:12px">' + esc(t('cancel')) + '</button>' +
    '</div></div>';
  root.querySelectorAll('.colors button').forEach((b) => {
    b.onclick = () => {
      const color = b.dataset.c;
      const cardId2 = pendingWild;   // capture before closeModal clears it
      closeModal();
      if (cardId2) send({ type: 'play', cardId: cardId2, color });
    };
  });
  $('#cancelColor').onclick = closeModal;
  $('#ov').onclick = (e) => { if (e.target.id === 'ov') closeModal(); };
}
function closeModal() { $('#modalRoot').innerHTML = ''; pendingWild = null; }

/** The identity of one chat line, for "have I shown this already?".
 *  `t` alone is not enough — two players can speak in the same millisecond. */
function chatKey(it) { return it ? it.t + ':' + it.id : null; }

/* How long an on-table bubble stays, and how many may be on screen at once.
   Three is the ceiling: a fourth means the table is being covered by chat,
   and at that point the panel is the better place to read it. */
const TS_MS = 4600;
const TS_MAX = 3;

/** Float one chat line or emoji shout over the table, then let it go. */
function showTableSay(it) {
  const box = $('#tableSay');
  if (!box || !it) return;
  while (box.children.length >= TS_MAX) box.removeChild(box.firstChild);

  const el = document.createElement('div');
  el.className = 'ts-item' + (it.kind === 'shout' ? ' shout' : '');
  /* textContent everywhere — a chat message is user input and must never be
     parsed as markup. The name is the only thing that gets a structure. */
  const av = document.createElement('span');
  av.className = 'ts-av';
  av.textContent = it.avatar || '🙂';
  const body = document.createElement('div');
  body.className = 'ts-body';
  const who = document.createElement('div');
  who.className = 'ts-who';
  who.textContent = it.name || '';
  const tx = document.createElement('div');
  tx.className = 'ts-tx';
  tx.textContent = it.text || '';
  body.appendChild(who);
  body.appendChild(tx);
  el.appendChild(av);
  el.appendChild(body);
  box.appendChild(el);

  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, TS_MS);
}

function renderFeed() {
  const body = $('#feedBody');
  const items = [];
  S.log.forEach((l) => items.push({ t: l.t, kind: 'log', text: logText(l) }));
  S.chat.forEach((c) => items.push({ t: c.t, kind: c.kind, ...c }));
  items.sort((a, b) => a.t - b.t);
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  body.innerHTML = items.map((it) => {
    if (it.kind === 'log') return it.text
      ? '<div class="lg"><i>' + clock(it.t) + '</i><span>' + esc(it.text) + '</span></div>' : '';
    if (it.kind === 'shout') return '<div class="bubble shout"><div><div class="who">' + esc(it.name) + '</div><div class="tx">' + esc(it.text) + '</div></div></div>';
    const mine = it.id === S.you.id;
    return '<div class="bubble' + (mine ? ' mine' : '') + '"><div><div class="who">' + esc(it.name) + '</div><div class="tx">' + esc(it.text) + '</div></div></div>';
  }).join('');
  if (atBottom) body.scrollTop = body.scrollHeight;
}
function clock(tm) {
  const d = new Date(tm);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function confetti() {
  const root = document.createElement('div');
  root.className = 'confetti';
  const palette = ['#e63946', '#f0b429', '#1f9d63', '#2b6cf0', '#ff6a4d'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    p.style.cssText =
      'left:' + Math.random() * 100 + '%;background:' + palette[i % palette.length] +
      ';animation-delay:' + (Math.random() * 0.7).toFixed(2) + 's' +
      ';animation-duration:' + (1.5 + Math.random() * 1.3).toFixed(2) + 's';
    root.appendChild(p);
  }
  document.body.appendChild(root);
  setTimeout(() => root.remove(), 3600);
}

/** Her lifetime record as one line, or nothing when there is no record yet. */
function recordHtml() {
  const rec = S && S.you && S.you.record;
  if (!rec || !rec.played) return '';
  return '<p class="recline" style="margin:2px 0 10px">' +
    esc(t('recordLine', { wins: rec.wins, played: rec.played })) + '</p>';
}

function renderOverlay() {
  if (S.state !== 'ended' || !S.winner) { if ($('#winOv')) $('#winOv').remove(); return; }
  if ($('#winOv')) return;
  const w = S.players.find((p) => p.id === S.winner) || { name: '?', avatar: '🏆' };
  const iWon = S.winner === S.you.id;
  confetti();
  const root = $('#modalRoot');
  const div = document.createElement('div');
  div.className = 'overlay';
  div.id = 'winOv';
  div.innerHTML =
    '<div class="modal">' +
    '<div class="big-av">' + w.avatar + '</div>' +
    '<h2>' + (iWon ? esc(t('winSelf')) : esc(t('winOther', { name: w.name }))) + '</h2>' +
    '<p>' + esc(t('winBody', { r: S.round, w: w.wins || 1 })) + '</p>' +
    recordHtml() +
    (S.hostId === S.you.id
      ? '<button class="btn primary" id="againBtn">🔁 ' + esc(t('againBtn')) + '</button>'
      : '<p style="margin:0">' + esc(t('hostNext')) + '</p>') +
    '<button class="btn ghost" id="viewTableBtn" style="margin-top:8px">' + esc(t('viewTable')) + '</button>' +
    '</div>';
  root.appendChild(div);
  if ($('#againBtn')) $('#againBtn').onclick = () => send({ type: 'again' });
  $('#viewTableBtn').onclick = () => div.remove();
}

/* ============================================================ actions */
async function send(payload) {
  try {
    await api('api/action', { ...payload, token: session.token });
  } catch (e) {
    toast(e.message);
    sfx.bad();
  }
}

/**
 * Drawing is the ONLY way to end a turn you cannot play (there is no Pass button
 * any more — it let a player skip without drawing, which is not UNO and can
 * stall the table). Drawing always ends your turn, even if the card you drew
 * would have been playable: you may play it on your NEXT turn. That is why there
 * is no "tap it now" toast any more — there would be nothing to tap.
 */
async function doDraw() {
  try {
    await api('api/action', { type: 'draw', token: session.token });
  } catch (e) {
    toast(e.message);
    sfx.bad();
  }
}

/* ============================================================ wiring */
paintStatic();
loadMyRecord();
$('#createBtn').onclick = doCreate;
$('#joinBtn').onclick = doJoin;
$('#nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doCreate(); });
$('#codeInput').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});
$('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doJoin(); });

$('#drawBtn').onclick = doDraw;
$('#startBtn').onclick = () => send({ type: S.state === 'ended' ? 'again' : 'start' });
$('#unoBtn').onclick = () => { send({ type: 'shout', emoji: 'UNO!! 🔥' }); tone(1046, 0.07, 'square', 0.45); };
$('#emojiBtn').onclick = () => toggleEmojiPop();
const ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4z"/><path d="M15.4 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>';
const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4z"/><path d="M16 9.8l4.4 4.4M20.4 9.8 16 14.2"/></svg>';

$('#soundBtn').onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem('uno.sound', soundOn ? 'on' : 'off');
  $('#soundIcon').innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
  if (soundOn) tone(660, 0.09, 'sine', 0.5);
};
$('#soundIcon').innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;

/* --------------------------------------------------------------- emoji picker */
/**
 * Twenty reactions, chosen by the player.
 *
 * The button used to fire a RANDOM one from a list of eight. That is a toy, not
 * communication: you cannot say what you mean, and a random 😭 when you meant
 * 🎉 is worse than saying nothing. So the button opens a picker instead, and the
 * set is wide enough to actually cover a table — encouragement, dismay, luck,
 * triumph.
 *
 * Same list in both games, deliberately: a player who learns where 👍 is on one
 * table should not have to look again on the other.
 */
const EMOJIS = [
  '😀', '😂', '🤣', '🥳', '😍',
  '😎', '🤔', '😱', '😭', '😡',
  '👍', '👏', '🙏', '💪', '🔥',
  '🎉', '❤️', '💯', '🍀', '⭐',
];

let emojiBuilt = false;

function buildEmojiPop() {
  if (emojiBuilt) return;
  $('#emojiGrid').innerHTML = EMOJIS.map((e) =>
    `<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('');
  $('#emojiGrid').querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      closeEmojiPop();
      send({ type: 'shout', emoji: b.dataset.e });
    };
  });
  emojiBuilt = true;
}

/**
 * Place the popover over the button that opened it.
 *
 * `left` is the CENTRE, not the edge: the stylesheet shifts the box by
 * translateX(-50%) so it grows outwards from that point. Clamping the edge
 * instead put the whole popover off the left of the screen — a real bug, found
 * by measuring rather than by reading the source.
 *
 * The box is `position:fixed`, so it does NOT follow the button: anything that
 * moves the button (a scroll, a resize) has to re-place it.
 */
function placeEmojiPop() {
  const pop = $('#emojiPop');
  const btn = $('#emojiBtn').getBoundingClientRect();
  const w = pop.offsetWidth;
  if (!w) return;
  const cx = btn.left + btn.width / 2;
  pop.style.left = Math.min(Math.max(cx, w / 2 + 12), window.innerWidth - w / 2 - 12) + 'px';
  pop.style.bottom = (window.innerHeight - btn.top + 10) + 'px';
}

function toggleEmojiPop() {
  const pop = $('#emojiPop');
  if (!pop.classList.contains('hidden')) { closeEmojiPop(); return; }
  buildEmojiPop();
  pop.classList.remove('hidden');
  placeEmojiPop();
  $('#emojiBtn').setAttribute('aria-expanded', 'true');
}

function closeEmojiPop() {
  $('#emojiPop').classList.add('hidden');
  $('#emojiBtn').setAttribute('aria-expanded', 'false');
}

// A tap anywhere else dismisses it. Listening on the document rather than on a
// scrim keeps the table live behind the picker — which is the point of a popover.
document.addEventListener('click', (e) => {
  const pop = $('#emojiPop');
  if (pop.classList.contains('hidden')) return;
  if (pop.contains(e.target) || e.target.closest('#emojiBtn')) return;
  closeEmojiPop();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEmojiPop();
});
// Re-place rather than close on a viewport change. Closing was the first
// instinct and it is wrong on a phone: scrolling down collapses the URL bar,
// which fires `resize`, and the picker would vanish mid-choice. It is only two
// style writes, so following the button is cheaper than the surprise.
window.addEventListener('resize', () => {
  if (!$('#emojiPop').classList.contains('hidden')) placeEmojiPop();
});
window.addEventListener('scroll', () => {
  if (!$('#emojiPop').classList.contains('hidden')) placeEmojiPop();
}, { passive: true });

function toggleFeed(force) {
  const f = $('#feed');
  const show = force !== undefined ? force : f.classList.contains('hidden');
  f.classList.toggle('hidden', !show);
  if (show) setTimeout(() => { const b = $('#feedBody'); b.scrollTop = b.scrollHeight; }, 30);
}
$('#feedBtn').onclick = () => toggleFeed();
$('#feedClose').onclick = () => toggleFeed(false);
$('#chatSend').onclick = sendChat;
$('#chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
function sendChat() {
  const inp = $('#chatInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  send({ type: 'chat', text: txt });
}
$('#codeChip').onclick = async () => {
  const url = location.origin + BASE + session.code;
  const msg = t('inviteText', { code: session.code, url });
  try {
    await navigator.clipboard.writeText(msg);
    toast(t('toastCopied'));
  } catch (e) {
    prompt(t('promptCopy'), url);
  }
};
$('#leaveBtn').onclick = () => {
  if (!confirm(t('confirmLeave'))) return;
  send({ type: 'leave' }).finally(() => {
    if (es) es.close();
    session = null; saveSession();
    location.href = BASE;
  });
};

/* ============================================================ boot */
initLobby();
session = loadSession();
if (session && session.token) {
  // Validate the stored seat before showing the table: a room dies with the
  // server process, and an expired token would otherwise leave her staring at
  // an empty table with no explanation.
  fetch(BASE + 'api/state?token=' + encodeURIComponent(session.token))
    .then((r) => { if (!r.ok) throw new Error('bad'); return r.json(); })
    .then((st) => { enterRoom(); applyState(st); })
    .catch(() => { session = null; saveSession(); });
}
if (window.innerWidth >= 1100) toggleFeed(true);
</script>
