<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fa">
<meta name="robots" content="noindex">
<title>Word match · CantoBuddy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232b6cf0'/><rect x='14' y='26' width='32' height='44' rx='7' fill='white' opacity='.95'/><rect x='54' y='26' width='32' height='44' rx='7' fill='white' opacity='.55'/><text x='30' y='57' font-size='24' font-family='Arial' font-weight='bold' fill='%232b6cf0' text-anchor='middle'>?</text><text x='70' y='57' font-size='24' font-family='Arial' font-weight='bold' fill='%232b6cf0' text-anchor='middle'>✓</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --red:#e63946; --green:#1f9d63; --gold:#c9971b; --blue:#2b6cf0;
    --ink:#161922; --muted:#6f7683; --line:#e6e8ef;
    --bg:#f4f5fa; --panel:#ffffff;
    --shadow:0 10px 30px rgba(23,26,35,.08);
  }
  html,body{height:100%}
  body{
    margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(60vw 60vw at 6% -10%, rgba(43,108,240,.12), transparent 62%),
      radial-gradient(50vw 50vw at 100% 0%, rgba(201,151,27,.11), transparent 60%),
      radial-gradient(60vw 60vw at 50% 112%, rgba(31,157,99,.10), transparent 60%);
    background-attachment:fixed;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  input{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------------------------------------------------------- lobby */
  #lobby{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 18px 40px}
  .backlink{
    align-self:flex-start;display:inline-flex;align-items:center;gap:6px;color:var(--muted);
    font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:12px;background:#fff;
    border:1px solid var(--line);box-shadow:0 4px 12px rgba(23,26,35,.05);margin-bottom:auto;
  }
  /* The same three-tile mark the Games hub shows for this game, so the card she
     tapped and the page she landed on look like the same thing. 配對 is
     "matching" — the mechanic, in the language of the game's own name. */
  .brand{display:flex;gap:5px;margin:14px 0;align-items:center}
  .brand i{
    width:40px;height:54px;border-radius:8px;display:grid;place-items:center;
    font-style:normal;font-weight:800;color:#fff;font-size:20px;letter-spacing:-.5px;
    box-shadow:0 8px 18px rgba(0,0,0,.16);
  }
  .brand i:nth-child(1){background:var(--blue);transform:rotate(-9deg)}
  .brand i:nth-child(2){background:#2b2f3a;transform:rotate(-1deg) translateY(-6px)}
  /* A Latin ? sits low in its em box next to two full-height Chinese glyphs, so
     it is nudged up and sized to match their ink rather than their font size. */
  .brand i.q{background:var(--gold);transform:rotate(8deg);font-size:26px;padding-bottom:3px}
  h1{margin:6px 0 6px;font-size:26px;letter-spacing:-.5px;text-align:center}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px;text-align:center;line-height:1.6;max-width:350px}
  .panel{
    width:100%;max-width:380px;background:var(--panel);border-radius:24px;
    padding:20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 7px;letter-spacing:.3px}
  .field{
    width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:#fafbfe;font-size:16px;outline:none;transition:.15s;
  }
  .field:focus{border-color:var(--blue);background:#fff}
  .avatars{display:flex;gap:8px;flex-wrap:wrap}
  .avatars button{
    width:44px;height:44px;border-radius:14px;background:#f6f7fb;border:1.5px solid var(--line);
    font-size:21px;display:grid;place-items:center;transition:.15s;
  }
  .avatars button.on{border-color:var(--blue);background:#eef3ff;transform:scale(1.04)}
  .btn{
    width:100%;padding:14px;border-radius:15px;background:#fff;border:1.5px solid var(--line);
    font-weight:700;font-size:15px;transition:.15s;box-shadow:0 4px 12px rgba(23,26,35,.05);
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{
    background:linear-gradient(135deg,#2b6cf0,#4d88ff);color:#fff;border-color:transparent;
    box-shadow:0 10px 22px rgba(43,108,240,.28);margin-top:18px;
  }
  .btn.primary:disabled{opacity:.45;box-shadow:none}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:#9aa1ae;font-size:12px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .join-row{display:flex;gap:8px}
  .join-row .field{flex:1;text-transform:uppercase;letter-spacing:3px;font-weight:700;text-align:center}
  /* The placeholder is an instruction, not a sample code — undo the code styling
     or "Enter code" itself reads as a code already filled in. */
  .join-row .field::placeholder{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;color:#a7aeba}
  .join-row .btn{width:auto;padding:13px 20px}
  .err{margin:12px 0 0;color:var(--red);font-size:12.5px;min-height:16px;text-align:center}
  .tips{list-style:none;padding:0;margin:22px 0 0;max-width:360px;font-size:12px;color:var(--muted);line-height:1.7}
  .tips li{padding-left:16px;position:relative}
  .tips li::before{content:"•";position:absolute;left:2px;color:var(--blue)}

  /* ----------------------------------------------------------- room */
  #room{min-height:100dvh;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:8px;padding:4px 0 10px;flex-wrap:nowrap}
  .codechip{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    padding:7px 12px;border-radius:13px;box-shadow:0 4px 12px rgba(23,26,35,.05);cursor:pointer;
  }
  .codechip small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.4px;line-height:1.2}
  .codechip b{font-size:16px;letter-spacing:3px;line-height:1.1}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:#c3c8d2;display:inline-block}
  .dot.on{background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.18)}
  .iconbtn{
    width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;font-size:15px;box-shadow:0 4px 12px rgba(23,26,35,.05);
  }

  /* two scoreboards — this is a duel, so the scores are always both on screen */
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 0 8px}
  .seat{
    display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
    border-radius:15px;padding:8px 10px;box-shadow:0 4px 12px rgba(23,26,35,.05);
    position:relative;transition:.18s;min-width:0;
  }
  .seat .av{font-size:21px;line-height:1;flex:0 0 auto}
  .seat .who{min-width:0;display:flex;flex-direction:column;gap:1px}
  .seat .nm{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seat .you{font-size:9px;font-weight:800;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
  .seat .sc{font-size:21px;font-weight:900;margin-left:auto;letter-spacing:-.5px;flex:0 0 auto;line-height:1}
  .seat.lead{border-color:var(--blue);background:#f4f8ff}
  .seat.off{opacity:.5}
  .seat.empty{background:#fafbfe;border-style:dashed;box-shadow:none;color:var(--muted)}
  .seat.empty .av{opacity:.45;font-size:17px}
  .seat.empty .nm{font-weight:600;color:var(--muted)}
  /* A badge that hangs off the top edge: it has to be readable without stealing
     room from the score, which is the number a player is actually watching. */
  .seat .badge{
    position:absolute;top:-7px;right:8px;font-size:8.5px;font-weight:900;padding:2px 6px;
    border-radius:7px;background:#fdeff0;color:var(--red);border:1px solid #f6c8cd;
    letter-spacing:.02em;white-space:nowrap;
  }
  .seat .badge.win{background:#fff6e3;color:#8a6410;border-color:#f0dcae}

  /* The round counter lives here, not in the topbar. The topbar's chip has to be
     hidden below 560px to keep the code and the icons on one line, and for THIS
     game the round number is not decoration — "eight rounds" is the shape of the
     match. Under the scoreboards it is always on screen, in every language. */
  .roundline{
    text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);
    letter-spacing:.07em;text-transform:uppercase;margin:-2px 0 9px;min-height:14px;
  }

  .stage{flex:1;display:flex;flex-direction:column;padding-bottom:6px}
  /* The question gets a real flashcard height and the whole group is centred in
     what is left. Two earlier attempts were worse: centring a short card left
     ~250px of dead air above it, and letting the card absorb ALL the slack made
     it 600px tall with the word lost in the middle. A card with a fixed
     comfortable height is the one that reads as designed. */
  .playview{flex:1;display:flex;flex-direction:column;justify-content:center;gap:11px}
  /* With one child and a column, an auto margin centres it. */
  .waitcard{margin:auto 0}

  /* ---- the question ---- */
  .qcard{
    flex:0 0 auto;min-height:clamp(210px,32vh,310px);display:flex;flex-direction:column;justify-content:center;
    position:relative;background:#fff;border-radius:22px;padding:16px 16px 30px;
    box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);text-align:center;
  }
  .qemoji{font-size:30px;line-height:1;margin-bottom:2px}
  .qword{font-size:clamp(32px,10.5vw,48px);font-weight:900;letter-spacing:1px;line-height:1.18;word-break:break-word}
  .qjyut{color:var(--muted);font-size:13.5px;margin-top:5px;letter-spacing:.4px;font-weight:600}
  .qlevel{
    display:inline-block;align-self:center;font-size:9.5px;font-weight:800;color:var(--muted);
    background:#f1f4fa;padding:2px 8px;border-radius:7px;margin-bottom:8px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  /* Pinned to the card's own bottom edge, so it reads as a time limit on the
     whole card rather than as a decoration under the word. */
  .track{position:absolute;left:16px;right:16px;bottom:15px;height:5px;border-radius:99px;background:#eef1f6;overflow:hidden}
  .track i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#2b6cf0,#5b93ff);transition:width .12s linear}
  /* Last five seconds turn red — the deadline should be felt, not read. */
  .track.warn i{background:linear-gradient(90deg,#e63946,#ff8072)}

  /* ---- the four answers ---- */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .opt{
    display:flex;align-items:center;gap:8px;min-height:64px;padding:11px 11px;border-radius:15px;
    background:#fff;border:1.5px solid var(--line);text-align:left;font-size:13.5px;font-weight:650;
    line-height:1.32;box-shadow:0 4px 12px rgba(23,26,35,.05);transition:.14s;
    word-break:break-word;overflow-wrap:anywhere;
  }
  .opt .k{
    flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:#f1f4fa;color:var(--muted);
    font-size:10.5px;font-weight:900;display:grid;place-items:center;transition:.14s;
  }
  .opt:active{transform:scale(.98)}
  .opt:disabled{cursor:default}
  .opt.picked{border-color:var(--blue);background:#f4f8ff}
  .opt.correct{border-color:var(--green);background:#effaf4;color:#0d6440;box-shadow:0 0 0 3px rgba(31,157,99,.13)}
  .opt.correct .k{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:#fdeff0;color:#96202a}
  .opt.wrong .k{background:var(--red);color:#fff}
  .opt.faded{opacity:.5}
  .opt .mark{margin-left:auto;font-size:14px;font-weight:900;flex:0 0 auto}

  /* ---- verdict, between the question and the answers ---- */
  .verdict{
    display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;font-weight:800;
    padding:10px 13px;border-radius:13px;background:#fff;border:1.5px dashed var(--line);
    color:var(--muted);text-align:center;line-height:1.35;
  }
  .verdict.good{border-color:rgba(31,157,99,.45);color:var(--green);background:#effaf4;border-style:solid}
  .verdict.bad{border-color:rgba(230,57,70,.3);color:var(--red);background:#fdeff0;border-style:solid}
  .verdict.mid{border-color:rgba(201,151,27,.4);color:#8a6410;background:#fffaf0;border-style:solid}

  /* ---- the lobby, inside the room ---- */
  .waitcard{
    background:#fff;border-radius:22px;padding:24px 20px;text-align:center;
    box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
  }
  .waitcard .big{font-size:42px;line-height:1;margin-bottom:6px}
  .waitcard h2{margin:0 0 6px;font-size:19px;letter-spacing:-.3px}
  .waitcard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
  .waitcard .btn.primary{margin-top:16px}
  .waitcard .waiting{margin-top:16px;font-size:12.5px;color:var(--muted);font-weight:600}

  /* ---- emoji picker ---- */
  /* A popover, not a modal: the round stays live behind it, because a reaction is
     an aside — you glance, you pick, you carry on. `left`/`bottom` are set in JS
     from the button's own rect and clamped to the viewport. */
  .emoji-pop{
    position:fixed;z-index:60;width:min(292px,calc(100vw - 24px));
    background:rgba(255,255,255,.98);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 44px rgba(23,26,35,.22);
    padding:10px 10px 8px;transform:translateX(-50%);
    animation:emojiPop .16s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes emojiPop{from{opacity:0;margin-bottom:-8px}to{opacity:1;margin-bottom:0}}
  .emoji-pop-head{
    font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;
  }
  /* Five across at 292px is a ~52px target — above the 44px minimum for a thumb,
     and four rows of twenty keeps the whole set on screen without scrolling. */
  .emoji-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .emoji-grid button{
    aspect-ratio:1;border:none;background:none;border-radius:12px;padding:0;
    font-size:23px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:transform .1s,background .1s;-webkit-tap-highlight-color:transparent;
  }
  .emoji-grid button:active{transform:scale(.85);background:#eef1f8}
  @media(hover:hover){.emoji-grid button:hover{background:#eef1f8}}

  /* ---- feed ---- */
  .feed{
    position:fixed;right:14px;bottom:14px;width:290px;max-height:52vh;background:rgba(255,255,255,.97);
    backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 18px 44px rgba(23,26,35,.18);
    border:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden;
  }
  .feed-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
  .feed-body{flex:1;overflow-y:auto;padding:8px 12px;font-size:12.5px;line-height:1.75}
  .feed-body .lg{color:#4b5160;display:flex;gap:6px;margin:3px 0}
  .feed-body .lg i{font-style:normal;opacity:.45;flex:0 0 auto;font-size:10.5px;padding-top:2px}
  .bubble{margin:6px 0;display:flex;gap:6px}
  .bubble .tx{background:#f1f3f9;border-radius:12px;padding:6px 10px;max-width:200px;word-break:break-word}
  .bubble.mine .tx{background:#eef3ff}
  .bubble .who{font-size:10.5px;color:var(--muted);margin-bottom:2px}
  .shout .tx{background:linear-gradient(135deg,#fff3d6,#ffe6b8);font-weight:800;color:#a56a00}
  .feed-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .feed-foot input{flex:1;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13px;outline:none;background:#fafbfe}
  .feed-foot button{background:var(--blue);color:#fff;border-radius:11px;padding:0 14px;font-weight:700;font-size:13px}

  /* ---- overlay + toast ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,23,30,.5);backdrop-filter:blur(6px);z-index:60;
    display:grid;place-items:center;padding:20px;animation:fade .2s;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;border-radius:24px;padding:24px;width:100%;max-width:340px;text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.25);animation:up .25s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes up{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 6px;font-size:20px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}
  .big-av{font-size:54px;line-height:1;margin-bottom:4px}
  .tally{display:flex;justify-content:center;gap:10px;margin:0 0 16px}
  .tally div{flex:1;background:#f6f8fc;border-radius:14px;padding:10px 6px}
  .tally b{display:block;font-size:22px;font-weight:900;line-height:1.1}
  .tally span{font-size:10.5px;color:var(--muted);font-weight:700}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
  .confetti i{position:absolute;top:-16px;width:8px;height:15px;border-radius:2px;animation:fall linear forwards;opacity:.95}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.85}}
  .toast{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:99;
    pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(min-width:900px){
    #room{max-width:680px}
    .opt{min-height:70px;font-size:14.5px}
  }
  @media(min-width:1100px){
    #room{margin-right:326px}
    .feed{top:10px;bottom:auto;right:12px;height:calc(100dvh - 20px);max-height:none}
  }
  @media(max-width:899px){
    .feed{width:calc(100vw - 24px);right:12px;bottom:12px;max-height:46vh}
  }
  @media(max-width:560px){
    #room{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
    .status span:last-child{display:none}
    .opt{font-size:13px;min-height:60px;padding:10px}
    .seat{padding:7px 9px;gap:6px}
    .seat .sc{font-size:19px}
  }
  @media(max-height:640px){
    .qcard{padding:12px 14px 26px}
    .qword{font-size:clamp(28px,9vw,38px)}
    .qemoji{font-size:24px}
    .opt{min-height:54px}
    .seats{padding-bottom:8px}
  }
  /* At 320px the chip's label wraps to two lines and pushes the code down. The
     code is the thing that matters, and the chip still shares on tap. */
  @media(max-width:359px){
    .codechip small{display:none}
    .codechip{padding:8px 10px}
  }
</style>
</head>
<body>

<!-- ============================ LOBBY ============================ -->
<main id="lobby">
  <a class="backlink" href="/?view=games" id="backLink">← <span data-k="backToApp"></span></a>
  <!-- The same mark the Games hub shows for this game: 配對 — "matching" — plus
       the ? that says what you are asked to do. -->
  <div class="brand"><i>配</i><i>對</i><i class="q">?</i></div>
  <h1 data-k="title"></h1>
  <p class="sub" data-k="sub"></p>

  <div class="panel">
    <label data-k="nameLabel"></label>
    <input id="nameInput" class="field" maxlength="12" autocomplete="off">

    <label style="margin-top:16px" data-k="avatarLabel"></label>
    <div id="avatarPicker" class="avatars"></div>

    <button id="createBtn" class="btn primary" data-k="createBtn"></button>

    <div class="divider"><span data-k="divider"></span></div>
    <div class="join-row">
      <input id="codeInput" class="field" maxlength="4" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn" class="btn" data-k="joinBtn"></button>
    </div>
    <p id="lobbyErr" class="err"></p>
  </div>

  <ul class="tips">
    <li data-k="tip1"></li>
    <li data-k="tip2"></li>
  </ul>
</main>

<!-- ============================ ROOM ============================ -->
<section id="room" class="hidden">
  <div class="topbar">
    <div class="codechip" id="codeChip">
      <div>
        <small data-k="codeChipLabel"></small>
        <b id="codeText">----</b>
      </div>
      <span style="font-size:15px">🔗</span>
    </div>
    <div class="spacer"></div>    <div class="status"><span class="dot" id="liveDot"></span><span id="liveText"></span></div>
    <button class="iconbtn" id="soundBtn"><span id="soundIcon"></span></button>

const LANG = (function () {
  const saved = (localStorage.getItem('cb_lang') || '').toLowerCase();
  if (STR[saved]) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.indexOf('zh') === 0) return 'zh';
  if (nav.indexOf('id') === 0) return 'id';
  if (nav.indexOf('tl') === 0 || nav.indexOf('fil') === 0) return 'fil';
  return 'en';
})();

function t(key, vars) {
  const d = STR[LANG] || STR.en;
  let s = d[key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  if (vars) {
    for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  }
  return s;
}

/**
 * The invite link is /games/wordmatch/ABCD. `BASE` must therefore end at
 * /games/wordmatch/ whether or not a code is in the path — and it must strip the
 * SEGMENT, not a fixed number of characters (a fixed slice once produced
 * `/games/wordmatch` and sent every API call to `/games/wordmatchapi/…`).
 */
const BASE = (function () {
  let p = location.pathname;
  if (!p.endsWith('/')) {
    const seg = p.split('/').pop();
    p = /^[A-Z0-9]{4}$/.test(seg) ? p.slice(0, -seg.length) : p + '/';
  }
  return p;
})();

const SESSION_KEY = 'wm.session';

/** Which round `pickedId` belongs to, so a new round clears it. */
let pickedRound = 0;
/** serverNow - Date.now(), so the countdown survives a skewed phone clock. */
let clockSkew = 0;
/**
 * How long a round lasts, measured from the server's own first frame for the
 * round (deadline - serverNow) rather than hardcoded here. A constant would
 * silently disagree with ASK_MS in wordmatch.js the moment either changes, and
 * the bar would then either stall short of empty or sit at zero while the round
 * was still live.
 */
let roundSpan = 0;
let timerHandle = null;

   a missing-glyph placeholder the way an emoji can. */

const ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2l4.3 3.5V6L7.2 9.5H4z"/><path d="M16 9.8l4.4 4.4M20.4 9.8 16 14.2"/></svg>';

/* --------------------------------------------------------------- utils */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function beep(freq, dur = 0.08, type = 'sine', gain = 0.05) {
  if (!sound) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!beep.ctx) beep.ctx = new Ctx();
    const ctx = beep.ctx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = gain;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur + 0.02);
  } catch (e) { /* audio is a nicety, never a failure */ }
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast.tm);
  toast.tm = setTimeout(() => el.classList.remove('on'), 2200);
}

function errorText(code) {
  const key = 'err' + String(code || '').charAt(0).toUpperCase() + String(code || '').slice(1);
  const d = STR[LANG] || STR.en;
  return d[key] || STR.en[key] || t('errUnknown');
}

function renderAvatars() {
  const box = $('#avatarPicker');
  box.innerHTML = AVATARS.map((a) =>
    `<button type="button" data-a="${a}" class="${a === myAvatar ? 'on' : ''}">${a}</button>`).join('');
  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { myAvatar = b.dataset.a; renderAvatars(); };
  });
}

function paintStatic() {
  document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = t(el.dataset.k); });
  document.title = t('title') + ' · CantoBuddy';
  document.documentElement.lang = LANG === 'fil' ? 'tl' : LANG;
  $('#nameInput').placeholder = LANG === 'fil' ? 'hal. Maria / Nanay' : LANG === 'zh' ? '例如：阿明' : 'e.g. Maria / Mum';
  // NOT a sample code. The field is 4 chars, bold, uppercase and widely spaced,
  // so "ABCD" reads as a code already filled in — a player could tap Join
  // without typing and be told the room does not exist.
  $('#codeInput').placeholder = t('codePlaceholder');
  $('#chatInput').placeholder = t('chatPlaceholder');
  $('#codeChip').title = t('codeChipLabel');
  // All three topbar controls are icon-only, so each needs a tooltip and an
  // accessible name — set here because paintStatic() is what runs on a language
  // switch.
  for (const [sel, key] of [['#soundBtn', 'soundTitle'], ['#feedBtn', 'feedTitle'], ['#leaveBtn', 'leaveTitle']]) {
    $(sel).title = t(key);
    $(sel).setAttribute('aria-label', t(key));
  }
  renderSoundIcon();
}

function myName() {
  return ($('#nameInput').value || '').trim().slice(0, 12);
}

function saveSession() {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ code, token, name: S ? S.you.name : '', avatar: myAvatar }));
}

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
}

async function post(path, body) {
  // BASE already ends in '/', so the path must not start with one — a double
  // slash is not always normalised and the request 404s in a way that looks like
  // a missing route.
  const r = await fetch(BASE + String(path).replace(/^\//, ''), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let data = {};
  try { data = await r.json(); } catch (e) { /* empty */ }
  return { status: r.status, body: data };
}

function showLobbyError(msg) {
  $('#lobbyErr').textContent = msg || '';
}

async function createRoom() {
  const name = myName();
  if (!name) { showLobbyError(t('errNameRequired')); $('#nameInput').focus(); return; }
  const r = await post('/api/create', { name, avatar: myAvatar, lang: LANG });
  if (r.status !== 200) { showLobbyError(errorText(r.body.error)); return; }
  enterRoom(r.body);
}

async function joinRoom() {
  const name = myName();
  const c = ($('#codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (!name) { showLobbyError(t('errNameRequired')); $('#nameInput').focus(); return; }
  if (c.length !== 4) { showLobbyError(errorText('roomNotFound')); return; }
  const r = await post('/api/join', { code: c, name, avatar: myAvatar, lang: LANG });
  if (r.status !== 200) { showLobbyError(errorText(r.body.error)); return; }
  enterRoom(r.body);
}

function enterRoom(res) {
  token = res.token;
  code = res.code;
  myAvatar = res.avatar || myAvatar;
  showLobbyError('');
  $('#lobby').classList.add('hidden');
  $('#room').classList.remove('hidden');
  $('#codeText').textContent = code;
  saveSession();
  connect();
}

/* --------------------------------------------------------------- stream */
function connect() {
  if (es) { try { es.close(); } catch (e) { /* gone */ } }
  es = new EventSource(BASE + 'api/events?token=' + encodeURIComponent(token));
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }
    if (data.fatal === 'expired') {
      localStorage.removeItem(SESSION_KEY);
      toast(errorText('sessionExpired'));
      setTimeout(() => { location.href = BASE; }, 1200);
      return;
    }
    setLive(true);
    applyState(data);
  };
}

function setLive(ok) {
  $('#liveDot').classList.toggle('on', !!ok);
  $('#liveText').textContent = ok ? t('liveOnline') : t('liveReconnecting');
}

function applyState(st) {
  const prev = S;
  S = st;
  clockSkew = (st.serverNow || Date.now()) - Date.now();

  // A new round starts with a clean slate; the optimistic pick belongs to the
  // round it was made in, so it must not survive into the next one.
  const newRound = st.round !== pickedRound;
  if (newRound) { pickedRound = st.round; pickedId = null; }
  if (st.state !== 'asking') pickedId = null;

  // The first frame of a round arrives immediately after the deal, so
  // deadline - serverNow is the round's full length. Taken from the server, not
  // assumed: the bar then matches ASK_MS even if that constant changes.
  if (newRound && st.state === 'asking' && st.roundDeadline) {
    const span = st.roundDeadline - st.serverNow;
    if (span > 0) roundSpan = span;
  }

  renderAll();
  startTimer();

  if (prev) {
    if (prev.round !== st.round) beep(520, 0.07, 'triangle');
    if (st.state === 'reveal' && prev.state === 'asking') {
      const r = st.result;
      if (r && r.winnerId === st.you.id) beep(880, 0.22, 'sine', 0.06);
      else if (r && r.reason === 'bothWrong') beep(240, 0.16, 'square', 0.04);
      else beep(320, 0.12, 'sine', 0.04);
    }
  }
}

/* -------------------------------------------------------------- render */
function renderAll() {
  if (!S) return;
  renderSeats();
  renderStage();
  renderFeed();
  renderOverlay();
  $('#roundLine').textContent = S.round ? t('roundOf', { n: S.round, total: S.totalRounds }) : '';
}

function renderSeats() {
  const box = $('#seats');
  const cards = S.players.map((p) => {
    const mine = p.id === S.you.id;
    const lead = p.score > 0 && S.players.every((q) => q.id === p.id || q.score < p.score);
    // The badge says whether that player is out of the round — that is public,
    // because it is the race. WHAT they answered is not, and never leaves the
    // server until the reveal.
    let badge = '';
    if (p.locked && S.state === 'asking') badge = `<span class="badge">${esc(t('lockedBadge'))}</span>`;
    else if (S.state === 'ended' && S.winner === p.id) badge = `<span class="badge win">🏆</span>`;
    return `<div class="seat ${lead ? 'lead' : ''} ${p.connected ? '' : 'off'}">
      ${badge}
      <span class="av">${esc(p.avatar)}</span>
      <span class="who">
        <span class="nm">${esc(p.name)}</span>
        ${mine ? `<span class="you">${esc(t('youLabel'))}</span>` : ''}
      </span>
      <span class="sc">${p.score}</span>
    </div>`;
  });
  // A lone player in the lobby otherwise leaves half the board as bare
  // background, which reads as a seat that failed to render. Show the empty
  // seat instead: it is a duel, and the second chair is visibly waiting.
  if (S.players.length < 2) {
    cards.push(`<div class="seat empty">
      <span class="av">＋</span>
      <span class="who"><span class="nm">${esc(t('seatEmpty'))}</span></span>
    </div>`);
  }
  box.innerHTML = cards.join('');
}

function renderStage() {
  const playing = S.state === 'asking' || S.state === 'reveal';
  $('#waitCard').classList.toggle('hidden', playing);
  $('#playView').classList.toggle('hidden', !playing);

  if (!playing) { renderWait(); return; }

  const q = S.prompt || {};
  $('#qEmoji').textContent = q.emoji || '';
  $('#qWord').textContent = q.cantonese || '';
  $('#qJyut').textContent = q.jyutping || '';
  $('#qLevel').textContent = q.level ? 'Lv ' + q.level : '';
  $('#qLevel').classList.toggle('hidden', !q.level);

  renderVerdict();
  renderOptions();
}

function renderWait() {
  $('#waitTitle').textContent = t('waitTitle');
  $('#waitSub').textContent = t('waitSub');
  // The start button is the host's. Everyone else is told what they are waiting
  // for, so an idle screen never looks like a broken one.
  const btn = $('#startBtn');
  btn.classList.toggle('hidden', !S.you.canStart);
  btn.disabled = !S.you.canStart;
  btn.textContent = S.state === 'ended' ? t('againBtn') : t('startBtn');
  // "Waiting for the host" is only true for someone who is NOT the host. The
  // host alone in her own room was being told to wait for herself.
  const waitingOnHost = !S.you.isHost && !S.you.canStart;
  $('#waitingLine').textContent = waitingOnHost ? t('waitHost') : '';
  $('#waitingLine').classList.toggle('hidden', !waitingOnHost);
}

function renderVerdict() {
  const box = $('#verdict');
  if (S.state !== 'reveal' || !S.result) { box.classList.add('hidden'); return; }
  const r = S.result;
  box.classList.remove('hidden');
  box.className = 'verdict';
  if (r.reason === 'correct' && r.winnerId === S.you.id) {
    box.classList.add('good');
    box.textContent = '✓ ' + t('verdictYou');
  } else if (r.reason === 'correct') {
    box.classList.add('mid');
    box.textContent = t('verdictCorrect', { name: r.winnerName });
  } else if (r.reason === 'bothWrong') {
    box.classList.add('bad');
    box.textContent = t('verdictBothWrong');
  } else {
    box.classList.add('mid');
    box.textContent = t('verdictTimeout');
  }
}

const OPTION_KEYS = ['A', 'B', 'C', 'D'];

function renderOptions() {
  const box = $('#opts');
  const revealing = S.state === 'reveal' && S.result;
  const correctId = revealing ? S.result.correctId : null;
  const mine = S.you.answeredId;
  const locked = S.you.locked && S.state === 'asking';
  // `pickedId` counts as answered: the tap goes dead at once, before the server
  // replies, or a second tap in that window comes back "alreadyAnswered".
  const done = revealing || locked || mine !== null || pickedId !== null;

  box.innerHTML = (S.options || []).map((o, i) => {
    const cls = [];
    let mark = '';
    if (revealing) {
      if (o.id === correctId) { cls.push('correct'); mark = '✓'; }
      else if (o.id === mine) { cls.push('wrong'); mark = '✗'; }
      else cls.push('faded');
    } else if (o.id === pickedId) {
      cls.push('picked');
    }
    return `<button class="opt ${cls.join(' ')}" data-id="${o.id}" ${done ? 'disabled' : ''}>
      <span class="k">${OPTION_KEYS[i] || i + 1}</span>
      <span class="tx">${esc(o.label)}</span>
      ${mark ? `<span class="mark">${mark}</span>` : ''}
    </button>`;
  }).join('');

  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => answer(Number(b.dataset.id));
  });

  const note = $('#lockedNote');
  const showNote = locked && !revealing;
  note.classList.toggle('hidden', !showNote);
  if (showNote) note.textContent = t('lockedNote');
}

/**
 * Answer the round.
 *
 * The buttons go dead immediately, before the round-trip: this is a RACE, and a
 * button that still looks live after you tapped it invites a second tap that
 * comes back "alreadyAnswered". The broadcast that follows re-renders the truth.
 */
async function answer(id) {
  if (!S || S.state !== 'asking' || S.you.locked || S.you.answeredId !== null) return;
  pickedId = id;
  renderOptions();
  const r = await post('/api/action', { token, type: 'answer', vocabId: id });
  if (r.status !== 200) {
    pickedId = null;
    renderOptions();
    toast(errorText(r.body.error));
  }
}

/* --------------------------------------------------------------- timer */
/**
 * The per-round countdown.
 *
 * Driven from `roundDeadline` minus a skewed clock, not from a local 20-second
 * countdown started when the frame arrived: a phone whose clock is four minutes
 * off would otherwise show a bar that never matches the server's deadline, and
 * the round would end while the bar still had width.
 */
function startTimer() {
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  const track = $('#track');
  if (!S || S.state !== 'asking' || !S.roundDeadline) {
    // Hidden, not removed: the bar keeps its height, so the card does not jump
    // when the round ends and the reveal banner appears underneath it.
    if (track) { track.classList.remove('warn'); track.style.visibility = 'hidden'; }
    return;
  }
  track.style.visibility = 'visible';
  const tick = () => {
    const left = S.roundDeadline - (Date.now() + clockSkew);
    const total = roundSpan || 20000;
    const pct = Math.max(0, Math.min(1, left / total));
    const bar = $('#timerBar');
    if (bar) bar.style.width = (pct * 100) + '%';
    if (track) track.classList.toggle('warn', left <= 5000);
    if (left <= 0 && timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  };
  tick();
  timerHandle = setInterval(tick, 120);
}

/* ---------------------------------------------------------------- feed */
function logText(ev) {
  switch (ev.k) {
    case 'roomCreated': return t('logRoom', { code: ev.code });
    case 'join': return t('logJoin', { name: ev.name });
    case 'leave': return t('logLeave', { name: ev.name });
    case 'start': return t('logStart');
    case 'roundStart': return t('logRound', { n: ev.round, word: ev.word });
    case 'wrong': return t('logWrong', { name: ev.name });
    case 'roundEnd': return t('logRoundEnd', { n: ev.round });
    case 'ended': return t('logEnded');
    case 'backToLobby': return t('logLobby');
    default: return '';
  }
}

function renderFeed() {
  const body = $('#feedBody');
  if (!body || !S) return;
  const items = [];
  (S.log || []).forEach((l) => {
    const text = logText(l);
    if (text) items.push({ t: l.t, kind: 'log', text });
  });
  (S.chat || []).forEach((c) => items.push({ t: c.t, kind: c.kind, name: c.name, avatar: c.avatar, text: c.text, id: c.id }));
  items.sort((a, b) => a.t - b.t);

  body.innerHTML = items.map((it) => {
    if (it.kind === 'log') return `<div class="lg"><i>·</i><span>${esc(it.text)}</span></div>`;
    const mine = it.id === S.you.id ? ' mine' : '';
    const shout = it.kind === 'shout' ? ' shout' : '';
    return `<div class="bubble${mine}${shout}">
      <div>
        <div class="who">${esc(it.avatar || '')} ${esc(it.name || '')}</div>
        <div class="tx">${esc(it.text)}</div>
      </div>
    </div>`;
  }).join('');
  body.scrollTop = body.scrollHeight;
}

/**
 * Send a chat line. Cleared the moment it is sent, not when the server confirms
 * — the input must never sit there holding words the player already let go of.
 */
async function sendChat() {
  const inp = $('#chatInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  const r = await post('/api/action', { token, type: 'chat', text: txt });
  if (r.status !== 200) { toast(errorText(r.body.error)); inp.value = txt; }
}

/* --------------------------------------------------------------- emoji picker */
/**
 * Twenty reactions, chosen by the player.
 *
 * The button opens a PICKER rather than firing a random emoji: "surprise me" is
 * a toy, and a random 😭 when you meant 🎉 is worse than saying nothing.
 *
 * Same list in all three games, deliberately: a player who learns where 👍 is on
 * one table should not have to look again on the next.
 */
const EMOJIS = [
  '😀', '😂', '🤣', '🥳', '😍',
  '😎', '🤔', '😱', '😭', '😡',
  '👍', '👏', '🙏', '💪', '🔥',
  '🎉', '❤️', '💯', '🍀', '⭐',
];

let emojiBuilt = false;

function buildEmojiPop() {
  if (emojiBuilt) return;
  $('#emojiGrid').innerHTML = EMOJIS.map((e) =>
    `<button type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('');
  $('#emojiGrid').querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      closeEmojiPop();
      post('/api/action', { token, type: 'shout', emoji: b.dataset.e }).catch(() => {});
    };
  });
  emojiBuilt = true;
}

/**
 * Place the popover over the button that opened it.
 *
 * `left` is the CENTRE, not the edge: the stylesheet shifts the box by
 * translateX(-50%) so it grows outwards from that point. Clamping the edge
 * instead put the whole popover 134px off the left of a 390px phone — a real
 * bug, found by measuring rather than by looking at the source.
 *
 * The box is `position:fixed`, so it does NOT follow the button: anything that
 * moves the button (a scroll, a resize) has to re-place it.
 */
function placeEmojiPop() {
  const pop = $('#emojiPop');
  const btn = $('#emojiBtn').getBoundingClientRect();
  const w = pop.offsetWidth;
  if (!w) return;
  const cx = btn.left + btn.width / 2;
  pop.style.left = Math.min(Math.max(cx, w / 2 + 12), window.innerWidth - w / 2 - 12) + 'px';
  pop.style.bottom = (window.innerHeight - btn.top + 10) + 'px';
}

function toggleEmojiPop() {
  const pop = $('#emojiPop');
  if (!pop.classList.contains('hidden')) { closeEmojiPop(); return; }
  buildEmojiPop();
  pop.classList.remove('hidden');
  placeEmojiPop();
  $('#emojiBtn').setAttribute('aria-expanded', 'true');
}

function closeEmojiPop() {
  $('#emojiPop').classList.add('hidden');
  $('#emojiBtn').setAttribute('aria-expanded', 'false');
}

// A tap anywhere else dismisses it. Listening on the document rather than on a
// scrim keeps the table live behind the picker — which is the point of a popover.
document.addEventListener('click', (e) => {
  const pop = $('#emojiPop');
  if (pop.classList.contains('hidden')) return;
  if (pop.contains(e.target) || e.target.closest('#emojiBtn')) return;
  closeEmojiPop();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEmojiPop();
});
// Re-place rather than close on a viewport change. Closing was the first
// instinct and it is wrong on a phone: scrolling down collapses the URL bar,
// which fires `resize`, and the picker would vanish mid-choice.
window.addEventListener('resize', () => {
  if (!$('#emojiPop').classList.contains('hidden')) placeEmojiPop();
});
window.addEventListener('scroll', () => {
  if (!$('#emojiPop').classList.contains('hidden')) placeEmojiPop();
}, { passive: true });

/* --------------------------------------------------------------- actions */
async function startGame() {
  const r = await post('/api/action', { token, type: 'start' });
  if (r.status !== 200) { toast(errorText(r.body.error)); return; }
  pickedId = null;
}

async function leave() {
  try { await post('/api/action', { token, type: 'leave' }); } catch (e) { /* gone */ }
  localStorage.removeItem(SESSION_KEY);
  if (es) { try { es.close(); } catch (e) { /* gone */ } }
  location.href = '/?view=games';
}

/* ------------------------------------------------------------- overlay */
function confetti() {
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#e63946', '#f0b429', '#1f9d63', '#2b6cf0', '#c9971b'];
  for (let i = 0; i < 44; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3600);
}

function renderOverlay() {
  const root = $('#modalRoot');
  if (S.state !== 'ended' || !S.result) {
    if (root.dataset.kind === 'end') { root.innerHTML = ''; delete root.dataset.kind; }
    return;
  }
  if (root.dataset.kind === 'end') return; // already shown for this game
  const r = S.result;
  root.dataset.kind = 'end';

  // "Not enough words" is a real end state — the pool was too small to build a
  // round — and it must not look like a win for whoever happened to be ahead.
  if (r.reason === 'notEnoughWords') {
    root.innerHTML = `
      <div class="overlay">
        <div class="modal">
          <div class="big-av">📚</div>
          <h2>${esc(t('errUnknown'))}</h2>
          <p>${esc(t('waitSub'))}</p>
          <button class="btn" id="hubBtn">${esc(t('backToHub'))}</button>
        </div>
      </div>`;
    document.getElementById('hubBtn').onclick = () => { location.href = '/?view=games'; };
    return;
  }

  const iWon = r.winnerId === S.you.id;
  const tie = !!r.tie;
  const title = tie ? t('tieTitle') : (iWon ? t('winTitle') : t('loseTitle', { name: r.winnerName || '' }));
  const sub = tie ? t('tieSub') : (iWon ? t('winSub') : t('loseSub'));
  const tally = (r.scores || S.players.map((p) => ({ id: p.id, name: p.name, score: p.score })))
    .map((p) => `<div><b>${p.score}</b><span>${esc(p.name)}</span></div>`).join('');

  root.innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="big-av">${tie ? '🤝' : (iWon ? '🏆' : '🧠')}</div>
        <h2>${esc(title)}</h2>
        <p>${esc(sub)}</p>
        <div class="tally">${tally}</div>
        ${S.you.canStart ? `<button class="btn primary" id="againBtn">${esc(t('againBtn'))}</button>` : ''}
        <button class="btn" id="hubBtn" style="margin-top:8px">${esc(t('backToHub'))}</button>
      </div>
    </div>`;
  const again = document.getElementById('againBtn');
  if (again) again.onclick = () => { $('#modalRoot').innerHTML = ''; delete $('#modalRoot').dataset.kind; startGame(); };
  document.getElementById('hubBtn').onclick = () => { location.href = '/?view=games'; };
  if (iWon) confetti();
}

/* ----------------------------------------------------------------- boot */
function initLobby() {
  paintStatic();
  renderAvatars();
  const sess = loadSession();
  if (sess && sess.name) $('#nameInput').value = sess.name;
  if (sess && sess.avatar) { myAvatar = sess.avatar; renderAvatars(); }

  // A share link is /games/wordmatch/ABCD — pre-fill the code.
  const m = location.pathname.match(/\/([A-Z0-9]{4})\/?$/);
  if (m) $('#codeInput').value = m[1];

  $('#createBtn').onclick = createRoom;
  $('#joinBtn').onclick = joinRoom;
  $('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });
  $('#nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') createRoom(); });

  $('#startBtn').onclick = startGame;
  $('#leaveBtn').onclick = leave;
  $('#soundBtn').onclick = () => {
    sound = !sound;
    localStorage.setItem(SOUND_KEY, sound ? 'on' : 'off');
    renderSoundIcon();
  };
  $('#feedBtn').onclick = () => {
    $('#feed').classList.toggle('hidden');
    // Opening the panel should land on the newest line, not leave the player
    // scrolling to it — there is real content in here now, not just a log.
    const b = $('#feedBody');
    if (!$('#feed').classList.contains('hidden')) setTimeout(() => { b.scrollTop = b.scrollHeight; }, 30);
  };
  $('#feedClose').onclick = () => $('#feed').classList.add('hidden');
  $('#chatSend').onclick = sendChat;
  $('#chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
  $('#emojiBtn').onclick = () => toggleEmojiPop();
  $('#codeChip').onclick = async () => {
    const url = location.origin + BASE + code;
    try { await navigator.clipboard.writeText(url); toast(url); }
    catch (e) { toast(url); }
  };

  // Resume a session if the room still knows us.
  if (sess && sess.token) {
    fetch(BASE + 'api/state?token=' + encodeURIComponent(sess.token))
      .then((r) => (r.ok ? r.json() : null))
      .then((st) => {
        if (!st) { localStorage.removeItem(SESSION_KEY); return; }
        token = sess.token;
        code = st.code;
        enterRoom({ token: sess.token, code: st.code, name: st.you.name, avatar: st.you.avatar });
      })
      .catch(() => { /* stay in the lobby */ });
  }
}

initLobby();
</script>
