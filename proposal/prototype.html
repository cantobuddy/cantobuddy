<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CantoBuddy 2.0 — Screen Proposal (v2, no money)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#e63946; --primary-dark:#c1121f; --primary-light:#f8d7da;
  --secondary:#2a9d8f; --accent:#f4a261;
  --bg:#f7f8fa; --surface:#fff; --text:#1a1a2e; --soft:#6c757d;
  --border:#e0e0e6; --correct:#52b788; --navy:#1d3557;
  --radius:14px; --radius-sm:8px; --radius-lg:20px;
}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}

.side{width:262px;flex:0 0 262px;background:var(--navy);color:#fff;
  padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand-bird{width:34px;height:34px;border-radius:9px;background:#2a4a73;
  display:grid;place-items:center;font-size:18px}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.2px}
.brand small{display:block;font-size:10.5px;color:#9db4d0;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.rolelabel{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8aa4c4;
  margin:22px 0 8px;font-weight:600}
.roletab{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:5px;
  border:0;border-radius:9px;background:rgba(255,255,255,.06);color:#dbe6f2;
  font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s}
.roletab:hover{background:rgba(255,255,255,.12)}
.roletab.on{background:var(--primary);color:#fff;font-weight:600}
.navitem{display:block;width:100%;text-align:left;padding:8px 12px;margin-bottom:3px;
  border:0;border-radius:8px;background:transparent;color:#c3d3e6;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.navitem:hover{background:rgba(255,255,255,.08);color:#fff}
.navitem.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.navitem .num{display:inline-block;width:16px;color:#7f9cc0;font-size:11px}
.foot{margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);
  font-size:10.5px;color:#7f9cc0;line-height:1.6}
.foot b{color:#5dcaa5}
.foot .no{color:#f09595}

.main{flex:1;padding:26px 34px 60px;min-width:0}
.pagehead{margin-bottom:20px}
.pagehead h2{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.2px}
.pagehead p{margin:0;font-size:13px;color:var(--soft)}
.badge-new{display:inline-block;background:var(--primary);color:#fff;font-size:9.5px;
  font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.5px;
  text-transform:uppercase;vertical-align:middle;margin-left:7px}
.badge-exists{background:#2a9d8f}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:10px 0 0}
.notes{max-width:660px;margin:26px auto 0;background:#fff;border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px}
.notes h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--soft)}
.notes ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.75;color:#3d4453}
.notes li{margin-bottom:3px}

.phone{width:390px;flex:0 0 390px;background:#0d1b2a;border-radius:38px;padding:11px;
  box-shadow:0 18px 50px rgba(13,27,42,.28)}
.phone-screen{background:var(--bg);border-radius:28px;overflow:hidden;height:760px;
  display:flex;flex-direction:column;position:relative}
.statusbar{height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:11px;font-weight:600;color:var(--navy);background:var(--surface);
  flex:0 0 32px}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;
  background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.appbar .who{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-light);
  display:grid;place-items:center;font-size:15px}
.appbar b{font-size:13px;font-weight:600}
.appbar .sub{font-size:10px;color:var(--soft)}
.bell{position:relative;font-size:17px}
.bell .dot{position:absolute;top:-3px;right:-4px;background:var(--primary);color:#fff;
  font-size:8.5px;font-weight:700;min-width:15px;height:15px;border-radius:99px;
  display:grid;place-items:center;padding:0 3px;font-family:'Inter'}
.body{flex:1;overflow-y:auto;padding:14px 16px 78px}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:62px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-around;font-size:9.5px;color:var(--soft)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500}
.tabbar .ic{font-size:17px}
.tabbar .on{color:var(--primary);font-weight:700}

.browser{width:100%;max-width:1020px;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 18px 50px rgba(13,27,42,.18);border:1px solid #d8dde5}
.chrome{height:34px;background:#e9ecf1;display:flex;align-items:center;gap:7px;
  padding:0 13px;border-bottom:1px solid #d8dde5}
.chrome i{width:10px;height:10px;border-radius:50%;display:block}
.chrome .url{margin-left:12px;background:#fff;border-radius:6px;padding:3px 12px;
  font-size:10.5px;color:#6c757d;flex:1;max-width:420px}
.web{background:var(--bg);min-height:560px}
.webbar{background:var(--navy);color:#fff;padding:0 22px;height:52px;
  display:flex;align-items:center;justify-content:space-between}
.webbar .l{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.webbar .l .bird{width:27px;height:27px;border-radius:7px;background:#2a4a73;
  display:grid;place-items:center;font-size:14px}
.webbar .r{display:flex;align-items:center;gap:18px;font-size:12px;color:#c3d3e6}
.webbar .r .act{color:#fff;font-weight:600}
.webwrap{padding:20px 22px 26px}
.webhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.webhead h3{margin:0;font-size:17px;font-weight:700}
.webhead p{margin:2px 0 0;font-size:12px;color:var(--soft)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:11px}
.btn{border:0;border-radius:var(--radius-sm);padding:8px 14px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit}
.btn-p{background:var(--primary);color:#fff}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-s{background:var(--secondary);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-block{width:100%;padding:11px;font-size:13px}
.prog{height:7px;background:#eef0f4;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.prog.gr>i{background:var(--correct)}
.pill{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  letter-spacing:.3px}
.pill-red{background:var(--primary-light);color:var(--primary-dark)}
.pill-green{background:#d4edda;color:#1b5e20}
.pill-amber{background:#fff3cd;color:#856404}
.pill-blue{background:#e3f2fd;color:#0d47a1}
.pill-grey{background:#eef0f4;color:var(--soft)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--soft);font-size:11.5px}
.tiny{font-size:10.5px;color:var(--soft)}
.hr{height:1px;background:var(--border);margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px}
.kpi .n{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:3px 0 1px}
.kpi .l{font-size:10.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.sticker{width:52px;height:52px;border-radius:13px;background:var(--bg);border:1px solid var(--border);
  display:grid;place-items:center;font-size:25px;cursor:pointer;transition:.15s}
.sticker:hover{border-color:var(--primary);transform:translateY(-2px)}
.sticker.sel{border:2px solid var(--primary);background:var(--primary-light)}
.sticker-wrap{display:flex;flex-wrap:wrap;gap:9px}
.price{font-size:9.5px;color:var(--soft);text-align:center;margin-top:3px}
.field{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:12.5px;font-family:inherit;background:#fff;color:var(--text)}
.field::placeholder{color:#a9b0bb}
label.fl{display:block;font-size:11px;font-weight:600;margin:0 0 5px;color:#3d4453}
.note-box{background:#fff3cd;border:1px solid #ffe08a;border-radius:var(--radius-sm);
  padding:10px 12px;font-size:11.5px;color:#856404;line-height:1.6}
.ok-box{background:#d4edda;border:1px solid #a3cfbb;border-radius:var(--radius-sm);
  padding:10px 12px;font-size:11.5px;color:#1b5e20;line-height:1.6}
.info-box{background:#e3f2fd;border:1px solid #b6dcfb;border-radius:var(--radius-sm);
  padding:10px 12px;font-size:11.5px;color:#0d47a1;line-height:1.6}
.empty{border:1.5px dashed var(--border);border-radius:var(--radius);padding:26px;
  text-align:center;color:var(--soft);font-size:12.5px;background:#fff}
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;
  border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--primary)}
.tl .ev.g:before{background:var(--correct);box-shadow:0 0 0 1.5px var(--correct)}
.tl .ev.b:before{background:#378add;box-shadow:0 0 0 1.5px #378add}
.dash{border-top:2px dashed var(--border);margin:14px 0}
.credit-badge{display:inline-flex;align-items:center;gap:4px;background:#fff3cd;color:#856404;
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.removed{text-decoration:line-through;opacity:.55}
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand">
      <div class="brand-bird">🐦</div>
      <div>
        <h1>CantoBuddy</h1>
        <small>v2 · no money handling</small>
      </div>
    </div>
    <div class="rolelabel">Role</div>
    <div id="roles"></div>
    <div class="rolelabel">Screens</div>
    <div id="nav"></div>
    <div class="foot">
      Mockup only — no real data.<br />
      Existing screens marked <b>KEEP</b>.<br />
      <span class="no">✕ Payments, store, wallet, cash payouts and donations removed.</span>
    </div>
  </aside>

  <main class="main">
    <div class="pagehead">
      <h2 id="ttl">—</h2>
      <p id="sub">—</p>
    </div>
    <div class="stage" id="stage"></div>
    <div class="notes" id="notes"></div>
  </main>

</div>

<script>
const PHONE = (inner) => `
  <div class="phone"><div class="phone-screen">
    <div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▰</span></div>
    ${inner}
  </div></div>`;

const TABBAR = (active) => `
  <div class="tabbar">
    <div class="${active==='home'?'on':''}"><span class="ic">🏠</span>Home</div>
    <div class="${active==='learn'?'on':''}"><span class="ic">📖</span>Learn</div>
    <div class="${active==='quiz'?'on':''}"><span class="ic">📝</span>Quiz</div>
    <div class="${active==='prog'?'on':''}"><span class="ic">📊</span>Progress</div>
  </div>`;

const WEB = (inner, page) => `
  <div class="browser">
    <div class="chrome">
      <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
      <span class="url">cantobuddy.com${page||''}</span>
    </div>
    <div class="web">${inner}</div>
  </div>`;

const WEBBAR = (who) => `
  <div class="webbar">
    <div class="l"><span class="bird">🐦</span> CantoBuddy <span style="font-weight:400;color:#9db4d0;font-size:12px">for Employers</span></div>
    <div class="r"><span class="act">Helpers</span><span>Stickers</span><span>Rewards</span>
      <span style="color:#fff">${who}</span></div>
  </div>`;

/* ============================================================
   LEARNER (mobile)
   ============================================================ */

const learner = {

dashboard: { title:'Learner · Dashboard', sub:'Personalised learning, streak, and stickers received from the employer.',
  notes:['New screen. Today the learner lands on a plain category list — no sense of progress or reward.',
         'The bell is the single entry point for encouragement and stickers.',
         'Credits are shown as a running total only. No value in money, no redemption by the helper.'],
  html: PHONE(`
    <div class="appbar">
      <div class="who"><div class="avatar">👩</div>
        <div><b>Hi, Jeanilyn</b><div class="sub">Day 12 streak 🔥</div></div></div>
      <div class="bell">🔔<span class="dot">3</span></div>
    </div>
    <div class="body">
      <div class="card" style="text-align:center;background:linear-gradient(180deg,#fff,#fff8f8)">
        <div style="font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.6px">BEGINNER</div>
        <div style="font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:2px 0 0">68<span style="font-size:19px">%</span></div>
        <div class="muted" style="margin-bottom:9px">44 of 64 words practised</div>
        <div class="prog"><i style="width:68%"></i></div>
      </div>

      <div class="row" style="margin:16px 0 8px">
        <b style="font-size:13px">Today's lesson</b><span class="tiny">3 min</span>
      </div>
      <div class="card" style="border-left:4px solid var(--accent)">
        <div class="row">
          <div style="display:flex;align-items:center;gap:11px">
            <div style="font-size:26px">🍳</div>
            <div><b style="font-size:13px">Kitchen words</b><div class="tiny">10 words · new</div></div>
          </div>
          <button class="btn btn-p btn-sm">Start</button>
        </div>
      </div>

      <div class="row" style="margin:16px 0 8px">
        <b style="font-size:13px">From your employer</b><span class="tiny">View all</span>
      </div>
      <div class="card" style="background:#fffdf5;border-color:#ffe08a">
        <div style="display:flex;gap:9px;align-items:center;margin-bottom:9px">
          <div class="sticker" style="width:42px;height:42px;font-size:21px">🌟</div>
          <div class="sticker" style="width:42px;height:42px;font-size:21px">🌟</div>
          <div class="sticker" style="width:42px;height:42px;font-size:21px">💐</div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-weight:800;font-size:15px;color:#856404">280</div>
            <div class="tiny">credits</div>
          </div>
        </div>
        <div style="font-size:11.5px;color:#6b5a1e;line-height:1.6">
          <b>Emily sent:</b> "Great work this week, keep going!" — 2h ago
        </div>
      </div>
    </div>
    ${TABBAR('home')}
  `)},

learn: { title:'Learner · Learn', sub:'This is the existing browse experience — unchanged.',
  notes:['KEEP — already built and working.','Shown here only so you can see it in context.'],
  html: PHONE(`
    <div class="appbar"><div class="who"><div class="avatar">👩</div>
      <div><b>Learn</b><div class="sub">64 words · 11 categories</div></div></div>
      <div class="bell">🔔<span class="dot">3</span></div></div>
    <div class="body">
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        <span class="pill pill-red">All levels</span><span class="pill pill-grey">🌱 Beginner</span>
        <span class="pill pill-grey">🌿 Intermediate</span><span class="pill pill-grey">🌳 Advanced</span>
      </div>
      <div class="grid2">
        ${[['👋','Greetings','問候',8],['💬','Common','常用',12],['🍳','Kitchen','廚房',9],
           ['🧹','Cleaning','清潔',7],['🛒','Shopping','買嘢',6],['🧓','Elder Care','長者照顧',19]]
          .map(([e,en,yue,n])=>`
          <div class="card" style="margin:0;text-align:center">
            <div style="font-size:25px">${e}</div>
            <div style="font-weight:600;font-size:12.5px;margin-top:3px">${en}</div>
            <div class="tiny">${yue} · ${n} words</div>
          </div>`).join('')}
      </div>
    </div>
    ${TABBAR('learn')}
  `)},

notifications: { title:'Learner · Notifications', sub:'Encouragement and stickers in one inbox.',
  notes:['New screen — the core of the motivation loop.',
         'Employer messages and sticker gifts land here.',
         'Off-site bonuses appear as a note from the employer, not as an in-app balance.'],
  html: PHONE(`
    <div class="appbar"><div class="who"><div class="avatar">👩</div>
      <div><b>Notifications</b><div class="sub">3 unread</div></div></div>
      <div class="bell">🔔<span class="dot">3</span></div></div>
    <div class="body">
      <div class="card" style="background:#fffdf5;border-color:#ffe08a">
        <div class="row" style="align-items:flex-start">
          <div style="display:flex;gap:11px">
            <div class="sticker" style="width:44px;height:44px;font-size:22px;border:0;background:transparent">🌟</div>
            <div><b style="font-size:13px">You received 3 Gold Stars</b>
              <div class="muted" style="margin-top:3px">"Great work this week, keep going!"</div>
              <div class="tiny" style="margin-top:4px">+15 credits · 2 hours ago</div></div>
          </div>
          <span class="pill pill-amber">NEW</span>
        </div>
      </div>

      <div class="card">
        <div class="row" style="align-items:flex-start">
          <div style="display:flex;gap:11px">
            <div class="sticker" style="width:44px;height:44px;font-size:22px;border:0;background:transparent">💐</div>
            <div><b style="font-size:13px">Emily sent you flowers</b>
              <div class="muted" style="margin-top:3px">"Thank you for helping with grandma"</div>
              <div class="tiny" style="margin-top:4px">+10 credits · Yesterday</div></div>
          </div>
        </div>
      </div>

      <div class="card" style="border-left:4px solid var(--secondary)">
        <div class="row" style="align-items:flex-start">
          <div style="display:flex;gap:11px">
            <div class="sticker" style="width:44px;height:44px;font-size:22px;border:0;background:transparent">🤝</div>
            <div><b style="font-size:13px">Emily recorded a bonus for you</b>
              <div class="muted" style="margin-top:3px">"Bonus for the 12-day streak — given to you directly"</div>
              <div class="tiny" style="margin-top:4px">2 hours ago</div></div>
          </div>
        </div>
        <div class="info-box" style="margin-top:9px">
          This bonus is arranged between you and Emily outside the app. CantoBuddy does not handle it.
        </div>
      </div>

      <div class="card">
        <div class="row" style="align-items:flex-start">
          <div style="display:flex;gap:11px">
            <div class="sticker" style="width:44px;height:44px;font-size:22px;border:0;background:transparent">🏆</div>
            <div><b style="font-size:13px">7-day streak reached</b>
              <div class="muted" style="margin-top:3px">Keep it up to earn the Silver badge</div>
              <div class="tiny" style="margin-top:4px">3 days ago</div></div>
          </div>
        </div>
      </div>
    </div>
    ${TABBAR('home')}
  `)},

stickers: { title:'Learner · My Stickers', sub:'The collection and the credits earned. Nothing to buy, nothing to cash out.',
  notes:['Rewritten. There is no store, no price and no payout button anywhere on this screen.',
         'Credits are a score, not a wallet — the helper can never withdraw or spend them.',
         'The reward itself is defined by the employer (see the Employer · Rewards screen) and arranged off-platform.'],
  html: PHONE(`
    <div class="appbar"><div class="who"><div class="avatar">👩</div>
      <div><b>My Stickers</b><div class="sub">From your employer</div></div></div>
      <div class="bell">🔔<span class="dot">3</span></div></div>
    <div class="body">
      <div class="card" style="text-align:center;background:linear-gradient(180deg,#fff,#fffdf5)">
        <div class="tiny" style="letter-spacing:.6px;font-weight:700">CREDITS EARNED</div>
        <div style="font-size:38px;font-weight:800;letter-spacing:-1.4px;color:#856404;margin:2px 0 2px">280</div>
        <div class="muted">from 26 stickers received</div>
      </div>

      <div class="card" style="border-left:4px solid var(--secondary)">
        <div style="font-size:12.5px;font-weight:700;margin-bottom:7px">🎁 Emily's reward</div>
        <div style="font-size:12px;line-height:1.65;color:#3d4453">

const ROLES = [
  { id:'learner',  label:'👩  Learner (helper)', screens: learner },
  { id:'employer', label:'🏠  Employer',          screens: employer },
  { id:'admin',    label:'🛠  Admin',             screens: admin },
];

let curRole = 'learner';
let curScreen = 'dashboard';

function render(){
  const role = ROLES.find(r=>r.id===curRole);

  document.getElementById('roles').innerHTML = ROLES.map(r=>
    `<button class="roletab ${r.id===curRole?'on':''}" data-role="${r.id}">${r.label}</button>`
  ).join('');

  document.getElementById('nav').innerHTML = Object.keys(role.screens).map((k,i)=>{
    const s = role.screens[k];
    return `<button class="navitem ${k===curScreen?'on':''}" data-screen="${k}">
      <span class="num">${i+1}</span>${s.title.split('· ').pop()}</button>`;
  }).join('');

  const s = role.screens[curScreen] || role.screens[Object.keys(role.screens)[0]];
  const keep = /KEEP/.test(s.notes.join(' '));
  document.getElementById('ttl').innerHTML = s.title +
    (keep ? '<span class="badge-new badge-exists">Keep</span>' : '<span class="badge-new">New</span>');
  document.getElementById('sub').textContent = s.sub;
  document.getElementById('stage').innerHTML = s.html;
  document.getElementById('notes').innerHTML =
    `<h4>Design notes</h4><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;

  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    curRole = b.dataset.role;
    curScreen = Object.keys(ROLES.find(r=>r.id===curRole).screens)[0];
    render();
  });
  document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{
    curScreen = b.dataset.screen; render();
  });
}

render();
</script>
