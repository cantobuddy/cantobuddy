<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
  .menu-hero { text-align:center; margin: 8px 0 4px; }
  .menu-hero .big { font-size: 3.2rem; }
  .menu-hero .sub { color: var(--muted); font-size: 1.05rem; }
  .levels { display:flex; gap:10px; margin: 6px 0; }
  .levels button { flex:1; min-height:58px; border-radius:14px; border:1px solid var(--line); background:#fff; font:inherit; font-weight:800; font-size:1.1rem; cursor:pointer; }
  .levels button.on { background: var(--primary); color:#fff; border-color:var(--primary); }

  .hud { display:flex; gap:10px; align-items:center; justify-content:space-between; margin: 8px 0; flex-wrap:wrap; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px 14px; font-weight:800; font-size:1.05rem; }
  .stat small { display:block; font-size:.72rem; color:var(--muted); font-weight:700; }
  .hud .btn { min-height:48px; padding:0 16px; }

  .board-scroll { overflow:auto; -webkit-overflow-scrolling:touch; margin: 10px 0; text-align:center; max-height: calc(100vh - 250px); background: radial-gradient(circle at 50% 28%, #2f7d4f, #16512f); border-radius:18px; padding:12px; box-shadow: inset 0 0 30px rgba(0,0,0,.25); }
  .board { position:relative; margin:0 auto; }
  .tile {
    position:absolute; width:46px; height:58px; border-radius:8px;
    background: linear-gradient(160deg,#ffffff,#eef2f8); border:1px solid #c2cddd;
    /* 3D thickness: a solid bottom "lip" + soft drop shadow */
    box-shadow: 0 4px 0 #c2cad8, 0 6px 9px rgba(23,26,35,.22);
    display:flex; align-items:center; justify-content:center; font-size:1.7rem; cursor:pointer; user-select:none;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  /* Higher layers get a deeper shadow so stacked tiles clearly look taller. */
  .tile.layer-1 { box-shadow: 0 5px 0 #aab4c6, 0 8px 12px rgba(23,26,35,.26); }
  .tile.layer-2 { box-shadow: 0 6px 0 #94a0b4, 0 10px 15px rgba(23,26,35,.30); }
  .tile.layer-3 { box-shadow: 0 7px 0 #808da3, 0 12px 18px rgba(23,26,35,.34); }
  /* Locked (covered) tiles are dimmed so the free ones stand out. */
  .tile.locked { filter: saturate(.55) brightness(.95); }
  .tile.locked:active { transform: translateY(2px); }
  /* Free tiles: bright, blue outline, gentle gold glow so they're unmistakable. */
  .tile.free {
    border-color: var(--primary); background: linear-gradient(160deg,#ffffff,#e8f0ff);
    box-shadow: 0 4px 0 #9fb6e6, 0 6px 12px rgba(43,108,240,.35), 0 0 0 2px rgba(43,108,240,.25);
  }
  .tile.free:active { transform: translateY(2px); }
  .tile.sel { outline:3px solid var(--gold); transform: translateY(-3px); z-index: 50 !important; }
  .tile.hint { animation: hintp .7s ease infinite alternate; z-index: 40 !important; }
  @keyframes hintp { from { box-shadow:0 4px 0 #9fb6e6,0 0 0 0 rgba(246,183,60,0);} to { box-shadow:0 4px 0 #9fb6e6,0 0 0 7px rgba(246,183,60,.55);} }
  .tile.gone { display:none; }

  .controls { display:flex; gap:10px; margin: 10px 0; flex-wrap:wrap; }
  .controls .btn { flex:1; min-width:120px; }
  .zoom-bar { display:flex; align-items:center; justify-content:center; gap:16px; margin: 2px 0 6px; }
  .zbtn { width:50px; height:50px; border-radius:14px; border:1px solid var(--line); background:#fff; font-size:1.8rem; font-weight:900; cursor:pointer; color:var(--ink); box-shadow:0 4px 12px rgba(23,26,35,.05); line-height:1; }
  .zbtn:active { transform: scale(.94); }
  .zoom-label { font-weight:800; font-size:1.1rem; min-width:58px; text-align:center; }
</style>
</head>

      var w = L.w - 2 * ly, h = L.h - 2 * ly;
      if (w <= 0 || h <= 0) break;
      var offX = ly * 2, offY = ly * 2;
      for (var r = 0; r < h; r++) for (var c = 0; c < w; c++) {
        out.push({ x: offX + c * 2, y: offY + r * 2, layer: ly, removed: false, sym: null });
      }
    }
    if (out.length % 2 === 1) out.pop(); // keep even for clean pairing
    return out;
  }

  // A slot is free if nothing overlaps it from the layer above AND at least one
  // horizontal side is open (no same-layer neighbour on that side).
  function isFree(s, list) {
    for (var i = 0; i < list.length; i++) {
      var o = list[i]; if (o === s || o.removed) continue;
      if (o.layer === s.layer + 1 && Math.abs(o.x - s.x) < 2 && Math.abs(o.y - s.y) < 2) return false; // covered above
    }
    var left = false, right = false;
    for (var j = 0; j < list.length; j++) {
      var n = list[j]; if (n === s || n.removed || n.layer !== s.layer) continue;
      if (n.y === s.y && n.x === s.x - 2) left = true;
      if (n.y === s.y && n.x === s.x + 2) right = true;
    }
    return !left || !right;
  }

  // Assign symbols by simulating a valid removal order, so the board is always
  // solvable: at each step pick any two currently-free tiles and give them a
  // shared symbol, then remove them from the working set. Replaying that order
  // clears the board.
  function solveAssign() {
    var live = slots.filter(function (s) { return !s.removed; });
    var pool = FACES.slice();
    var pi = 0;
    while (live.length) {
      var free = live.filter(function (s) { return isFree(s, live); });
      if (free.length < 2) {
        // Safety net (should not happen on a centred pyramid): pair up whatever
        // remains so no tile is left truly unmatched.
        shuffle(live);
        for (var k = 0; k + 1 < live.length; k += 2) { var sy = pool[pi++ % pool.length]; live[k].sym = sy; live[k + 1].sym = sy; }
        break;
      }
      shuffle(free);
      var a = free[0], b = free[1];
      var sym = pool[pi++ % pool.length];
      a.sym = sym; b.sym = sym;
      live = live.filter(function (s) { return s !== a && s !== b; });
    }
  }

  function start() {
    var name = $('#nameInput').value.trim() || 'You';
    if (CB.name && CB.name.set) CB.name.set(name);
    var L = LEVELS[level];
    slots = buildLayout(L);
    totalPairs = slots.length / 2; matched = 0; selected = null;
    solveAssign();
    startTime = Date.now();
    $('#menuView').classList.add('hidden');
    $('#gameView').classList.remove('hidden');
    $('#overlay').classList.remove('on');
    layoutBoard();
    render();
    if (timer) clearInterval(timer);
    timer = setInterval(updateHud, 250);
    CBSound.deal();
  }

  function layoutBoard() {
    var maxX = 0, maxY = 0;
    slots.forEach(function (s) { maxX = Math.max(maxX, s.x); maxY = Math.max(maxY, s.y); });
    // Tile pixel size and half-unit scale with SCALE so the board can be zoomed
    // in for easier tapping (real layout, so the scroll area grows too).
    var tw = Math.round(46 * SCALE), th = Math.round(58 * SCALE), hu = Math.round(23 * SCALE);
    var w = maxX * hu + tw + 8, h = maxY * hu + th + 8;
    var board = $('#board'); board.style.width = w + 'px'; board.style.height = h + 'px'; board.innerHTML = '';
    slots.forEach(function (s, i) {
      var d = document.createElement('div');
      d.className = 'tile layer-' + s.layer; d.dataset.i = i;
      d.style.width = tw + 'px'; d.style.height = th + 'px';
      d.style.fontSize = (1.7 * SCALE).toFixed(2) + 'rem';
      d.style.left = (s.x * hu) + 'px';
      d.style.top = (s.y * hu) + 'px';
      d.style.zIndex = s.layer + 1;
      d.onclick = function () { onTile(i); };
      board.appendChild(d);
    });
  }

  function render() {
    var live = slots.filter(function (s) { return !s.removed; });
    var freeSet = {};
    live.forEach(function (s) { if (isFree(s, live)) freeSet[slots.indexOf(s)] = true; });
    var left = 0;
    slots.forEach(function (s, i) {
      var d = $('#board').children[i];
      if (s.removed) { d.className = 'tile gone'; return; }
      left++;
      d.innerHTML = drawFace(s.sym);
      var free = !!freeSet[i];
      d.className = 'tile layer-' + s.layer + (free ? ' free' : ' locked') + (selected === i ? ' sel' : '');
    });
    $('#tilesStat').textContent = left;
    $('#pairsStat').textContent = matched;
    if (left === 0) { win(); return; }
    if (!anyMove()) CBGame.toast(t('noMove'), 'bad');
  }

  function anyMove() {
    var live = slots.filter(function (s) { return !s.removed; });
    var free = live.filter(function (s) { return isFree(s, live); });
    var bySym = {};
    for (var i = 0; i < free.length; i++) {
      var sy = free[i].sym;
      if (bySym[sy] !== undefined) return true; // two free tiles share a symbol
      bySym[sy] = true;
    }
    return false;
  }

  function onTile(i) {
    var s = slots[i]; if (s.removed) return;
    var live = slots.filter(function (x) { return !x.removed; });
    if (!isFree(s, live)) { CBSound.bad(); CBGame.toast(t('pickTile'), 'bad'); return; }
    if (selected === i) { selected = null; render(); return; }
    if (selected === null) { selected = i; CBSound.click(); render(); return; }
    var prev = slots[selected];
    if (prev.sym === s.sym) {
      prev.removed = true; s.removed = true; matched++;
      selected = null; CBSound.match(); render();
    } else {
      selected = i; CBSound.flip(); render();
    }
  }

  function updateHud() { $('#timeStat').textContent = fmt((Date.now() - startTime) / 1000); }

  function hint() {
    var live = slots.filter(function (x) { return !x.removed; });
    var free = live.filter(function (x) { return isFree(x, live); });
    var seen = {};
    for (var i = 0; i < free.length; i++) {
      var sy = free[i].sym;
      if (seen[sy] !== undefined) {
        var a = slots.indexOf(free[seen[sy]]), b = slots.indexOf(free[i]);
        [a, b].forEach(function (idx) { $('#board').children[idx].classList.add('hint'); });
        setTimeout(function () { [a, b].forEach(function (idx) { var el = $('#board').children[idx]; if (el) el.classList.remove('hint'); }); }, 1600);
        CBSound.tick(); return;
      }
      seen[sy] = i;
    }
    CBGame.toast(t('noMove'), 'bad');
  }

  function shuffleBoard() {
    slots.forEach(function (s) { s.removed = s.removed; }); // keep removed state
    solveAssign();
    selected = null; CBSound.flip(); render();
  }

  function win() {
    if (timer) clearInterval(timer);
    var secs = (Date.now() - startTime) / 1000;
    var name = $('#nameInput').value.trim() || 'You';
    var best = null;
    if (CB.scores && CB.scores.record) {
      var before = CB.scores.summary('mahjong', name);
      CB.scores.record('mahjong', name, secs, { won: true, level: level, levelLabel: LEVELS[level].label });
      var after = CB.scores.summary('mahjong', name);
      var lv = (after.levels || []).filter(function (x) { return x.key === level; })[0];
      if (lv && lv.best != null) {
        var prevBest = null;
        (before.levels || []).forEach(function (x) { if (x.key === level) prevBest = x.best; });
        best = (prevBest == null || secs < prevBest) ? secs : null;
      }
    }
    $('#ovTime').textContent = fmt(secs);
    $('#ovBest').textContent = best != null ? '🌟 ' + t('justNow') + ' (' + fmt(best) + ')' : '';
    CBSound.win();
    $('#overlay').classList.add('on');
  }

  $('#startBtn').onclick = function () { CBSound.click(); start(); };
  $('#restartBtn').onclick = function () { CBSound.click(); start(); };
  $('#hintBtn').onclick = function () { CBSound.click(); hint(); };
  $('#shuffleBtn').onclick = function () { CBSound.click(); shuffleBoard(); };
  $('#quitBtn').onclick = function () { if (timer) clearInterval(timer); $('#gameView').classList.add('hidden'); $('#menuView').classList.remove('hidden'); refreshHistory(); };
  $('#againBtn').onclick = function () { CBSound.click(); start(); };
  $('#ovMenuBtn').onclick = function () { $('#overlay').classList.remove('on'); $('#gameView').classList.add('hidden'); $('#menuView').classList.remove('hidden'); refreshHistory(); };

  /* ---- zoom controls (enlarge the board for easier tapping) ---- */
  function applyZoom() {
    SCALE = SCALE_STEPS[scaleIdx];
    $('#zoomLabel').textContent = Math.round(SCALE * 100) + '%';
    layoutBoard();
    render();
  }
  $('#zoomInBtn').onclick = function () { if (scaleIdx < SCALE_STEPS.length - 1) { scaleIdx++; CBSound.click(); applyZoom(); } };
  $('#zoomOutBtn').onclick = function () { if (scaleIdx > 0) { scaleIdx--; CBSound.click(); applyZoom(); } };

  /* ---- how-to-play sheet (same pattern as Chinese Checkers) ---- */
  (function () {
    var rulesBuilt = false;
    function renderRules() {
      if (rulesBuilt) return;
      var r = RULES[CBGame.LANG] || RULES.en;
      $('#rulesTitle').textContent = r.title;
      var body = $('#rulesBody');
      body.innerHTML = '';
      var lede = document.createElement('p');
      lede.className = 'lede';
      lede.textContent = r.lede;
      body.appendChild(lede);
      r.sections.forEach(function (s) {
        var h = document.createElement('h3'); h.textContent = s.h; body.appendChild(h);
        if (s.p) { var p = document.createElement('p'); p.textContent = s.p; body.appendChild(p); }
        if (s.list && s.list.length) {
          var ul = document.createElement('ul');
          s.list.forEach(function (li) {
            var el = document.createElement('li'); el.textContent = li; ul.appendChild(el);
          });
          body.appendChild(ul);
        }
      });
      rulesBuilt = true;
    }
    function openRules(on) {
      var sheet = $('#rulesSheet');
      if (on) { renderRules(); sheet.classList.remove('hidden'); $('#rulesClose').focus(); }
      else { sheet.classList.add('hidden'); }
    }
    var rb = $('#rulesBtn');
    rb.setAttribute('title', (RULES[CBGame.LANG] || RULES.en).title);
    rb.setAttribute('aria-label', (RULES[CBGame.LANG] || RULES.en).title);
    rb.onclick = function () { CBSound.click(); openRules(true); };
    $('#rulesClose').onclick = function () { openRules(false); };
    $('#rulesSheet').onclick = function (e) { if (e.target === $('#rulesSheet')) openRules(false); };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('#rulesSheet').classList.contains('hidden')) openRules(false);
    });
  })();

  /* ---- topbar: Messages sheet + Back to lobby (shared with every game) ---- */
  if (window.CB && CB.topbar) {
    CB.topbar.mount({
      gameName: t('title'),
      name: CB.name.get(),
      labels: {
        messages: t('msgTitle'), lede: t('msgLede'), empty: t('msgEmpty'),
        invite: t('msgInvite'), inviteText: t('msgInviteText'), backLobby: t('backLobby')
      }
    });
  }

  refreshHistory();
})();
</script>
</body>
